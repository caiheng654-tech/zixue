 登录）入口校验；`.env` 没进 git\n- [ ] 系统提示词里有\"资料当数据、不当指令\"的防注入声明\n- [ ] 每步 `trace` 有落盘/日志（可复盘）；设了 `max_steps`（成本护栏下限）\n- [ ] 原样注册了阶段二 `ask()` 为工具，且不改它本身\n- [ ] 用\"引公司手册原话\"的狠问法验证它真在查资料而非背诵\n- [ ] `git push` 上 GitHub，README 含架构图 + 安全/可靠性一段 + 示例输出\n- [ ] 能给朋友边画那张 Agent 图边讲：\"哪一步可能调工具、哪一步是条件分支、卡了在哪复盘\"\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 条件边指向了没定义的函数/名字写错 | 图里函数名与定义不一致 | `add_conditional_edges` 的分支映射与函数名逐一核对（本稿已用 `router` 对齐） |\n| 工具调用裸奔、异常直接崩 | 没加白名单/捕获 | 用 `agent.py` 的 `ToolRegistry`，三防线齐全 |\n| 只做出来，不写 README/不推 GitHub | 当作业不当作品 | 补 README(架构+安全+示例)、push，这才算交付 |\n| 防注入只用一句口号 | 系统提示词没落到代码 | 把\"资料当数据\"写进 system prompt，并意识到\"它可能被诱导\" |\n| 没有成本护栏，被死循环/反复调用烧钱 | 只设了步数或不设 | `max_steps` + 轮次预算 + 外部工具配额 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `agent.py`，能指出\"白名单/异常捕获/兜底/留痕\"各在哪=复位成功。\n2. 跑 `python phase3\\test_agent.py` → `OK` 则可靠性地基没坏。\n3. 看\"验收清单\"，没勾的补上；都齐且 `git push` 后才进阶段四。\n> 记忆锚：**本步 = \"完整 Agent = 图(流程) + 工具(白名单) + 鉴权/防注入(安全) + trace(可观测) + 步数/预算(成本护栏)。能跑=及格，安全+可复盘+卡得住成本=作品。\"**\n\n## 下一步：它能跑、能演示了——但它\"可靠\"吗？\n\n跑通不等于可靠：它有没有答错过、被带偏过？要让人放心、要写进简历，你需要**量化地证明它可靠**——这正是阶段四的主线：评测。\n\n> 进入阶段四 · `05_阶段四_评测与求职`。"}, {"id": "sec20", "group": "阶段四 · 评测与求职", "title": "行业与未来", "basename": "00_背景_行业与未来.md", "markdown": "# 阶段四 · 背景：这一行的饭碗在哪——当下在招什么、未来往哪走\n\n> 这一站解决什么：阶段一二三你搭出了\"会翻资料、会自己调工具、能安全落地\"的完整应用链。但你心里很可能吊着个问题：**这些到底有没有人买单？我学完去哪、值多少钱、会不会明天就过时？** 这一站不灌鸡汤，用 2026-09-19 当天的行业事实，把\"钱从哪来、路往哪走\"讲透——让你学得踏实，抢跑得明白。\n> 判断基准：2026-09-19。\n\n**站纲（跨 3 小步）**\n**先摸清\"当下在招谁\" → 再看\"未来几年往哪走\" → 最后想清楚\"我该占哪个位置\"**\n\n---\n\n## 第 1 步 当下市场在招谁：先看钱和岗位往哪流\n\n不猜，看数据（都是 2026 年的公开事实）：\n- 国内 AI 岗**招聘发布量比两年前涨了近 8 倍**，平均月薪约 **6.3 万元**；海外把 **\"AI 工程师\"列为本年度增长最快的岗位**，Agent 工程师薪酬样本中位约 **$21.6 万**。\n- 但反差在这：多数企业**还没真正把智能体落地**（约只有 **17%** 在用），却有 **60%+ 正计划 1–2 年内部署**。\n\n> 🍳 把它想成\"**修一条还没通电的路**\"。现在修路的人（能落地的工程师）很少，但整座城的规划里\"这条路必须通\"——**每一个现在就能把路修好的人，都是有人抢着要的稀缺工种。** 这就是\"意图→落地之间的大缺口\"：岗位需求是\"落地\"，不是\"会画图纸\"。\n\n**当下招聘现场长什么样**：主流平台正批量放**\"AI 应用开发 / 大模型应用工程师（实习/校招）\"**岗，门槛对新手友好；新一线（长沙岳麓、合肥等）也确实有对应岗位。把岗位职责列出来，你会发现——**这就是你阶段一二三学的整条链，一字不差：\n\n> 智能问答 · 场景化应用开发 · 企业私域知识库（RAG）· 提示工程 · 智能体（Agent）设计 · 工具调用 · 记忆管理 · 自主决策 · 模型微调/上下文学习\n\n一句话：**你要的岗位叫\"大模型 / Agent 应用开发工程师\"，不是纯算法。** 后者拼数学功底、卷得厉害；而你要的这条，恰好是\"能用 + 能落地\"就能进的门。\n\n## 第 2 步 未来几年往哪走：四条主线，全压在你这条链上\n\n别去看那些吓人的\"AI 要取代谁\"，看**工程岗自己的走向**，四条最稳的主线，条条都踩在你已学的东西上：\n\n1. **单 Agent → 多智能体协作**：单个会干的 Agent 只是开始，2027 年起越来越多落地会是\"一群 Agent 分工合作\"。→ 这是你阶段三的自然进阶，底子你已经打好了。\n2. **上下文工程成为真壁垒**：搭一个 Agent 越来越简单，难的是\"**喂对它需要的上下文**\"。纪要怎么存、该检索什么、顺序怎么排。→ 你的 RAG / 工具 / 记忆，全是它的零件。\n3. **从\"能用\"到\"可信、可评测、可观测\"**：demo 谁都会跑，能证明自己可靠的才是硬通货。→ 这一阶段（阶段四）的评测，就是踩在生产最缺的那块上。\n4. **人从\"亲手敲\"转向\"指定 + 验证\"**：工程师的重活从写代码，变成\"把需求说清、把 AI 产出的东西审查验收\"。→ 你一直在用\"让 AI 写 + 你审查\"的方式学，练的正是未来工程师的干活方式。\n\n**岗位时间线**（帮你锚定你的位置）：\n\n```\n2026–27     2027–28(你求职时)      2028–30\n岗位冒头 → 成为\"数字员工团队\"核心 → 变成主流标配岗位\n```\n\n> 也就是说，你现在动的身，恰好是**岗位从\"冒头\"走到\"爆发\"前的抢跑期**——这正是学徒期最容易进场、也最划算的窗口。\n\n## 第 3 步 三个要警惕的未来，别栽进去\n\n看到趋势不是让你亢奋，是让你**清醒地选对位置**：\n\n1. **Agentic AI 一定会经历\"期望回调\"**——周期里总有被吹过头然后挤水分的阶段。但回调恰恰反过来**凸显\"能落地、能评测\"的人的值钱**，挤掉的都是只会喊概念的。\n2. **模型本身在被商品化**（越来越便宜、越来越通用），但\"**把模型接进具体业务并验收**\"这一步不会商品化——**你选的正是不被商品化的那部分**，这才是护城河。\n3. **别追新名词**：今天 GraphRAG、明天某某 Agent 平台。继续用阶段三给你的那把\"尺子\"锚定**稳定范式**（上下文工程、Agent 编排、工具协议、混合检索、评测闭环），牌子爱怎么换随它。\n\n## 验收：能讲懂才算会\n\n1. 用一个比方，说清\"市场需求是落地、不是会画图纸\"这件事。\n2. 列出现在在招岗位的那串关键词，和你学的哪几站对应得上？\n3. 四条未来主线里，随便挑一条，说出它怎么\"踩在你已经学的环节上\"。\n4. 为什么说\"回调反而是你能落地的人的机会\"？\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n本步是\"行业地图\"，不写代码。复位只需一句：**岗位要的是\"能落地、能证明可靠\"的人，你阶段一二三学的整条链正好全是它。** 忘记哪条主线就回看\"四条主线\"那节。\n> 记忆锚：**本步 = \"钱流向'落地'、不流向'会画图纸'；独家护城河是不被商品化的部分——把模型接进具体业务并验收。回调挤掉喊概念的，凸显能落地的。\"**\n\n## 下一步：你知道了市场要什么，现在要让你的东西\"拿得出手\"\n\n有了行业地图还不算完——市场要的是\"**你能给我证明它可靠**\"。下一步评测，就是给你的智能体发一张\"成绩单\"：从\"我觉得不错\"升级成\"我有数字证明\"。\n\n> 进入阶段四 · `01_评测与调优.md`"}, {"id": "sec21", "group": "阶段四 · 评测与求职", "title": "评测与调优", "basename": "01_评测与调优.md", "markdown": "# 阶段四 · 第 1 步：给智能体发一张\"成绩单\"——评测与调优（产出第四交付物）\n\n> 这一站解决什么：前三阶段你让应用\"能跑\"了。但\"能跑\"和\"能被公司信任地上线\"，中间隔着一道很不讲情面的坎：**你凭什么说它输出得好？** 空口\"我觉得不错\"没人买单。这一站教你用**数字**证明——给智能体发成绩单、照着成绩单调优，让它从\"好玩的东西\"变成\"你敢拍胸脯的东西\"。\n> 判断基准：2026-09-20。这也是那条\"从能用→可信、可评测、可观测\"路线的落地实操。\n> 交付物对应：`companion/phase4/evaluator.py`（离线评测闭环 + 回归护栏，零依赖可测）——先把\"评测→分数→回归\"跑通，再接真 Agent/LLM 裁判。\n\n**前置自测（答不上就先回阶段三）**\n1. \"可靠\"凭什么被证明——靠感觉还是靠数字？（一眼）\n2. 你现在的应用，能拿出一句\"我用什么数字证明它好\"吗？\n3. 答错时\"怎么定位是哪一步\"？阶段三给你留的现场是什么（trace/状态）？\n\n**站纲（跨 5 小步）**\n**懂\"为什么要测\" → 攒最小评测集 → 一键跑出成绩单(LLM 当裁判) → 照成绩单调优再测 → 用回归护栏防止\"悄悄退步\"**\n\n---\n\n## 第 1 步 为什么要评测：demo 能跑 ≠ 可以上线\n\n一段话讲透：**Demo 能跑，说明\"逻辑通了\"；能被放上线，说明\"绝大多数时候都答对\"。** 两者差的是什么？差一个\"**你手上有没有证据说它好**\"。\n\n> 🍳 类比：评测就像**教练看比赛回放**。你的 Agent 是上场选手，一场一场打（答一个问题）。你不看回放、不数进没进球，光说\"他今天状态不错\"——那不叫评价，叫感觉。评测就是**把每场的表现录下来、量化成比分**：进几个、投丢几个。有了比分，你才知道该练投篮还是练传球。\n\n所以评测的第一价值不是\"得个分数炫耀\"，而是：**让你有证据、让你找到弱在哪。** 这也正好接住背景那篇的结论——\"可信、可评测、可观测\"就是未来最稀缺的落地能力，你提前练的就是它。\n\n## 第 2 步 建你的最小评测集：20 条\"问题 → 期望\"就够\n\n评测得有脚本，脚本得有\"标准答案\"，这就是**评测集**。做法极简：\n\n- 收集 **20–50 条 `问题 → 期望`**。\"期望\"不一定要逐字，可以是\"**回答里必须点到哪几个要点**\"，或\"给一个可接受的范围\"。\n- 覆盖你项目的**典型刁钻问题**：它最容易答错的、边界上的、容易幻觉的（阶段二优化笔记里你说过要逼它\"答不出就说不知道\"，那些用例正好收进来）。\n- 可以自己攒，也可以让 AI 帮你拟——**但每一条你都要能讲得清\"为什么期望这个\"**，否则这题没意义。\n\n> 一句话底线：**评测集 = \"你要它保证能答对的那些题\"**。将来简历里那句\"准确率从 60% 提到 85%\"，数字就是在这套题上算出来的——所以题目得有代表性，别挑软柿子捏。\n\n## 第 3 步 让它一键跑出成绩单（重点：让 LLM 当裁判）\n\n手动一条条比对太累，业界有个聪明招：**LLM-as-judge——让大模型来当裁判**。你把\"问题 + 期望 + 智能体的回答\"都交给它，让它判断\"符合 / 不符合\"，你再统计比例。这样你只要攒题目，判分交给 AI，评测规模就能轻松扩大。\n\n先写个小助手当裁判（这一步不碰你的 Agent，先学会\"打分\"这条路）：\n\n```python\nimport requests, os\nfrom dotenv import load_dotenv\nload_dotenv()\nAPI_KEY = os.getenv(\"DEEPSEEK_API_KEY\")\nurl = \"https://api.deepseek.com/chat/completions\"\nheaders = {\"Authorization\": f\"Bearer {API_KEY}\", \"Content-Type\": \"application/json\"}\n\ndef judge(question, expected, answer):\n    prompt = (f\"你是严谨的评委。问题：{question}\\n\"\n              f\"期望回答的要点：{expected}\\n\"\n              f\"智能体实际回答：{answer}\\n\"\n              f\"请只输出 符合 或 不符合，并一句话说理由。\")\n    resp = requests.post(url, headers=headers,\n        json={\"model\": \"deepseek-chat\",\n              \"messages\": [{\"role\": \"user\", \"content\": prompt}]})\n    return resp.json()[\"choices\"][0][\"message\"][\"content\"]\n\n# 一条完整评测：喂\"问题+期望\"，先拿到你的 Agent 的回答，再让评委打分\nquestion = \"我们产品的退货流程是怎样的？\"\nexpected = \"要提到：先和客户确认原因、再提交退货单、7 个工作日审核\"\nanswer = judge(question, expected, answer=\"你自己调用的 Agent 那步输出\")  # ← 这里换成真回答\nprint(judge(question, expected, answer))\n```\n\n> 看懂这条路：**评测= 拿问题丢给 Agent 拿回答 → 把\"问题+期望+回答\"丢给评委判分 → 统计符合率。** 你把这一遍做成一个循环扫完整套题，就得到第一张成绩单，比如\"15/20 符合 = 75%\"。\n\n### 训练营增量：评测闭环先离线测通，再接真 LLM\n\n\"评测→分数→回归\"这套机制，不该等真 LLM/Key 才学。`companion/phase4/evaluator.py` 把它先做成引擎，用**确定性规则裁判**离线跑通：评测集 → 拿回答 → `rule_judge`(要点是否都在，这就是\"穷人版 LLM-as-judge\") → 准确率 → `--check <基线>` 门禁。\n\n```shell\npython phase4\\test_evaluator.py       # 5 项：判分/准确率/回归亮红/插拔\npython phase4\\evaluator.py --check 0.7   # 当作\"回归门禁\"：低于基线退出码非 0\n```\n\n> 🔬 训练营要求：对照 `evaluator.py` 看懂 `EVAL_SET / rule_judge / run_eval / accuracy / check` 五块。**接真环境时，把 `StubAgent` 换成你的 RAG/Agent、把 `rule_judge` 换成上面的 `judge`(LLM-as-judge)，数字逻辑一行不改。** 评测动手的摩擦点先在这里磨平。\n\n## 第 4 步 照成绩单调优，再测一次（这才是闭环）+ 用回归护栏防\"悄悄退步\"\n\n评测不是测完晾在一边得个分数，它唯一的意义是**反过来把系统改好**。拿到 75% 后，看\"答错的那批是哪类\"，对着表对症下药：\n\n| 想提升 | 试着调 |\n|---|---|\n| 检索质量低、答非所问 | 混合检索(BM25+向量) + Rerank（阶段二优化那篇讲过） |\n| 语气/格式不对 | 调 system 提示词、加输出格式约束 |\n| 答得过发散、爱跑题 | 调低 temperature；期望里写更具体的要求 |\n| 偶尔幻觉、硬编 | 往评测集加边界用例，逼它\"答不出就说不知道\" |\n\n- **每改一个参数，重跑一遍评测**，记下 `改前 → 改后`。你会得到一句可以直接写进作品集的大白话：\n  > \"把准确率从 60% 提到 85%，因为我把检索改成混合式、并补了一组'答不出就承认'的评测用例。\"\n- **并且把这个评测接进 CI 当\"回归护栏\"**（companion 已经做了）：每次 `git push` 自动重跑评测，**一旦准确率低于基线就亮红**——这样你不会某天发现自己偷偷把系统改退步了还不自知。这就是\"防回退\"。\n\n> 看到没？**这不是\"我优化了系统\"，而是\"我用数字证明我优化了系统\"，而且永远不会退步回去。** 后者正是企业要的那个\"可信\"，也是让面试官眼睛一亮的那句话。\n\n### 进阶记忆点：可观测性（生产级标配）\n\n分数之外，专业做法还要求**记录过程**：这次回答它调了哪些工具、检索到哪几段、在哪一步出的错。有了这些日志，答错时你能**顺着链路定位**是\"没检索到\"还是\"工具调错\"还是\"模型跑偏\"——这跟你阶段三 `agent.py` 里练的 `trace` 是一套。哪怕你现在只加个 `print` 存日志都算起步，别忽略。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 跑 `python phase4\\test_evaluator.py`，输出 `OK`（5 项）\n- [ ] 跑 `python phase4\\evaluator.py --check 0.7`，退出码 0（基线门禁在）\n- [ ] 攒出你自己的 `≥20` 条「问题→期望要点」，每条都能讲清\"为什么期望这个\"\n- [ ] 用 `evaluator.py` 的 `run_eval`/`accuracy` 把你的回答跑出第一张成绩单\n- [ ] 读到一条答错的，能说清\"先看哪类错误、据此调哪\"（别只答\"调参\"）\n- [ ] 能讲懂 `rule_judge` 和 LLM-as-judge 的关系：一个离线确定性、一个真环境，逻辑一致\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 评测集全是\"简单题\"，数据好看但没用 | 挑软柿子 | 重点收\"它最容易错/边界/爱幻觉\"的用例 |\n| \"期望\"写太死，一个词不差才叫对 | 把期望当标准答案 | 期望=必须覆盖的**要点**（可接受范围） |\n| 只测不发数字，改没改没记录 | 没跑回归 | 接 CI / 用 `--check` 基线，低于即亮红 |\n| 拿到分数就停 | 评测≠交付 | 评测的价值是\"反过来调优\"；分数是起点不是终点 |\n| 靠 LLM 裁判但没说明白\"判给谁看\" | 只给\"问题+回答\" | 一定要给裁判\"期望要点\"，否则它没尺子 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `evaluator.py`，能把 `EVAL_SET→run_eval→accuracy→check` 五块指出来=复位成功。\n2. 跑 `python phase4\\test_evaluator.py` → `OK` 则评测引擎没坏。\n3. 看\"验收清单\"，没勾的补上；尤其把你的\"20 条评测集\"建起来再说下一步。\n> 记忆锚：**本步 = \"评测集(问题→要点) → 判分(LLM当裁判/离线规则) → 准确率 → 调优重测 → 接 CI 当回归门禁防退步。分数是证据，不是目标。\"**\n\n## 下一步：有成绩单了，把它真正\"交出去\"用起来\n\n评测证明它\"可靠\"。但一个要给别人/给生产用的东西，还差一趟**部署**：怎么安全地开放接口（鉴权/CORS）、怎么让回答\"流式吐字\"体验跟得上、怎么用同一套 CI 把每次改动守稳。下一站就补上这最后一块拼图。\n\n> 进入阶段四 · `02_部署与CI.md`"}, {"id": "sec22", "group": "阶段四 · 评测与求职", "title": "部署与CI", "basename": "02_部署与CI.md", "markdown": "# 阶段四 · 第 2 步：把\"有成绩单的应用\"真正交出去——部署与 CI\n\n> 这一站解决什么：评测让你手里攥着一份\"我有数\"的成绩单，但东西还停在你的电脑里。要**真正交出去**（给同事用、挂到线、写进作品集当\"可上线\"），还差一趟工程活：**安全地开放接口（鉴权/CORS）→ 让回答\"流式\"、体验不掉队 → 用同一套 CI 把每次改动守稳（含评测回归门禁）。** 这一站把\"能跑\"的 app 变成\"敢上线\"的 app。\n> 判断基准：2026-09-20。部署方式和框架会变，但\"鉴权+跨域+流式+CI 守门\"这四个工程常识永不过时。\n> 交付物对应：`companion/.github/workflows/ci.yml`——companion 已把全库冒烟 + **评测回归门禁**接进 CI，这一站教你把思路复用到自己的项目。\n\n**前置自测（答不上就先回上一篇）**\n1. 你的应用现在怎么被别人调用？需不需要\"拦一下谁有资格用\"？\n2. 评测\"防退步\"靠什么？在哪能设一条红线？\n3. 后端暴露接口给网页/App 调用时，可能撞到什么\"跨域\"问题？\n\n**站纲（跨 4 小步）**\n**想清\"交付\"到底要暴露什么 → 装两道安全门(鉴权/CORS) → 让输出流式送、体验不掉队 → 用 CI+回归门禁把每次改动守稳**\n\n---\n\n## 第 1 步 先想清：你要交付的是一个\"接口\"，不是一段脚本\n\n脚本是你自己敲回车；交付是**别人通过一个 URL 来请求、拿到结果**。于是暴露了什么、谁来访问、返回快不快，全都变成要回答的问题：\n\n- **暴露什么**：几个入口（如 `POST /ask` 接收问题、返回答案）＝你把 stage2/3 的 `ask` 或 `agent` 包成的一个个路由。\n- **谁有资格访问**：不能是全世界任意人都能白嫖你的模型调用（那等于给别人烧你的钱）。\n- **返回多快**：大模型生成要几秒，用户等得难受——要让它\"边生成边吐出来\"。\n\n> 🍳 类比：脚本像**你亲自排队买饭**；交付接口像**开了一个取餐窗**。要挂\"只给会员取\"的牌子（鉴权）、装好\"外人别翻错窗口\"的栏（CORS）、还要\"做好了先端给你、别一整锅端\"（流式）。\n\n## 第 2 步 装第一道门：鉴权（谁有资格用）\n\n和阶段三给 Agent 加\"入口校验\"同一招，给接口挂一个 **API Key**：请求头带合法的 Key 才放行，否则 401/403。\n\n```python\n# 伪代码：一个\"只认 Key\"的拦截\ndef require_auth(request):\n    key = request.headers.get(\"X-API-KEY\")\n    if key != EXPECTED_KEY:                 # EXPECTED_KEY 从 .env 读，别写死\n        return \"拒绝访问\", 403\n```\n\n> 三个要点：**Key 走 `.env`/环境变量，不写死在代码、不进 git**；接口背后在花钱（调大模型），鉴权是\"钱\"的守门员；**鉴权不是可选项**——是\"能给别人用\"的基本功。\n\n## 第 3 步 装第二道门：CORS（网页/App 访问别被浏览器拦）\n\n如果你把接口开放给**浏览器里的网页**或移动端调用，会撞上浏览器的**同源策略**——默认不允许一个网页去请求不同源的接口。这就是 **跨域（CORS）** 问题。对策是在接口响头上告诉浏览器\"允许这些来源访问\"：\n\n```\nAccess-Control-Allow-Origin: https://你的前端域名     # 别写 *（任何来源都能来）\nAccess-Control-Allow-Methods: POST, GET, OPTIONS\nAccess-Control-Allow-Headers: Content-Type, X-API-KEY\n```\n\n> 一句话：**CORS = 给你的接口开\"允许哪些来源来取餐\"的白名单。** 网上图省事常写 `*`（任何来源），但配合鉴权，**尽量收紧到你真前端那个源**，别全放开。\n\n## 第 4 步 让回答\"流式\"吐出，体验不掉队（Streaming）\n\n大模型生成要几秒。整段等齐再返回，用户体验很差；**流式（streaming）= 一边生成一边把内容一点点推给前端**，像打字机。\n\n```python\n# 伪代码：开 stream 参数，逐块 yield 给前端（S**S**E / 分块），不攒满整段\ndef ask_stream(question):\n    for chunk in chat_stream(question):   # 你的大模型调用开了 stream=True\n        yield chunk                        # 每生成一小段就往回推\n```\n\n- 前端拿到的是\"一个接一个片段\"，能边收边显示，\"秒响\"。\n- 你现在不必深究传输细节，**知道\"该流式、别让用户干等\"这一个工程常识**就达到本阶段要求；真做时跟着你所用框架的官方流式示例走一遍即可。\n\n## 第 5 步 用同一套 CI 把每次改动守稳（含评测回归门禁）\n\n你改一行代码，怎么知道\"没把以前好的东西搞坏\"？靠 **CI（持续集成）**：`git push` 时自动跑一遍检查，红了就不放行。companion 的 `ci.yml` 已经是这个模板：\n\n```yaml\n- name: 冒烟测试        # 全库可运行契约：每个阶段的可测件都在这跑\n  run: python phase1/test_smoke.py && ... phase4/test_evaluator.py\n- name: 评测回归门禁      # ← 关键：评测进 CI，低于基线亮红\n  run: python phase4/evaluator.py --check 0.7\n- name: 语法编译检查      # 代码能编译\n```\n\n> 🔬 训练营要求：**把 `evaluator.py --check 0.7` 接进你自己的 CI。** 这就是\"回归护栏\"落地——以后你每次改模型/提示词/检索，`push` 一过，分数低于 70% 直接红，你才知道\"这版把系统改退了\"。**配合阶段三的 `max_steps`+预算，这层就是成本和质量的守门员。**\n\n---\n\n## 这一步的产出：一个\"能上线、敢上线\"的交付\n\n- 接口有**鉴权**（Key 从 `.env` 读），前端有**CORS 白名单**；\n- 回答走**流式**，体验不掉队；\n- 仓库 `push` 自动跑**测试 + 评测回归门禁 + 编译**，红了有人拦。\n- 把它和 01 的成绩单一起写进 README：\"可上线：鉴权✓ CORS✓ 流式✓ CI+评测回归✓\"——这句就是\"作品\"和\"作业\"的分界线。\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 能给接口设计一个\"入口 + 鉴权校验\"（伪代码即可，Key 走 `.env`）\n- [ ] 能讲清 CORS 是干嘛的、为什么别随便写 `Access-Control-Allow-Origin: *`\n- [ ] 知道流式(streaming)解决什么问题，\"打字机式\"返回的意义\n- [ ] 复用/看懂 `companion/.github/workflows/ci.yml`：里面有哪三步、各守什么\n- [ ] 能讲清\"评测回归门禁\"为什么挂在 CI 里 = 防退步\n- [ ] 把 `evaluator.py --check <你的基线>` 接进你自己的仓库 CI（或至少写进 README 说明）\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 接口无鉴权、裸奔 | 只想\"先能通\" | 补 API Key；别写死、走 `.env` |\n| CORS 写 `*` | 图省事 | 收紧到你前端真实域名 |\n| Key 被 git 提交 | 没 `gitignore` | `.gitignore` 写 `.env`；泄露就吊销换新 |\n| 整段等齐才返回，体验慢 | 没用流式 | 开 stream 逐块推送；不必自己造轮子，用框架官方示例 |\n| CI 挂了不清楚为啥 | 一堆步骤混着跑 | 每步分开命名（冒烟/回归/编译），哪步红看哪步 |\n| 改完 push 了才后悔（变退步） | 评测没进 CI | 把 `evaluator.py --check` 接进 push 前的 CI |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/.github/workflows/ci.yml`，能对上\"冒烟/回归/编译\"三步=复位成功。\n2. 跑 `python phase4\\test_evaluator.py` 和 `evaluator.py --check 0.7` 都绿=环境没坏。\n3. 看\"验收清单\"，没勾的补上；勾满进下一步（求职）。\n> 记忆锚：**本步 = \"交付=把 app 包成接口：鉴权(谁有资格)+CORS(谁能被浏览器放行)+流式(别让用户等)+CI(每次改动有回归门禁)。四件都是'能上线'的常识。\"**\n\n## 下一步：把你\"能上线、有成绩单\"的东西变成入职门票\n\n部署把\"能给别人用\"坐实了，你还差最后一步：把这些**翻译成简历能写、面试能讲**的入场券。下站收尾：作品集、简历、面试。\n\n> 进入阶段四 · `03_求职-简历与面试.md`"}, {"id": "sec23", "group": "阶段四 · 评测与求职", "title": "求职-简历与面试", "basename": "03_求职-简历与面试.md", "markdown": "# 阶段四 · 第 3 步：把\"学到的\"翻译成\"入职门票\"——作品集、简历、面试\n\n> 这一站解决什么：到这里，你手里已经有了能跑、有成绩单、还能上线交付的完整应用链。但**会做和能被录用是两码事**——招聘官看不了你脑子里的东西，只能看\"你给他看的东西\"。这一站教你三步把它翻译成门票：**用一个能点开就跑的作品集 → 把简历从\"堆名词\"改成\"亮数字\" → 面试从\"表演会\"改成\"讲得懂\"。**\n> 判断基准：2026-09-20。目标：新一线、大模型/Agent 应用开发方向。这是全库的收官。\n> 交付物对应：把它和 companion 整条链对齐——你的作品仓库就是\"companion 的放大版\"，自带测试、评测、CI（不装看不见的都能看见）。\n\n**前置自测（答不上就先回上一篇）**\n1. 你现在能拿出的\"数字证据\"有哪些？（评测准确率？可观测日志？）\n2. 你的东西能不能\"clone 下来就能跑\"？年份、环境说明写清楚没？\n3. 面试官问\"你凭什么说它可靠\"，你能答出什么？\n\n**站纲（跨 4 小步）**\n**作品集(最硬的敲门砖) → 简历(把学过写成做成) → 面试(亮原理不背定义) → 谈\"为什么你这套就是稳定范式\"加分**\n\n---\n\n## 第 1 步 作品集：最硬的敲门砖，是\"能点开就跑\"的仓库\n\n你是自学者、非科班，没有大厂履历背书，那你的**证据就得比有履历的人更硬**。最硬的是什么？**一个陌生人 `git clone` 下来就能跑、还自带量化结果的东西。**\n\n- 把阶段二 RAG + 阶段三 Agent + 阶段四评测/部署，**合成一个能跑的应用**（串起\"读本地资料 → 自主调工具 → 有成绩单 → 能上线\"），整理成一个 **GitHub 仓库**：\n  - `README.md`：讲清三件事——**它解决什么问题 / 怎么实现的（一张架构图） / 怎么跑起来**，再把评测对比表放最显眼处，并写明安全（鉴权/CORS）与**自带测试+CI**（\"push 即测\"）。\n  - 代码 + 环境说明，做到\"别人 clone 下来 `.env` 配个 Key 就能 `python run.py`\"。\n- 从**第一天**就每个项目上 GitHub，别等做完才整理——边写边上，git log 本身就是你的成长记录（也是面试可讲的素材）。\n\n> 🍳 类比：作品集等于**开一家给别人进店参观的店**。光在仓库里堆一堆 `.md` 和散代码，等于店门锁着、货架乱摆。你要的是\"客人一进门就能看到招牌菜、尝一口就明白\"——README 就是招牌，能跑就是能尝，CI 就是\"卫生执照\"。\n\n## 第 2 步 简历：把\"学过的\"写成\"做成的\"\n\n最容易犯、也最没用的写法：**罗列技术名词**——\"熟悉 LangChain / Chroma / RAG / Agent\"（一句）。这不叫履历，叫目录，人人都能抄，毫无差异。\n\n要改成 **数字 + 场景** 的\"做成了什么\"：\n\n- ✅ \"搭了一个能读本地资料回答的智能体，用评测集把准确率从 **60% 提到 85%**\"\n- ✅ \"让 Agent 自主调用 RAG + 搜索工具完成多步任务，失败可恢复、越权被拒，并用可观测日志定位问题\"\n- ✅ \"接入真实业务文档做成内部问答助手，配了鉴权/流式，接 CI 每次 push 自动跑评测回归\"\n- ❌ \"熟悉 RAG、Agent、向量数据库\"（无差异，删）\n\n> 一句话心法：**数字是证据，名词是目录。** 招聘官一天看几百份，让他 5 秒内抓到\"你能把事做成、还有数\"——而不是\"你背过哪些词\"。岗位写\"**大模型 / Agent 应用开发工程师**\"，别蹭\"算法工程师\"（那边卷的是数学功底，不是你的主场）。\n\n## 第 3 步 面试：他们几乎不考背诵，考的是\"你懂了没\"\n\n面试官最反感照背八股。你要做的是**把原理摊开讲、还讲得出为什么**——这正是本库一路逼你\"能用自己的话讲\"练出来的优势。三个高频方向，把\"原理\"答出来就行：\n\n- **RAG 为什么有、怎么做、什么时候不够用**\n  → 讲成一句话：\"因为大模型不知道我的世界，所以我先把资料切成块、转成向量存起来；提问时找出最像的几块，让模型只看着这几块答。不够用（搜不准）就上混合检索 + rerank。\"\n- **Agent 怎么决定调哪个工具、怎么停下来**\n  → 讲成循环：\"模型先想一步 → 说'要我调用X'→ 我调 X 把结果放回上下文 → 它再看要不要继续 → 直到它判定目标达成才停；还要讲它怎么不翻车——白名单不让它乱调、失败喂回去、`max_steps` 兜底防止烧钱。\"\n- **评测怎么证明它可靠**\n  → 直接亮你的那组 `60% → 85%`，并补一句\"我还把它接进了 CI，低于基线就亮红，防止回退\"。**最好当场给他跑一遍**。你不只是\"会做\"，你\"有数\"，这个印象分极顶。\n\n### 进阶加分：把你学的锚到\"稳定范式\"上\n\n面试官若问\"新技术这么多你怎么办\"，把阶段三给你的那把尺子掏出来：**\"范式是规矩、库名是牌子。我锚的是上下文工程、Agent 编排、工具协议、混合检索、评测闭环这些稳定范式；框架换牌子没关系，脚下的规矩不换。\"**——这句话一出口，你就不是\"会几个工具的人\"，而是\"懂底层逻辑的人\"，这正是非科班最值钱的那点。\n\n> 一句话心法：**不表演会，要显得懂。** 真答不上来，就诚实说\"这一步我没深究，但我知道它为什么重要、怎么查\"，然后自然转回你懂的——这比硬编一句强得多。这种\"不懂就认、但知道怎么找答案\"的诚实，本身就是这些岗位喜欢的基本盘。\n\n## 提前就开始的几件事（别等最后）\n\n- **冷启动别慌**：第一个项目小一点没关系，先把\"能跑 + 有 README + 有评测 + 有 CI\"循环跑顺，后面自然越做越正规。\n- **把那\"一条链\"练到 5 分钟讲完**：从\"解决什么问题 → 怎么实现（架构） → 靠什么数字证明可靠 → 怎么上线（鉴权/CI）\"。面试前对着手机录一遍，讲到不卡壳。\n- **保住底线加分项**：应届筛选常看 GPA 底线，别让它成为硬门槛把你刷掉。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 你的作品仓库：clone 下来能跑 + README(问题/架构/怎么跑) + 评测表 + 安全/CI 一段\n- [ ] 简历里至少 3～4 条是\"数字+场景\"的表达，删掉了纯名词罗列\n- [ ] 能把 RAG/Agent/评测三个高频题各用\"原理一句话\"讲完（不背定义）\n- [ ] 能给朋友 5 分钟讲完\"做什么→怎么实现→拿什么证明→怎么上线\"\n- [ ] 能说出\"稳定范式 vs 库名\"一把尺子，应对\"新技术怎么办\"\n- [ ] 把整条链每个阶段的作品都 `git push` 上了（git log 有成长脚印）\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 简历堆名词没数字 | 以为\"熟悉XXX\"就行 | 改成\"做成了什么 + 数字 + 场景\" |\n| 作品不写 README/不上 GitHub | 当作业不当作品 | 补 README(问题/架构/怎么跑/评测/CI)，push |\n| 面试背八股 | 怕答不上 | 用\"原理一句话 + 为什么\"讲，诚实说不会+怎么查 |\n| 只给工具名不讲底层 | 不会归因 | 把每个能力锚回\"稳定范式\"，答\"规矩不换\" |\n| 一点边角才写进简历 | 想包装 | 数字要有真实评测撑，别编（一追问就穿帮） |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开你的作品仓库 README，能一眼看到\"问题/架构/评测/CI\"四块=复位成功。\n2. 对着手机录一遍\"5 分钟一条链\"，能不卡壳讲完=面试基本盘复位。\n3. 看\"验收清单\"，没勾的补上；都齐就可以开始投了。\n> 记忆锚：**本步 = \"把学到变成门票：作品能 clone 就跑+自带评测和 CI；简历亮数字不堆名词；面试讲原理不背定义，并把能力锚回稳定范式。\"**\n\n## 下一步：你已经把整条链走完了\n\n从\"请大模型聊个天\"到\"会翻资料、会自主调工具、有成绩单、能上线、能讲给面试官听\"——这就是两个月的完整闭环。剩下的就是**边做边投、在真实反馈里迭代**。回头看开头那句\"两个月转行\"：你手里握着的，不是计划，是真能进门的东西。\n\n> 全库收官 · 返回阅读 → `00_README_先读我.md`"}, {"id": "sec24", "group": "成长记录", "title": "学习打卡模板", "basename": "99_学习打卡模板.md", "markdown": "# 学习打卡模板\n\n> 每天花 5 分钟更新。它帮你\"看见\"进度，也帮你发现卡点。\n> 用法：每个学习日复制一份下面的内容，填上今天几号、第几天。\n\n---\n\n## 📅 日期 / 周天\n- 日期：____年__月__日\n- 属于计划第：**第 __ 天**\n- 今天投入：__ 小时\n\n## 🎯 今天学/做了啥（1–2 行，别糊弄）\n```\n\n```\n\n## ✅ 今天掌握了什么（能讲给别人听的 1 条）\n```\n\n```\n\n## 🚧 卡在哪（写具体！超过 2 小时没解决就\"把问题描述清楚\"去问）\n```\n\n```\n\n## 📊 距离本阶段\"能演示的交付物\"还差\n- 还差：______\n- 预估还需：__ 天\n\n## 📝 明天要做的一件事（最小、能完成）\n```\n\n```\n\n---\n\n### 每周日晚做\"给自己讲课\"\n模拟教一个不懂的人这周的项目。讲不出来的地方 = 要补的地方，写下来：\n\n```\n\n```\n\n### 进度水位（勾选）\n- [ ] 这周交付物能当着别人的面跑通\n- [ ] 我不看笔记能从头讲到尾\n- [ ] 我知道下周最重要的一件事是什么"}];

    '</div>'+marked.parse(d.markdown)+'<div class="prevnext"></div></article>';
}).join('');
const basenameToId={};
DATA.forEach(d=>basenameToId[d.basename]=d.id);
const tocList=document.getElementById('tocList');
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderTOC(){
  tocList.innerHTML='';
  let last=null;
  DATA.forEach(it=>{
    if(it.group!==last){
      last=it.group;
      const g=document.createElement('div');g.className='toc-group';
      g.innerHTML='<div class="g-label">'+escapeHtml(it.group)+'</div>';
      tocList.appendChild(g);
    }
    const a=document.createElement('a');a.href='#'+it.id;a.id='toc-'+it.id;
    a.textContent=it.title;a.dataset.group=it.group;
    tocList.lastChild.appendChild(a);
  });
}
renderTOC();
const filter=document.getElementById('tocFilter');
filter.addEventListener('input',()=>{
  const q=filter.value.trim().toLowerCase();
  document.querySelectorAll('.toc-group').forEach(g=>{
    g.style.display='none';
    g.querySelectorAll('a').forEach(a=>{
      const ok=!q||a.textContent.toLowerCase().includes(q)||a.dataset.group.toLowerCase().includes(q);
      a.style.display=ok?'':'none';
      if(ok)g.style.display='';
    });
  });
});
// 正文内相对 .md 链接跳转
root.addEventListener('click',(e)=>{
  const a=e.target.closest('a[href]');if(!a)return;
  const m=(a.getAttribute('href')||'').match(/(?:^|[\\/])([^\\/]+)\.md$/);
  if(m&&basenameToId[m[1]]){e.preventDefault();location.hash=basenameToId[m[1]];}
});
// 上一篇 / 下一篇
const articles=Array.from(root.querySelectorAll('article'));
articles.forEach((art,idx)=>{
  const box=art.querySelector('.prevnext');
  const prev=idx>0?DATA[idx-1]:null;
  const next=idx<DATA.length-1?DATA[idx+1]:null;
  let h='';
  if(prev)h+='<a class="prev" href="#'+prev.id+'">← '+prev.title+'</a>';
  if(next)h+='<a class="next" href="#'+next.id+'">'+next.title+' →</a>';
  box.innerHTML=h;
});
// 阅读位置高亮
const tocAnchors=DATA.map(d=>document.getElementById(d.id));
const tocLinks=Object.fromEntries(DATA.map(d=>[d.id,document.getElementById('toc-'+d.id)]));
const obs=new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      Object.values(tocLinks).forEach(a=>a.classList.remove('active'));
      const link=tocLinks[en.target.id];
      if(link){link.classList.add('active');link.scrollIntoView({block:'nearest'});}
      const idx=DATA.findIndex(d=>d.id===en.target.id);
      prog.textContent=(idx+1)+' / '+DATA.length;
    }
  });
},{rootMargin:'-20% 0px -65% 0px'});
DATA.forEach((_,i)=>obs.observe(document.getElementById(DATA[i].id)));
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  bar.style.width=(h>0?(window.scrollY/h)*100:0)+'%';
});
const themeBtn=document.getElementById('themeBtn');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('manual-theme',t);}catch(e){}}
try{const s=localStorage.getItem('manual-theme');if(s)setTheme(s);}catch(e){}
themeBtn.addEventListener('click',()=>{
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
});
const toc=document.getElementById('toc');
document.getElementById('tocBtn').addEventListener('click',()=>toc.classList.toggle('open'));
document.querySelectorAll('.toc a').forEach(a=>a.addEventListener('click',()=>{if(window.innerWidth<=940)toc.classList.remove('open');}));
</script>
</body>
</html>
