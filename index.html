<style>
:root{
  --accent:#E60012; --accent-soft:#fdeeef; --accent-ink:#9b0010;
  --bg:#f5f5f4; --surface:#ffffff; --surface-2:#f0f0f0;
  --text:#1a1a1a; --text-2:#555; --text-3:#898989;
  --border:#e2e2e0; --shadow:0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --accent:#ff3b4b; --accent-soft:#3a1014; --accent-ink:#ff8d97;
  --bg:#131313; --surface:#1b1b1b; --surface-2:#222;
  --text:#e6e6e6; --text-2:#b0b0b0; --text-3:#7d7d7d;
  --border:#2e2e2e; --shadow:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.8;font-size:16px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:12px 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar .logo{font-weight:700;font-size:16px;letter-spacing:.3px}
.topbar .logo em{font-style:normal;color:var(--accent)}
.topbar .spacer{flex:1}
.topbar .progress{font-size:12px;color:var(--text-3)}
button.icon{appearance:none;border:1px solid var(--border);background:var(--surface);
  color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button.icon:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:grid;grid-template-columns:300px 1fr;max-width:1180px;margin:0 auto}
aside.toc{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;
  padding:20px 12px 40px;border-right:1px solid var(--border);
  background:var(--surface);font-size:14px}
.toc-input{width:100%;padding:8px 10px;margin-bottom:12px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface-2);color:var(--text);font-size:13px}
.toc-group{margin-bottom:16px}
.toc-group .g-label{font-size:11px;color:var(--text-3);font-weight:600;
  letter-spacing:.6px;text-transform:uppercase;margin:6px 10px 4px}
.toc a{display:block;padding:5px 10px;border-radius:7px;color:var(--text-2);
  border-left:2px solid transparent}
.toc a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.toc a.active{background:var(--accent-soft);color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
main{padding:36px 40px 120px;min-width:0}
article{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);padding:32px 40px;margin-bottom:28px}
article .hbox{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
article .hbox .group-tag{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);
  padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
article h1{font-size:26px;line-height:1.35;color:var(--text);letter-spacing:.2px}
article .meta{font-size:13px;color:var(--text-3);margin-bottom:8px}
article hr{border:0;border-top:1px solid var(--border);margin:18px 0}
article h2{font-size:20px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
article h3{font-size:17px;margin:22px 0 8px}
article h4{font-size:15px;margin:18px 0 6px}
article p{margin:8px 0}
article ul,article ol{margin:8px 0 8px 22px}
article li{margin:4px 0}
article blockquote{margin:12px 0;padding:10px 16px;background:var(--accent-soft);
  border-left:4px solid var(--accent);border-radius:6px;color:var(--accent-ink)}
article blockquote p{margin:4px 0}
article code{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
  font-size:92%;background:var(--surface-2);padding:2px 5px;border-radius:4px}
article pre{margin:12px 0;background:#0f0f0f;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;overflow:auto;line-height:1.55}
article pre code{background:none;padding:0;font-size:13px;color:#dcdcdc;display:block}
article table{border-collapse:collapse;margin:12px 0;width:100%;font-size:14px}
article th,article td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
article th{background:var(--surface-2);font-weight:600}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin-top:26px;
  padding-top:16px;border-top:1px solid var(--border)}
/* —— 验收清单：让它真的能勾（这本手册的推进器，不是装饰） —— */
article input[type=checkbox]{cursor:pointer;width:16px;height:16px;vertical-align:-2px;
  margin-right:7px;accent-color:var(--accent)}
article li:has(input[type=checkbox]){list-style:none;margin-left:-18px;padding:2px 0}
article li:has(input[type=checkbox]:checked){color:var(--text-3)}
article li:has(input[type=checkbox]:checked) code{opacity:.7}
article .meta .ck{margin-left:9px;padding:1px 9px;border-radius:999px;font-size:12px;
  background:var(--surface-2);color:var(--text-2);cursor:pointer;user-select:none}
article .meta .ck.all{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toc a .ckb{float:right;margin-left:6px;padding:0 6px;border-radius:999px;font-size:11px;
  background:var(--surface-2);color:var(--text-3)}
.toc a .ckb.done{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.toc a .ckb:empty{display:none}
.prevnext a{color:var(--text-2);font-size:14px}
.prevnext a:hover{color:var(--accent)}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:60;transition:width .1s}
@media(max-width:940px){
  .layout{grid-template-columns:1fr;display:block}
  aside.toc{position:fixed;left:0;top:56px;bottom:0;width:280px;transform:translateX(-100%);
    display:none;z-index:40}
  aside.toc.open{transform:translateX(0);display:block}
  main{padding:24px 18px 80px}
  article{padding:22px 18px}
}
</style>
</head>

const DATA=[{"id": "sec0", "group": "总览与计划", "title": "先读我", "basename": "00_README_先读我.md", "markdown": "# AI 应用开发 · 自学库\n\n> 定位：大二 · 有一点编程基础 · 时间不固定 · 目标\"先扎实学会 + 两个都要(先 AI 后 Web)\"\n> 学法调优：**自由节奏 · 不背只求懂 · 一步一步 · 过渡已排好**。\n> 信息基准：**2026-09-19**。库名/API/数据会随时间变化，但能力链与稳定范式不受影响。\n\n---\n\n## 一、这一页往后就是全部（简洁，没有堆文档）\n\n- 顶层只有 2 篇：**先读我（本页）** 和 **总览（路线·学法·产出）**——读那篇即可起步。\n- 四个阶段是整条主线，每阶段开头一篇「背景」，之后每篇按顺序读，上一篇的产物就是下一篇的输入，自然衔接。\n- 完整目录见下方。\n\n## 二、文件夹地图\n\n```\nAI_Dev_Learn/\n├── 00_README_先读我.md            ← 本页：用法 + 地图\n├── 00_总览_路线学法与产出.md      ← 全库总纲：值不值 / 先AI后Web / 学法五原则 / 每阶段产出物（先读）\n├── 00_项目主线_客服助手是怎么长大的.md  ← 一张版本表：整个手册是**同一个项目的 11 个版本**（强烈建议先看）\n├── 00_文风约定.md                 ← 写作规矩：写得像工程文档，不像教材\n├── 02_阶段一_Python与API/\n│   ├── 00_背景_技术栈导航-学什么别学什么.md  ← 碰 Python 前，先看清技术全景\n│   ├── 01_环境搭建与终端基础.md\n│   ├── 02_Python最小闭环.md\n│   ├── 03_HTTP基础-请求与响应.md    ← 先看清\"请求/响应\"结构，再谈调用 API\n│   ├── 04_大模型API调用实战.md\n│   └── 05_真环境关卡.md            ← 关卡①：真的拿到 Key、真的调通（过了才翻页）\n├── 03_阶段二_RAG知识库/\n│   ├── 00_背景_周边扩展地图.md     ← 学检索时，顺带懂 grep/SQL/知识库\n│   ├── 01_RAG概念与全流程.md\n│   ├── 02_读取文档与分块.md\n│   ├── 03_词向量与检索原理.md\n│   ├── 04_向量数据库Chroma实践.md\n│   ├── 05_完整RAG闭环.md\n│   ├── 06_RAG效果优化.md\n│   └── 07_真环境关卡.md            ← 关卡②：真的装 chromadb、真的语义检索\n├── 04_阶段三_Agent/\n│   ├── 00_背景_前沿范式雷达.md     ← 学 Agent 时，先看稳定范式坐标\n│   ├── 01_从问答到Agent.md\n│   ├── 02_LangGraph核心-节点边状态.md\n│   ├── 03_工具调用与Agent闭环.md\n│   ├── 04_提示注入与Agent安全.md    ← 模型分不清\"指令\"和\"数据\"——Agent 最容易被绕过的地方\n│   ├── 05_接入真实工具-搜索与RAG.md\n│   ├── 06_MCP让Agent能力标准化.md\n│   ├── 07_完整Agent项目.md\n│   └── 08_真环境关卡.md            ← 关卡③：真的装 langgraph、真的跑通 Agent 循环\n├── 05_阶段四_评测与求职/\n│   ├── 00_背景_行业与未来.md       ← 市场在招什么 + 未来往哪走（2026-09）\n│   ├── 01_评测与调优.md            ← 证明智能体\"可靠\"，把 60%→85%\n│   ├── 02_部署与CI.md              ← 带鉴权上线 + git push 自动跑回归\n│   ├── 03_求职-简历与面试.md       ← 作品集 / 简历数字 / 面试讲原理\n│   ├── 04_真环境关卡.md            ← 关卡④：真评测数字 + 真服务（带鉴权）\n│   └── 05_组装指南_零件到作品.md   ← 把 companion 的零件填进 csproject\n├── csproject/                     ← **你的作品**：客服智能体（clone 下来能跑）\n├── companion/                     ← 实验台：每篇对应的可运行代码 + 冒烟测试 + CI\n├── vendor/                        ← 渲染库（marked / highlight.js），会被内联进 index.html\n├── build.py                       ← 把以上所有 .md 重建成单文件 index.html\n├── index.html                     ← 产物：全部内容打成一页，双击即读（由 build.py 生成，别手改）\n└── 99_学习打卡模板.md              ← 进度记号（可选，不记也行）\n```\n\n> **companion 和 csproject 的分工，一定要分清：**\n> - `companion/` 是**实验台**——零件级练习，零依赖、离线可测，随便改坏。\n> - `csproject/` 是**作品**——装真库、真跑通，是你能拿去面试的东西。\n> 四个阶段各有一道**真环境关卡**，就是把前者的\"替身\"换成后者的\"真家伙\"。\n\n> **只想读、不想配环境**：直接双击 **`index.html`**——左侧目录 + 全文一页看。\n> 它**不依赖网络**（渲染库已内联进文件，断网、离线、传到别的电脑都能开），\n> 而且**验收清单能真勾**：勾选状态存在浏览器本地，关掉再开还在，刷新不丢；\n> 顶栏显示**总进度**（清单 已完成/总数），目录里每篇后面会显示「3/6」这种完成度，勾满变 ✓。\n> 改了任何 `.md` 之后，跑一句 `python build.py` 重建 `index.html`——**产物名固定为 index.html，不要再另存别的名字**，否则会出现\"两份同名页面、内容不一样\"的坑。\n\n## 三、怎么用（自由版）\n\n1. **当\"路径\"不当课表**：从阶段一开始一篇篇往后走，断档就回头接上，不追进度。\n2. **一步一步**：每篇先\"概念/原理\"再动手，别跳步。\n3. **懂原理优先于背**：库名/接口都能查；能用自己的话讲清＝真懂了。\n4. **过渡已排好**：顺着读自然衔接，不用自己找联系。\n5. **记录是选择**：`99 打卡` 爱用不用，真正要留的是\"这个知识点我讲得清吗\"。\n\n## 四、核心学习方式：AI 辅助开发\n\n代码用 AI Agent 生成，你负责：**给清上下文 → 审查(看懂/对不对/边界) → 让它改 → 拆小步**。\n红线：**RAG/Agent 的原理必须自己懂**——这是面试底气。\"让它写\"≠\"什么都不用懂\"。\n\n## 五、每条路线都注意这两点\n\n1. 知识以\"**能跑通**\"为学会标准，别停在\"看完\"。\n2. 评价自己的唯一标准：**能不能给另一个人把一个项目从头讲到尾**。\n\n---\n\n现在翻开 **`00_总览_路线学法与产出.md`**，从阶段一第 1 步开始。"}, {"id": "sec1", "group": "总览与计划", "title": "总览·路线学法与产出", "basename": "00_总览_路线学法与产出.md", "markdown": "# 训练营总纲 · 路线 · 工程契约 · 一条贯穿作品（全库一页总纲）\n\n> 这一页是全库的\"宪法\"，读完它你就知道整本手册从\"路线图\"升级成了\"训练营/工程手册\"。\n> 判断基准：2026-09-20。**核心转变：不是\"我教你跑通 4 个 demo\"，而是\"我带你把 1 个能上线的作品，越做越硬\"。**\n\n---\n\n## 一、先回应三个最要紧的事实\n\n- **\"跑通 demo ≠ 学会\"**。能跑只证明逻辑通；能被公司信任地上线，才证明你处理过真实工程的脏活：依赖、Git、鉴权、日志、异常、测试、部署、成本、并发、安全。整本手册的目标，从\"跑通\"抬到\"能被信任\"。\n- **用 AI Agent 写教材会把\"全而浅\"放大**。所以本库立了个死规矩：**每个代码块必须能在 companion 仓库里真的跑通**；配不上可运行代码的讲解，一律不写。AI 写代码没跑过的部分，我会明确标\"未验证\"，绝不假装都对。\n- **作品不能同质化**。命令行闲聊→RAG→Agent→成绩单，这个套路招聘方看腻了。本库改成**一个有业务场景、有用户、有约束、有取舍**的贯穿作品（见下）。\n\n> 目标仍清晰：两个月的训练营，最后你手里的不是\"一堆 demo\"，而是**一个能点开就跑、带评测、讲得出为什么这么设计的客服智能体作品 + 一段能白话讲透的工程叙事**。\n\n## 二、贯穿作品：企业客服知识库 + 工单 Agent（CSKP）\n\n整个手册都长在这一件作品上，四阶段 = 把它做硬的四道里程碑：\n\n```\n企业客服智能体（Customer Service Knowledge Portal）\n├── 阶段一 Python+API    : 能把\"客服问题→要点回答\"的命令行助手（地基 + 工程化）\n├── 阶段二 RAG 知识库    : 只许对着\"产品手册/FAQ\"答，能报出处、能拒绝答不了的（防幻觉）\n├── 阶段三 Agent        : 能自主\"查知识库/翻订单/查物流\"，把多步客服流程跑完（含失败重试）\n└── 阶段四 评测+部署    : 用评测集证明可靠 + 带鉴权的 HTTP 服务 + CI 回归（能被别人 clone 跑）\n```\n\n它为什么能打破同质化（招聘方会问你这些，提前想好）：\n- **用户**：客服坐席（不是聊天机器人演示者）。有真实角色、权限边界。\n- **约束**：幻觉必须可控（答不了就承认）、成本要压（缓存/限流）、权限要封（客服查不到别人订单）。\n- **取舍**：宁可让 Agent\"多问一句\"也别瞎猜；检索\"广但杂\" vs \"窄但准\"要权衡。\n这些\"用户/约束/取舍\"学进每一阶段——**面试讲的不是\"我做了什么\"，是\"我为什么这么设计、哪里失败、怎么权衡\"。**\n\n## 三、三条工程契约（每篇都遵守，是\"可信\"的根基）\n\n### 契约 ① 可运行契约\n- 每个代码块都能在 `companion/` 仓库里跑通；`companion/` 配 CI，`git push` 即自动跑冒烟测试。\n- 手册里我明确写代码源自 companion 哪个文件；**凡是\"理论展示、故意不跑\"的代码，标题都写明\"示意，非可运行\"**，绝不混淆。\n\n### 契约 ② 验收契约\n- 每篇末尾是**验收清单（可勾选的自测）**，不是\"能讲懂才叫会\"的空话：**勾得满 = 本篇过；勾不满 = 回到\"卡在哪\"栏找缺漏**。\n- 每个阶段有\"里程碑验收\"：当场跑通 + 能对别人讲完\"为什么这么设计\"。\n\n### 契约 ③ 演进契约\n- companion 仓库与手册每篇都标**版本日期**；改一次，往 `更新日志` 记一条（日期 + 改了啥 + 是否有破坏性变更）。\n- 库名/API/依赖版本变了 → 手册与仓库一起升版本，进日志。**你的学习不因\"我写的教程过时\"而卡壳。**\n\n## 四、每篇固定栏目（让自学不迷路，\"偏读\"变\"偏做\"）\n\n每一篇都保留这五个栏，位置固定：\n1. **前置自测**（开篇 3 题）：读过上一篇的才答得上来——断了档一眼就看出来。\n2. **这一站解决什么**（一句话定位 + 判断基准日期）。\n3. **动手 + 验收清单**（对应 companion 文件，跑一步勾一步）。\n4. **常见坑**（这一步所有人必踩的 3 个坑，含报错长啥样、怎么解）。\n5. **断档接续**（隔了几天怎么快速接上：先跑哪条命令、先看哪个文件）。\n\n> 你断了档不用从头翻——按\"断档接续\"给的最短路径，5 分钟复位。\n\n## 五、\"AI 应用全栈\"该有的，不再省略（跳过的会明说）\n\n全栈不只\"最小 HTML/CSS/JS + Python 调 API\"。要能当一个\"可信的作品\"，你至少得把下面这些在你作品里走一遍（顺序随阶段展开；确实跳过的会明说，绝不让你误以为\"够用\"）：\n- **后端**：依赖管理(venv/requirements)、`.env` 密钥安全、日志、异常分层、认证鉴权、CORS、请求限流、数据库(SQLite 起步)。\n- **接口形态**：流式输出(打字机)、消息格式约定、错误码约定、健康检查 `/healthz`。\n- **部署与可靠性**：Git + CI(GitHub Actions 跑测试)、`.dockerignore/Dockerfile` 起步部署、监控/可观测(把\"调了啥/检索到啥/哪步出错\"记日志)。\n- **性能与成本**：缓存、并发受限、成本预算（一次回答花多少钱）。\n> 这些不全是\"现在满分掌握\"，而是在四阶段里**逐一上手并留有复用点**——用到哪写到哪，不空谈。\n\n## 六、两个仓库 + 四道关卡（\"练过\"和\"做过\"的分界线）\n\n**分工（别混）**：\n- `AI_Dev_Learn/companion/` = **实验台**（零件级练习）：零依赖、离线可测、随便改坏。\n- `AI_Dev_Learn/csproject/` = **作品**（真家伙）：装真 chromadb / langgraph，**是你拿去面试的东西**。\n\n**为什么要有两层**：实验台让思想随时能跑通，但它里面全是**替身**（伪向量 / 策略替身 / StubAgent）。\n只有实验台的后果是：**你把清单全勾满，却从没装过一个真库**。所以再加一层强制：\n\n**四道「真环境关卡」**（每阶段末尾一篇 `真环境关卡.md`）——**把替身换成真的，跑通才算过这个阶段**：\n\n| 关卡 | 位置 | 必须做到 |\n|---|---|---|\n| ① | 阶段一末 | 真的申请到 Key、真的多轮对话、真的见过三种失败提示长啥样 |\n| ② | 阶段二末 | 真的 `pip install chromadb`、真的**语义**检索（按意思找，不只是按字重合） |\n| ③ | 阶段三末 | 真的装 langgraph、真的跑通\"想一步 → 调工具 → 再想\"的循环 |\n| ④ | 阶段四末 | 用**真 Agent** 跑出**真实评测数字**（首次允许难看）+ 真起服务、被鉴权拦住 |\n\n> 关卡的要求不是\"再看一遍\"，而是**贴证据**：真实输出、真实报错、真实数字。\n> 打勾不算过，贴出来才算。\n\n- 你的用法：**跟着手册每篇，把 companion 对应文件亲手敲一遍/改一遍**，理解为什么这样写，而不是直接 copy。\n- 红线：**RAG/Agent 的原理必须自己懂**——\"让 AI 写\"≠\"什么都不用懂\"；面试讲不出原理，就回到对应篇补。\n- 产物：全库 `.md` 由 `python build.py` 重建成单文件 `index.html`（双击即读）。\n  **产物名固定为 `index.html`**——手工另存别的名字会造出\"两份同名页面、内容不同步\"，读者拿到的是旧版。\n- 阅读端三条硬要求（都已在 `index.html` 落实）：**① 不依赖网络**（渲染库内联，断网/离线可读）；\n  **② 代码块真高亮**（65 个代码块全部着色，靠 highlight.js 深色主题，配深底代码块）；\n  **③ 验收清单真能勾**（勾选存浏览器本地，关掉再开还在——这是\"验收契约\"能不能落地的关键）。\n\n## 七、怎么用（自由版）\n\n1. **当\"训练营路径\"不当课表**：从阶段一第 1 步往后走，断档用\"断档接续\"快速复位，不追进度。\n2. **每篇先\"前置自测\"**：答得上来 = 接着走；答不上 = 回上一篇。\n3. **验收清单勾满才算过**：没勾满就回\"卡在哪\"，不硬赶。\n4. **跟着 companion 亲手写**：理解 > 背；跑得通 + 讲得清 = 学会。\n5. **记录是选择**：`99 打卡` 爱用不用；真正的进度 = 验收清单勾满几篇。\n\n---\n**现在翻阶段一第 1 步：先装 Git、建 venv、把 `companion/` 拉到你本机跑通第一条冒烟测试。**"}, {"id": "sec2", "group": "总览与计划", "title": "文风约定", "basename": "00_文风约定.md", "markdown": "# 文风约定 · 写得像工程文档，不像教材\n\n> 这一页立规矩，起因很具体：手册前 30 篇里出现了 **178 处**生活化比喻\n> （灶台、菜谱、外援电话线、切菜、口味指纹、仓库、领班……）。\n> 单看每一个都没错，但**连续 30 篇这么写，就只剩\"AI 教材味\"**，\n> 反而把真正值钱的东西盖住了。\n>\n> 真正值钱的是这七样：**接口、边界、验收、失败模式、真实环境、评测数字、工程产物。**\n> 比喻一个都替代不了它们。\n\n---\n\n## 三条硬规矩\n\n**① 密度上限：每千字不超过 1 个比喻，一篇最多 2 个，且不许同一套意象反复用。**\n超了就是\"用比喻代替讲解\"。\n\n**② 比喻必须配平**：比喻后面**紧跟一句精确表述**——输入是什么、输出是什么、边界在哪。\n只有喻体、没有精确表述的段落，等于没讲。\n\n**③ 动手和验收环节禁用比喻。**\n一旦进入\"跑什么命令、看什么输出、怎么判定过了\"，全部用工程语言。\n这里容不下\"灶台\"，只容得下**进程、依赖、请求、字段、退出码**。\n\n## 禁用喻体（不是难听，是**会误导**）\n\n| 喻体 | 它暗示的 | 实际是 | 后果 |\n|---|---|---|---|\n| **指纹** | 精确匹配、唯一标识 | 连续空间里的**坐标**，靠距离比较 | 学完理解不了\"近邻检索\" |\n| **仓库** | 存取东西 | 核心是**最近邻搜索** | 说不出它凭什么比遍历快 |\n| **大脑 / 眼睛 / 嘴巴** | 有意识、有感官 | 统计模型，只有输入输出 | 把\"预测下一个词\"错当成\"理解\" |\n| **灶台 / 厨子** | 一个实体 | 进程 + 依赖 + 入口 | 说不出\"这是个能跑起来的程序\" |\n| **电话线 / 外卖 / 会员卡** | 生活场景 | HTTP 请求 + 请求头 + 报文 | 能复述故事，说不清字段名 |\n\n## 改写对照（照这个来）\n\n| ❌ 不要 | ✅ 要 |\n|---|---|\n| 把它想成点外卖：你点单、厨房送餐 | 你发一个 HTTP POST，body 是 JSON，返回也是 JSON |\n| 给它接一根\"外援电话线\" | 调用大模型 API |\n| 建一个\"一秒找人\"的仓库 | 用向量数据库做最近邻检索 |\n| 它没记忆，所以要把历史都带上 | 接口是**无状态**的，所以每次请求都要发完整的 `messages` 数组 |\n| 给领班装一双手 | 给 Agent 注册工具：一份带 schema 的函数清单 + 调用白名单 |\n| 把整段历史缠成一根记录绳 | `messages` 是个数组，每次整个发过去，所以报文会越来越长 |\n\n## 什么时候比喻才算好\n\n只有一个位置值得用：**给完全陌生的概念建立第一直觉**——而且**立刻收回来**，马上接精确表述。\n\n- ✅ 可以：「多轮对话越来越贵，因为 `messages` 每轮都整个重发一遍。」\n  （这不是比喻，这是**机制**——机制本身就是最好的解释。）\n- ❌ 不可以：「`messages` 就像一根越缠越长的记录绳。」\n  （读者记住了\"绳子\"，但说不清\"为什么要重发\"。）\n\n**判断标准**：把比喻删掉，如果这段话的事你还能说清 → 这个比喻就是多余的，删。\n\n---\n\n## 附则：判断一段内容该不该留（内容层面的规矩）\n\n**\"如果删掉这一篇 / 这一节，项目会缺什么能力？\"** —— **答不出来，就删。**\n\n和上面三条是配套的：**文风规矩管\"怎么写\"，这一条管\"写不写\"。**\n\n典型该删的：\n- 只介绍名词、不改变项目任何能力的段落（\"XX 是什么\"但没有\"所以你的项目多了什么\"）\n- 只点名不给判据的\"技术清单\"（列了 Hybrid Search / Rerank / Query Rewrite，\n  但说不出\"什么 query 该用哪条路、怎么验证它有用\"）\n- 说满了的结论（例：只做了接口鉴权和 CI，就不能说\"这一步做完它才叫能上线\"）\n\n---\n\n## 自检命令\n\n改完任何一篇，跑一下密度检查（项目根目录的 `check_style.py`）：\n\n```shell\npython check_style.py                 # 全库检查\npython check_style.py 某篇.md          # 单篇检查\n```\n\n**告警线：每千字 > 1.5 个比喻，或单篇 > 3 处** —— 超了就说明还有\"用比喻代替讲解\"的地方。\n退出码非 0，所以可以直接接进 CI，防止文风又长回去。\n\n> ⚠️ 它刻意**不把\"仓库\"算作比喻**——本库里的\"仓库\"绝大多数是\"GitHub 仓库 / companion 仓库\"，\n> 那是正经术语。工具的词表要跟着语境校准，不然误报会淹掉真问题。\n"}, {"id": "sec3", "group": "总览与计划", "title": "项目主线·客服助手是怎么长大的", "basename": "00_项目主线_客服助手是怎么长大的.md", "markdown": "# 项目主线 · 你的客服助手是怎么长大的\n\n> **这一页解决一个问题**：30 篇如果各读各的，就是一堆知识点；\n> 但它们讲的其实是**同一个项目在长大**——从一个只会 `print` 的脚本，\n> 长成一个能查资料、会调工具、有评测数字、能上线的客服助手。\n>\n> 这一页给你两样东西：**一张版本表**（每一步加了什么），和**一条命令**（真能看到它在长）。\n\n---\n\n## 一、先跑一次，看清这条线\n\n```bash\ncd companion\npython evolution_demo.py\n```\n\n它会按 v0.1 → v0.9 依次跑给你看，**每一版的差别都是真实运行结果**，不是描述。\n（不需要 API Key：用确定性替身代替模型，好让\"能力差异\"看得见。）\n\n## 二、版本表\n\n| 版本 | 多了什么能力 | 对应篇目 | 代码落在哪 | 你怎么知道它真的长了一岁 |\n|---|---|---|---|---|\n| **v0.0** | 环境能跑通、看得懂 HTTP | 阶段一 01–03 | — | `python hello.py` 能打印；能说出\"请求四件、响应三件\" |\n| **v0.1** | 能问一句答一句 | 阶段一 04 | `phase1/chat_cli.py` | 问它一句，它答一句 |\n| **v0.2** | 有记忆，能多轮 | 阶段一 04 第 4 步 | 同上 | 问\"我叫什么\"，它答得出（因为历史被一起发出去了） |\n| **v0.3** | 能读你的公司资料 | 阶段二 02–04 | `phase2/chunker.py` + `search.py` | 问资料里的事，检索能取回对应那一段 |\n| **v0.4** | 带出处回答、答不了会承认 | 阶段二 05 | `phase2/ragbot.py` | 问资料外的，它说\"查不到\"而不是瞎编 |\n| **v0.5** | 答得更准 | 阶段二 06 | 同上（改检索策略） | 召回率数字上升（改前 x% → 改后 y%） |\n| **v0.6** | 会自己决定调工具 | 阶段三 02–03 | `phase3/agent.py` | trace 里看到\"想一步 → 调工具 → 再想\" |\n| **v0.7** | 接外部能力（搜索 / MCP） | 阶段三 05–06 | 同上 | 它能自己决定去搜网还是查库 |\n| **v0.8** | 有安全边界、**抗提示注入** | 阶段三 03 / 04 / 07 | 同上 | 越权被拒、死循环被钳住、**被注入也拿不到数据** |\n| **v0.9** | 有成绩单（而且**分得清哪一层坏了**） | 阶段四 01 | `phase4/evaluator.py` + `evaluator_layered.py` | 跑得出准确率**和三层分指标**（检索/生成/引用），且能当回归门禁 |\n| **v1.0** | 能上线 | 阶段四 02 | `csproject/` | `curl` 验证：没带 Key 被 401 拦住 |\n\n> 每读完一篇，回这张表看一眼：**\"我的项目现在是 v 几，比上一版多了什么。\"**\n> 这一眼，就把\"学知识点\"变成了\"养一个东西\"。\n\n## 三、为什么按版本走，比按知识点走有用\n\n| | 按知识点走（原来的问题） | 按版本走 |\n|---|---|---|\n| 读完的感受 | \"学了一堆东西\" | \"我养出来一个东西\" |\n| 断了档 | 不知道从哪接 | 看一眼版本表，知道上次加到哪一版 |\n| 面试怎么讲 | 罗列技术名词 | \"从 v0.1 到 v1.0，每一步为什么加、踩了什么坑\" |\n| 卡住了 | 怀疑自己笨 | 对照版本表：上一步的验收过了吗？ |\n\n**关键差别在最后一列**：面试官问\"你这个项目怎么做的\"，按知识点学的人只能答\"我用了 RAG 和 Agent\"；\n按版本走的人能答：**\"v0.3 只能检索不能生成，v0.4 才把证据拼进提示词——因为我发现光检索没用，模型还是会瞎编。\"**\n\n后者才是\"做过项目\"的证据。\n\n## 四、四条规则（按版本走时的纪律）\n\n1. **每加一版，先跑一次，亲眼看差别。** 不看差别就往下走，等于没加。\n2. **每一版都必须能跑。** 跑不起来说明这一版的活没干完，别急着加下一版。\n3. **不推倒重写。** 每一版都是上一版**加一层**。想重写，说明上一版理解错了，回去补。\n4. **每一版都留一句\"为什么加它\"。** 这句话就是你简历和面试的素材。\n\n## 五、这条线为什么长这样（不是随便排的）\n\n每一步都是下一步的**前提**，顺序不能换：\n\n- 没有 **v0.2 的多轮**，v0.3 的检索结果就没法跟对话串起来；\n- 没有 **v0.3 的检索**，v0.4 就没有\"证据\"可拼；\n- 没有 **v0.4 的闭环**，v0.6 的工具调用就只能查到一半（检索本身也变成了一个工具）；\n- 没有 **v0.6 的循环**，v0.8 的\"防死循环/越权\"就没有意义；\n- 没有 **v0.9 的数字**，v1.0 上线就是在赌——你不知道它到底靠不靠谱。\n\n> 所以那些看起来\"跳跃\"的篇目（比如阶段四讲部署），其实都是这条线上的一个版本。\n> 翻开任何一篇前，先回这张表：**这一篇是给项目加哪一版？**\n\n---\n\n**现在**：翻到阶段一第 1 步，开始给项目攒第一版。\n每完成一篇，回这里看一眼你的项目到哪了。\n"}, {"id": "sec4", "group": "阶段一 · Python 与 API", "title": "技术栈导航-学什么别学什么", "basename": "00_背景_技术栈导航-学什么别学什么.md", "markdown": "# 阶段一 · 背景：技术栈导航——先学什么、别碰什么（一张地图）\n\n> 这一站解决什么：不教你写代码，而是给你**一张技术全景地图**——哪些是主干必修、哪些是配套可选、哪些是你这种\"AI 应用开发者\"根本不该抢跑的方向。有地图才不会被带偏（防信息茧房第一层）。\n> 判断基准：2026-09-20。这一篇是\"判断尺子\"，学完随时回来查，不强求一次记全。\n> 📍 **项目坐标**：背景篇，不推进版本。但这一页决定你接下来几个月**往哪使劲**——先看清主干，别抢跑。\n\n**前置自测（可先跳过，读到阶段中再回来看一眼）**\n1. 你这条主线的主轴语言是哪个？\n2. HTML/CSS/JS 在你路线里算\"主干\"还是\"把 AI 包装成网页的加分\"？\n3. Java/C 为什么\"不为转行主动学\"？\n\n---\n\n## 1. 判断一句话：学不学它，看\"对 AI 应用有没有用\"\n\n很多技术本身很好，但**对你这阶段的目标没有增益**。判断要不要学，只问一件事：**它现在能否把\"AI 应用项目\"往前推一步，或让你离想要的岗位更近。** 其余都是噪音。\n\n## 2. 一张总表：技术归位（背下来当锚点）\n\n| 技术 | 分类 | 在你的路线里 | 要不要学／何时学 |\n|---|---|---|---|\n| **Python** | 主干·必学 | AI/NLP 的默认语言，RAG/Agent 全在这 | ★ 从现在就开始 |\n| **HTML / CSS** | 界面·配套 | 把 AI 应用做成网页的\"外壳\" | 主线之后再补，AI 全栈会用到 |\n| **JavaScript (JS)** | 界面·配套 | 网页交互 + `fetch` 调后端 | 同上，排在 HTML/CSS 之后 |\n| **Node.js** | 后端·可选 | 也能做后端，但你不是必须用它 | 想走纯 JS 全栈/前端岗才学 |\n| **SQL** | 数据·加分 | **Text-to-SQL**（让 LLM 查数据库）更强 | 想进企业/做查库 Agent 再加 |\n| **Java** | 后端·校内 | AI 应用主线基本用不上 | 学校课程要过才学，不为转行主动学 |\n| **C 语言** | 底层·校内 | 完全不在 AI 应用主线 | 学校要过就学，别因此分心 |\n| **React/Vue 等前端框架** | 界面·进阶 | 早年界面够用即可；复杂交互才上框架 | 明确做前端/AI 全栈产品时再上 |\n| **深度学习理论/微调训练** | 模型·了解 | 不必深修；知道\"它是什么\"即可（评测阶段会用） | 需要时再挖 |\n\n> 关键记忆点：**Python 是主轴，JS/CSS 是让它\"能被人点开\"的加分，Java/C 是另一条路。**\n\n## 3. \"AI 应用全栈\"到底是什么（和你想法的校准）\n\n你想要的不是传统网站全栈，而是 **\"AI 应用全栈\"= 以 AI 为核心（后端 Python），补一层网页界面（前端 HTML/CSS/JS）把它包装成可用产品**。\n\n```\nAI 能力（RAG / Agent，Python）\n   │  用 FastAPI 暴露成 HTTP 接口\n   ▼\n网页界面（HTML 结构 → CSS 样式 → JS 交互：点按钮 fetch 调接口、展示回答）\n```\n\n> 前端只学\"够把 AI 包成网页\"的最小集，不要一头扎进 React 生态，那是另一个大坑。\n\n## 4. 三个常见\"容易误导你\"的说法（提前免疫）\n\n1. **\"不会前端当不了全栈\"** —— 那是传统全栈的焦虑。你要的 AI 全栈，前端只需够用。\n2. **\"大家都学后端 Java\"** —— 那是企业 Java 岗，不是 AI 应用岗。你跟 AI 主线，Java 不用抢跑。\n3. **\"先系统学 Python 语法毕业\"** —— 不必。你用 AI Agent 写代码+看懂就够，主线靠项目推进（已在计划引言）。\n\n## 5. 本篇小结\n\n- 主轴：**Python**；配套：**HTML/CSS/JS**；加分：**SQL**；避开：**Java/C 抢跑**。\n- 用 \"对 AI 应用有没有用\" 当唯一尺子，就不会被各种\"爆款技术\"带偏。\n\n> 下一篇：阶段二你会触达检索/数据相关（grep、SQL、知识库）——用同一把\"尺子\"判断它们值不值得学。\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n- 这一篇是\"地图/尺子\"，断了不用补\"进度\"——真有\"要不要学 X\"的纠结时，回来看这张总表即可。\n- 记忆锚：**主轴 Python；配套 HTML/CSS/JS；加分 SQL；避开 Java/C 抢跑。判断一律问\"对 AI 应用有没有用\"。**"}, {"id": "sec5", "group": "阶段一 · Python 与 API", "title": "环境搭建与终端基础", "basename": "01_环境搭建与终端基础.md", "markdown": "# 阶段一 · 第 1 步：把工作台搭成\"训练营的样子\"——环境 + 终端 + 工程地基\n\n> 这一站解决什么：别人教环境搭建只教\"装个 Python 能跑就行\"。训练营的标准是——**从第一句代码起，就按\"能上线的工程\"搭地基**：独立的虚拟环境、管理密钥、装好 Git、用 `.gitignore` 管住秘密。这些\"工程债\"现在不还,后面堆成山。\n> 判断基准：2026-09-20。本步对应 companion 仓库（见文末\"断档接续\"）。\n> 📍 **项目坐标**：**v0.0 的地基**：把工作台（Python / 编辑器 / 终端）和工程习惯（venv / Git / .env / .gitignore）备好。项目本体还没开始，但地基不牢，后面每一版都要返工。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：随便进一个文件夹，敲 `python --version`。**输出是什么？** 如果提示「找不到命令」，最可能是安装时漏勾了什么？\n2. 动手：写个 `hello.py` 里面只放 `print(\"hi\")`，然后 `python hello.py`。再把文件改名为 `hello.txt` 跑一次——报什么错？\n3. 概念：密钥（API Key）该写在代码里，还是放别处？为什么？\n\n---\n\n## 站纲（跨 5 小步，别跳）\n**认识工作台三角色 → 装 Python → 认识终端 → 建\"工程地基\"(venv/Git/.env/.gitignore) → 跑通第一条生产线**\n\n---\n\n## 第 1 步 认知先立住：你的工作台上有三个角色\n\n写代码不需要\"很多软件\"，只需要**分工明确的三位**——记不住这个，后面每一步都迷路。\n\n| 角色 | 工具 | 负责什么 |\n|---|---|---|\n| **代码的执行者** | Python | 真正运行你的代码（解释器） |\n| **写代码的编辑器** | VS Code | 编辑文件、高亮语法、断点调试 |\n| **下命令的入口** | 终端 / Terminal | 你在这里敲命令、看输出 |\n\n> 💡 一句话记住分工：**在编辑器里写文件 → 在终端里敲命令 → 由 Python 解释器执行 → 结果回到终端。**\n> 最常见的误会是\"装了 VS Code 就能跑代码\"——不能。**VS Code 只是编辑器，真正执行的是 Python。**\n\n## 第 2 步 请来主力：装 Python（别漏 PATH 那个勾）\n\n→ 打开 `python.org` → Downloads → 装 Windows 安装包。\n\n> ❗ 安装时那个勾选框 **`Add python.exe to PATH` 一定要勾**。不勾：第 3 步窗口里喊 `python` 它听不懂——这是新手第一道墙，现在堵上。\n\n验证（Windows 终端 = PowerShell，按 `Win` 输 `powershell` 回车）：\n\n```shell\npython --version\npip --version\n```\n\n看到 `Python 3.10+` 和 `pip 23.x` 就通了。 报\"不是内部命令\"= 那个勾没勾，重装即可。\n\n## 第 3 步 打开写字桌 + 认识终端\n\n**装 VS Code**（`code.visualstudio.com`）：左边文件列表，中间写字，底部/顶部\"终端\"标签=喊话口。\n\n**必会命令（看懂缩写就记住了，不看懂靠背）**：\n\n```shell\npwd          # 我现在在哪个文件夹\ndir          # 这个文件夹里有啥\ncd 文件夹     # 走进这个文件夹\ncd ..        # 退回上一层\n```\n\n## 第 4 步 工程地基（本步真正的\"训练营\"增量）💡\n\n前三步是\"能跑\"，这一步让它\"能体面地跑、别给自己埋雷\"。四件小事，件件讲清为什么：\n\n**① 建虚拟环境 venv（把依赖\"关进一个小房间\"）**\n不建 venv 的话，你装的东西会跟系统里的其它项目互相打架（A 项目要 requests 2.x，B 要 3.x，全乱套）。venv = 每个项目一间独立小房间：\n\n```shell\ncd 你的项目文件夹\npython -m venv .venv\n.venv\\Scripts\\activate     # Windows 激活；成功会自动在开头出现 (.venv)\npip install python-dotenv requests   # 装到这一间小房间里\n```\n\n> 为什么重要：**`requirements.txt` 能锁住版本，`venv` 能锁住\"装在哪\"**。两者是你的依赖不掉队的前提——全线都长在 completaion 你的每个阶段上。\n\n**② 装 Git（版本控制，训练营的\"后悔药 + 时间机器\"）**\nGit = 把你的代码每一步都留底，改坏了能退回、还能推到 GitHub 当作品集。本机若还没有就装（搜\"Git for Windows\"装好）。\n> ⚠️ 之前确认过你这台机 Git 未装——**这一站的第一桩事就是装好它**，后面每一步代码都 `git commit` 一下。\n\n```shell\ngit config --global user.name \"你的名字\"\ngit config --global user.email \"你的邮箱\"\ngit init                  # 把这个文件夹变成 Git 仓库\n```\n\n**③ 建 `.env` 存密钥 + `.gitignore` 藏住秘密**（安全，必须做）\n密钥（API Key）是\"花钱的通行证\"。存代码里 = 上 GitHub 就泄露 + 被人盗刷。正确做法：\n\n- 建一个 `.env` 文件放 Key：`DEEPSEEK_API_KEY=sk-xxxx`\n- 建一个 `.gitignore`，写上 `.env`——这样 `git add` 永远不会把 Key 提交上去。\n\n> 对照 companion：`companion/.env.example`（模板）+ `companion/.gitignore`（已写好）就是标准答案。**你的项目里应该有个 `.gitignore`，里面第一行就是 `.env`。**\n\n**④ 把 `companion` 拉回本地**\ncompanion 是全手册的实验台（有冒烟测试 + CI）。用 VS Code 打开 `AI_Dev_Learn/companion/`，先跑一句零依赖冒烟，确认地基是好的：\n\n```shell\npython phase1\\test_smoke.py   # 不看代码也能先验环境通不通\n```\n\n> 只能跑出 `OK` 才往下一步；跑红 = 先解决它，别带着问号往下走。这就是\"验收契约\"的第一次使用。\n\n## 第 5 步 亲手跑出第一句话（生产线的第一次走通）\n\n① 在 companion 里建 `my_first/` 文件夹 → ② VS Code 打开 → ③ 新建 `hello.py` → ④ 写 `print(\"你好，我开始了\")` → ⑤ `Ctrl+S` → ⑥ 终端跑：\n\n```shell\npython my_first\\hello.py\n```\n\n看到 `你好，我开始了` **= 草案→执行→看结果** 整条链第一次走通。你已经在用跟\"能上线的工程\"一样的姿势起步了。\n\n> 顺带记住**交互式**：终端输 `python` 回车出现 `>>>`，能一句句\"当场试\"，调试时最顺手；`Ctrl+Z` 回车或 `exit()` 退出。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n> 三类分开打勾：**🧠 理解**（能讲清）｜**🔧 实践**（能跑通）｜**📌 证据**（有产物）。\n> ⚠️ **证据类才是硬指标** —— 理解可以自我欺骗，实践跑一下就知道，证据骗不了人。\n\n**🔧 实践（能跑通才算）**\n- [ ] `hello.py` 用 `python` 跑出 `你好，我开始了`\n- [ ] 能对你朋友讲清\"Python / VS Code / 终端 各管哪一段\"\n- [ ] `python --version` 和 `pip --version` 有输出\n- [ ] `python -m venv .venv` 建好，激活后开头出现 `.venv`\n- [ ] Git 装好，`git --version` 和 `git config` 设置成功，`git init` 成功\n- [ ] companion 里建好 `.env`，`.gitignore` 首行是 `.env`，且 `/companion` 的冒烟 `python phase1\\test_smoke.py` 输出 `OK`\n\n勾不满就回\"常见坑\"找，别硬赶。\n\n## 常见坑（这一步 90% 的人踩）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| `python` 没反应 | PATH 勾没选 | 重装勾 *Add Python to PATH* |\n| 冒烟报 ModuleNotFoundError 的 `chat_cli` | 终端没在 companion 目录 | 先 `cd` 到 companion 再跑 |\n| venv 激活失败 | 权限/路径 | 用 `python -m venv .venv` 再 `.venv\\Scripts\\activate` |\n| 把 `.env` 推到 GitHub | `.gitignore` 没建 | 立刻补 `.gitignore` 写 `.env`，并去 GitHub 撤销那个提交 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 VS Code 打开 `companion/`，激活 venv（`.venv\\Scripts\\activate`）。\n2. 跑一次 `python phase1\\test_smoke.py`——`OK` 则环境没坏。\n3. 看一眼本步\"验收清单\"，没勾的补上；勾满就进下一步。\n> 记忆锚：**这一步 = \"把地基打得像能上线的工程\"**（venv+Git+​.​env+​​.gitignore），不是\"能跑就行\"。\n\n## 下一步：地基好了，开始过语法\n\n下一站把 `print` 一句升级成\"能算、能存、能做点轻活\"的最小语法零件——只学后面调大模型够用的那丁点，其余深奥语法留给学校。\n\n> 去读阶段一 · `02_Python最小闭环.md`。"}, {"id": "sec6", "group": "阶段一 · Python 与 API", "title": "Python最小闭环", "basename": "02_Python最小闭环.md", "markdown": "# 阶段一 · 第 2 步：Python 最小闭环 —— 够用就行的语法\n\n> 这一站解决什么：上一站你把\"写代码 → 运行 → 看输出\"这条链路跑通了，但它只会干一件事：`print` 一句话。\n> 这一站把**后面调大模型、写项目真正会用到的语法**过一遍——就这一丁点，其余深奥语法交给学校课去讲。\n> 📍 **项目坐标**：这一篇是 **v0.0** —— 备地基和语法零件，项目还没成型。\n> 别小看它：下一篇开始，你就要用这些零件去做真正的事——先是看清 HTTP，然后真的调通大模型。\n> 判断基准：2026-09-20。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：`a = 3`、`b = \"3\"`，分别 `print(a * 2)` 和 `print(b * 2)`。**两个输出一样吗？** 为什么？\n2. 动手：`fruits = [\"苹果\", \"香蕉\"]`，`print(fruits[1])` 输出什么？那 `fruits[2]` 呢？\n3. 概念：venv 是干什么的？为什么每个项目都该有自己的一个？\n\n**站纲（这一站跨够 9 小步，别跳）**\n**变量 → 类型 → 列表/字典 → 条件/循环 → 函数 → import → JSON → 异常处理 → 文件与模块**，\n最后把它们串成一个小程序。\n\n> 前三步是\"会算\"，中间三步是\"会组织\"，**后三步是\"能干活\"**——\n> 后面每一站都会用到它们：JSON 是接口的通用格式、异常处理是工具不崩的前提、文件是 RAG 的第一步。\n> 少学一个，后面就会在某个地方卡住并回头补。\n\n每学一个零件，都问自己一句：**\"这东西在我后面要写的程序里，负责哪一步？\"**\n不负责哪一步的，可以先跳过——这一站只讲够用的。\n\n---\n\n## 第 1 步 变量：让程序能\"记住\"东西\n\n很多时候，你算出来的值稍后还要用——程序得有个地方**存住它**。\n\n> 说精确点：**变量就是一个名字，指向内存里的某个值。** `apple = 3` 的意思是\"让 `apple` 这个名字指向 3\"。\n> 之后你写 `apple`，Python 就去取那个值。（不需要比喻，这个机制本身已经很清楚了。）\n\n```python\napple = 3        # 让 apple 指向数字 3\nprice = 2.5      # 指向一个小数\nname = \"阿远\"    # 指向一段文字\n\nprint(apple * price)   # 用的时候直接写名字 → 7.5\n```\n\n【本质一行】**\"=\" 不是\"等于\"，是\"把右边装进左边这个名字\"。** 现在还不理解，后面写多了自然就顺了。\n\n## 第 2 步 类型：数据分几类\n\n程序要正确处理数据，得先知道它**是什么类型**——文字不能相乘，而文字里也可能藏着数字的陷阱。\n\n| 类别 | 名字 | 例子 |\n|---|---|---|\n| 文字 | `str` 字符串 | `\"你好\"`, `\"20\"` |\n| 整数 | `int` | `20` |\n| 小数 | `float` | `1.75` |\n| 真/假 | `bool` | `True` / `False` |\n\n> 💡 **这步最容易栽的坑**：`input()` 拿回来的值**永远是字符串**——哪怕你输的是 `20`。\n> 要当数字用必须显式转换：`age = int(input(\"你几岁\"))`。记住一个动作：**要数字，先 `int(...)`**。\n\n## 第 3 步 列表 & 字典：装\"一组值\"和\"键值对\"\n\n你经常要处理的不是一个值，而是一堆。两种最常用的容器：\n\n**列表（list）——有序的一串元素，用下标取：**\n\n```python\nfruits = [\"苹果\", \"香蕉\", \"橙子\"]\nprint(fruits[0])      # 苹果 —— 注意！下标从 0 开始\nprint(fruits[-1])     # 橙子 —— -1 表示倒数第一个\nfruits.append(\"梨\")   # 末尾追加\n```\n\n> 🔥 新手最大的反直觉点：**下标从 0 开始**。第 1 个元素是 `[0]`，第 n 个是 `[n-1]`。\n\n**字典（dict）——键值对，用键取值：**\n\n```python\nuser = {\"name\": \"阿远\", \"age\": 20}\nprint(user[\"name\"])    # 用键取值 → 阿远\nuser[\"city\"] = \"嘉兴\"  # 新增一个键值对\n```\n\n> 💡 提前告诉你为什么这个必须懂：**后面调大模型，它返回的就是一层套一层的 `dict`。**\n> 这一站把\"用键取值\"练熟，下一站取回答就是顺手的事。\n\n## 第 4 步 条件 & 循环：分支与重复\n\n只会自上而下顺序执行的程序做不了事，得让它**按条件走不同分支**、**按条件重复执行**。\n\n**判断（if）——岔路口选一条走：**\n\n```python\nscore = int(input(\"考了多少分？\"))\nif score >= 90:\n    print(\"优秀\")\nelif score >= 60:\n    print(\"及格\")\nelse:\n    print(\"不及格\")\n```\n\n> ⏰ 三条规则记牢：**① 条件行末尾要冒号 `:`；② 缩进表示这几行属于同一分支；③ 同一时刻只走一个分支。**\n\n**循环——重复干活（`for` 固定遍数，`while` 看条件）：**\n\n```python\nfor i in range(5):      # range(5) = 0,1,2,3,4\n    print(\"第\", i, \"次\")\n\nfor f in fruits:        # 把列表整个走一遍，每个都打印\n    print(f)\n\ncount = 0\nwhile count < 3:\n    print(count)\n    count = count + 1   # 千万别漏这句，否则死循环\n```\n\n## 第 5 步 函数：把一段逻辑封装成可复用单元\n\n同一串动作你常要反复用——与其每次重抄，不如**封装成函数，调用一次执行一次**。\n\n```python\ndef greet(name, times):\n    for i in range(times):\n        print(f\"你好，{name}！\")\n\ngreet(\"阿远\", 2)     # 调用\n```\n\n> 【本质一行】**函数 = 一段被命名的逻辑，可反复调用，还能用 `return` 把结果交回给调用方。**\n> 你后面要写的所有工具（查知识库、查订单），本质都是这种\"有明确输入输出\"的函数。\n\n## 第 6 步 import：用别人写好的库（重中之重）\n\n写稍微正经的程序，十有八九不必从零造轮子——常用功能早有人打包成了**库（library）**，`import` 一下就能用。\n\n```python\nimport math\nprint(math.sqrt(16))     # 4.0 —— 平方根现成有\n\nimport random\nprint(random.randint(1, 10))   # 1~10 随机整数\n```\n\n> 💡 后面调大模型，你必装一个叫 `requests` 的库——它负责在 Python 里发 HTTP 请求。现在装好备用：\n> ```shell\n> pip install requests\n> ```\n\n---\n\n## 第 7 步 JSON：AI 应用里到处在传的数据格式\n\n**为什么放在这里**：下一站开始，你几乎每一行代码都在处理 JSON——\n`response.json()` 拿到的、`messages` 数组、模型的 `tool_calls`。它不是\"顺便碰到\"的东西，\n而是这个领域**通用的数据格式**。现在花 20 分钟，后面每站都省。\n\nJSON 一共就六种东西：\n\n| JSON 里的 | 长这样 | 对应 Python |\n|---|---|---|\n| 对象 | `{\"name\": \"阿远\", \"age\": 20}` | `dict` |\n| 数组 | `[\"苹果\", \"香蕉\"]` | `list` |\n| 字符串 | `\"你好\"` | `str` |\n| 数字 | `20` / `1.75` | `int` / `float` |\n| 布尔 | `true` / `false` | `True` / `False` |\n| 空 | `null` | `None` |\n\n**两个方向、两个函数**，记住\"s 是给字符串用的\"：\n\n```python\nimport json\n\n# ① 文本 → Python 对象（读接口返回时用）\ntext = '{\"name\": \"阿远\", \"age\": 20}'\ndata = json.loads(text)          # loads：把字符串 load 成对象\nprint(data[\"name\"])              # 阿远 —— 现在能用键取值了\n\n# ② Python 对象 → 文本（发请求时用）\npayload = {\"model\": \"deepseek-chat\", \"messages\": [{\"role\": \"user\", \"content\": \"你好\"}]}\nbody = json.dumps(payload, ensure_ascii=False)   # ensure_ascii=False：中文不转成 \\uXXXX\nprint(body)\n```\n\n> **JSON 和 dict 看着像，但不是一回事**：dict 是 Python 里的对象，JSON 是一种**文本格式**。\n> 网络上只能传文本，所以两边要来回转——这就是那两个函数存在的理由。\n\n**一个真实的取数路径**（下一站你就亲手写）：\n\n```python\n# 模型返回的 JSON 长这样，剥三层才拿到文字：\n# {\"choices\": [{\"message\": {\"content\": \"你好呀\"}}]}\nanswer = data[\"choices\"][0][\"message\"][\"content\"]\n```\n\n这种\"一层套一层\"是 API 的常态。**`print(data)` 看结构，比背任何文档都快。**\n\n---\n\n## 第 8 步 异常处理：出错不是意外，是常态\n\n**为什么放在这里**：再往后（调 API、读文件、跑工具）**每一处都会出错**——\n网络断、Key 错、文件不存在、模型返回的字段变了。\n\n不处理会怎样？**程序直接崩，用户看到一大段英文堆栈，不知道发生了什么。**\n\n```python\ntry:\n    n = int(input(\"请输入一个数字：\"))\n    print(10 / n)\nexcept ValueError:\n    print(\"这不是一个数字\")\nexcept ZeroDivisionError:\n    print(\"不能除以 0\")\nfinally:\n    print(\"不管成不成功，这句都会执行\")\n```\n\n四块各干什么：\n\n| 块 | 什么时候执行 |\n|---|---|\n| `try` | 放**可能出错**的代码 |\n| `except` | 出错了走这里（可以写多个，按异常类型分别接住） |\n| `else` | **没**出错时走这里（可选） |\n| `finally` | 无论成没成都要执行（关文件、断连接） |\n\n**两条纪律**：\n\n1. **捕获具体异常，别用裸 `except:`**\n   ```python\n   except Exception as e:        # ✅ 至少把原因拿到手\n       print(f\"出错了：{e}\")\n   ```\n   裸 `except:` 会把\"用户按了 Ctrl+C\"这种也一起吞掉，调试时你连错在哪都不知道。\n\n2. **要么处理，要么往上抛**\n   ```python\n   raise ValueError(\"模型返回里没有 content 字段\")   # 主动报错，把话说清楚\n   ```\n\n**为什么后面到处是它**：阶段三 `agent.py` 里那句\n`try: ... fn(**args) ... except Exception as exc:` ——**不是突然冒出来的新知识，就是这一节**。\n它的作用是\"工具崩了不拖垮整个 Agent\"（把错误当成一条消息喂回模型，而不是让程序死掉）。\n现在学过，到时就是\"用\"，不是\"学\"。\n\n---\n\n## 第 9 步 文件与模块：程序要读文件，也要分家\n\n**读文件**——阶段二 RAG 的第一步就是它：\n\n```python\nwith open(\"data/手册.md\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()\n\nprint(len(text))        # 有多少字\n```\n\n```python\n# 写文件\nwith open(\"out.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"写进去的内容\")\n```\n\n| 模式 | 含义 |\n|---|---|\n| `\"r\"` | 读（文件必须存在） |\n| `\"w\"` | 写（**会清空原有内容**） |\n| `\"a\"` | 追加（在末尾接着写） |\n\n> ⚠️ **处理中文文件必须写 `encoding=\"utf-8\"`。** 不写的话，Windows 默认按 GBK 解码，\n> 一读 UTF-8 的中文就报 `UnicodeDecodeError` —— 这是新手最常撞的一堵墙。\n>\n> 另外 `with` 会在代码块结束时**自动关闭文件**，比手动 `f.close()` 稳（忘了 close 会丢数据）。\n\n**模块与包**——为什么 `companion/` 要分 `phase1/`、`phase2/`：\n\n- **一个 `.py` 文件 = 一个模块**，文件名就是模块名：`chunker.py` → `import chunker`\n- **一个文件夹 = 一个包**，里面的模块可以互相 import\n- 三种常见写法：\n\n```python\nimport math                     # 整个模块进来，用的时候写 math.sqrt(16)\nfrom math import sqrt           # 只拿一个函数，用的时候直接 sqrt(16)\nimport json as j                # 起个别名\n```\n\n**为什么现在要懂**：阶段二你会写 `from chunker import chunk`，\n阶段三会写 `from agent import ToolRegistry`。\n**看得懂这句是在\"从哪个文件的哪个函数拿东西\"，而不是\"照着文件夹抄\"**——这是两回事。\n\n---\n\n## 串起来：写一个能记账的小程序（本步产出物）\n\n把上面 9 个零件拼起来，你就有第一个\"有点用\"的程序——**能加账、能看账**：\n\n```python\nbooks = []                       # 一个空列表，装所有账\n\ndef add(what, amount):           # 函数：收一条账\n    books.append({\"事情\": what, \"金额\": amount})\n\ndef show():                      # 函数：把所有账打印出来\n    for b in books:              # 循环遍历\n        print(b[\"事情\"], b[\"金额\"])\n\n# 用起来\nadd(\"早饭\", 8)\nadd(\"地铁\", 4)\nshow()\n```\n\n> 你看，这一小段**同时用上了**变量、列表、字典、循环、函数、调库——这些就是你之后做 AI 应用的全部语法零件。别小看它。\n\n---\n\n## 验收：能讲出来才算会（不笔试、不看笔记）\n\n1. `user = {\"name\": \"阿远\"}`，我怎么拿到\"阿远\"？为什么下标从 0 开始？\n2. 用户输入年纪后，为什么必须先 `int(...)` 才能当数字用？\n3. 什么叫\"把一段逻辑封装成函数\"？`return` 是干嘛的？\n4. **`json.loads` 和 `json.dumps` 分别往哪个方向转？** 网络传输为什么必须转成文本？\n5. **`except Exception as e` 和裸 `except:` 差在哪？** 后面 `agent.py` 用的是哪一种、为什么？\n6. **读中文文件为什么必须写 `encoding=\"utf-8\"`？** 不写会报什么错？\n\n答不上就回上文对应小步找，别硬猜。\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n- 不用重读全文：打开 companion 的 `phase1/chat_cli.py` 看几分钟——里面 dict 取值、函数、循环、import 全都有实际用法；看得懂=复位成功。\n- 记忆锚：**这一站的 9 个零件（变量/类型/容器/判断循环/函数/import/JSON/异常/文件模块）+ 一条：\"后面调大模型的返回就是一个 JSON，按层取值\"。**\n\n## 下一步：语法零件备齐了\n\n下一站，我们让这个程序**真的去调用大模型**——让它能生成回答，而不只是算你自己写死的逻辑。\n用到的东西，全在前面这 9 个零件里（尤其 **JSON** —— 下一站整篇都在跟它打交道）。\n\n> 去读阶段一 · `03_HTTP基础-请求与响应.md`。"}, {"id": "sec7", "group": "阶段一 · Python 与 API", "title": "HTTP基础-请求与响应", "basename": "03_HTTP基础-请求与响应.md", "markdown": "# 阶段一 · 第 3 步：HTTP —— 一次请求和一次响应\n\n> 这一站解决什么：下一步你要做的事是\"调用大模型 API\"。但在那之前，必须先把这件事看穿：\n> **所谓调用 API，就是一次 HTTP 请求。** 没有这层心智模型，你后面遇到 401、超时、429、\n> 跨域、流式，都会当成\"玄学\"；有了它，这些都是**可定位的具体问题**。\n> 判断基准：2026-09-20。协议细节会变，但\"请求 / 响应\"这套结构几十年没变。\n> 📍 **项目坐标**：**v0.1 的前置**。不推进版本，但下一版能不能顺利加上，全看你这一篇懂没懂。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：`json.dumps({\"a\": 1})` 输出的是什么类型？（字符串还是字典）\n2. 动手：写一个小脚本，故意 `int(\"abc\")` 并捕获异常，让它打印一句人话而不是堆栈。\n3. 概念：什么叫\"模块\"？`from math import sqrt` 和 `import math` 用起来差在哪？\n\n**站纲（跨 4 小步）**\n**请求由什么组成 → 响应由什么组成 → 状态码在说什么 → 超时和重试为什么必须设**\n\n---\n\n## 第 1 步 一次请求，就四样东西\n\n你在浏览器里打开一个网页、在代码里调一次大模型，本质都是同一件事：**你的程序发一个 HTTP 请求给某个服务器，服务器回一个响应。**\n\n一个请求由四部分组成：\n\n| 部分 | 是什么 | 例子 |\n|---|---|---|\n| **方法 method** | 你要干什么 | `GET`（取）、`POST`（提交）、`PUT`（改）、`DELETE`（删） |\n| **地址 URL** | 找谁 | `https://api.deepseek.com/chat/completions` |\n| **请求头 headers** | 附加说明（我是谁、我要什么格式） | `Authorization: Bearer sk-xxx`、`Content-Type: application/json` |\n| **请求体 body** | 具体内容（GET 通常没有） | `{\"model\": \"deepseek-chat\", \"messages\": [...]}` |\n\n> **GET 和 POST 的区别，一句话**：GET 是\"我要读东西\"（参数放在 URL 里），\n> POST 是\"我要提交东西\"（内容放在 body 里）。**调用大模型用 POST**——因为你要提交一大段对话。\n\n## 第 2 步 一次响应，三样东西\n\n| 部分 | 是什么 | 例子 |\n|---|---|---|\n| **状态码 status code** | 结果如何（三位数字） | `200`、`401`、`429`、`500` |\n| **响应头 headers** | 服务器在说明自己 | `Content-Type: application/json`、`Retry-After: 5` |\n| **响应体 body** | 真正的数据 | `{\"choices\": [{\"message\": {...}}]}` |\n\n**你代码里那一串取值，取的就是 body**：\n\n```python\nresp = requests.post(url, headers=headers, json=payload)\ndata = resp.json()                                  # 把 body 从文本转成 Python 对象\nanswer = data[\"choices\"][0][\"message\"][\"content\"]   # 按结构取出来\n```\n\n## 第 3 步 状态码：服务器在用它跟你说话\n\n**背下这几类，比背具体数字有用**：\n\n| 范围 | 含义 | 该怎么办 |\n|---|---|---|\n| **2xx** | 成功 | 正常处理返回的数据 |\n| **3xx** | 重定向 | 库一般会自动跟，不用管 |\n| **4xx** | **你的请求有问题** | 改你的代码，重试没用 |\n| **5xx** | **服务器那边有问题** | 可以稍后重试 |\n\n**你一定会碰到的四个**：\n\n| 码 | 意思 | 最常见的原因 |\n|---|---|---|\n| `200` | 成功 | —— |\n| `401` | 未认证 | **Key 错了或没带**，或者 `Bearer ` 后面少了个空格 |\n| `403` | 无权限 | Key 有效，但这个资源不给你访问 |\n| `404` | 找不到 | **URL 或路径写错了** |\n| `429` | 请求太频繁 | 你短时间内调太多次，被限流了——**要退避重试**，别硬刷 |\n| `500` | 服务器内部错误 | 不是你的问题，等一会儿或看对方状态页 |\n\n> **这个区分很值钱**：4xx 说明**你要改代码**，5xx 说明**等一下再试**。\n> 分不清这两种，就会出现\"401 了还在死循环重试\"这种事故。\n\n## 第 4 步 超时与重试：不设它们，程序会挂死\n\n**超时（timeout）**：网络请求可能永远卡住。不设超时，你的程序就可能**一直等下去**。\n\n```python\nresp = requests.get(url, timeout=10)      # 10 秒还没回应，就抛异常，别死等\n```\n\n**重试（retry）**：网络抖动是常态，但要**有策略地重试**——不是无脑刷。\n\n```python\nimport requests, time\n\ndef get_with_retry(url, tries=3, timeout=10):\n    for i in range(1, tries + 1):\n        try:\n            return requests.get(url, timeout=timeout)\n        except (requests.Timeout, requests.ConnectionError) as e:\n            print(f\"第 {i} 次失败：{e}\")\n            if i == tries:\n                raise                     # 全试完了还不行，就别瞒着，抛出去\n            time.sleep(i * 2)             # 退避：越失败等越久，别猛刷对方\n```\n\n> 🔬 **两条纪律**：\n> ① **只重试\"值得重试的\"**——网络超时、5xx、429 可以；401/404 重试一万次也没用。\n> ② **重试要有上限和退避**。无上限重试等于自己给自己造 DDoS。\n\n---\n\n## 动手：真发一个请求，亲眼看到 200 和 404\n\n**开两个终端**。第一个起一个本地服务：\n\n```bash\n# 终端 1：在任意有文件的目录下\npython -m http.server 8000\n```\n\n第二个用 `requests` 去请求它：\n\n```python\n# 终端 2\nimport requests\n\nr = requests.get(\"http://127.0.0.1:8000/\", timeout=5)\nprint(\"状态码：\", r.status_code)              # 200\nprint(\"Content-Type：\", r.headers.get(\"Content-Type\"))\nprint(\"响应体前 80 字：\", r.text[:80])\n\nr2 = requests.get(\"http://127.0.0.1:8000/这个文件不存在.txt\", timeout=5)\nprint(\"状态码：\", r2.status_code)             # 404\nprint(\"两者状态码不同，但代码没崩——因为 4xx 不是异常，是响应\")\n```\n\n**你要在这里看清一件事**：`requests` 拿到 404 **不会报错**，它把\"404\"当成一次正常的响应交给你。\n**判断成败要靠你自己检查 `status_code`** —— 这一步想通，后面所有的错误处理都顺了。\n\n**最后认清\"响应\"和\"异常\"的分界**（这是本篇最重要的一条）：\n\n```python\nimport requests\n\ntry:\n    resp = requests.get(url, timeout=10)      # 只有这一步会抛异常\n    if resp.status_code == 200:\n        print(\"成功：\", resp.text[:50])\n    else:\n        print(f\"服务器回了个 {resp.status_code}，按状态码分别处理\")   # ← 这不是异常\nexcept requests.Timeout:\n    print(\"超时：网络慢，或对方一直没响应\")\nexcept requests.ConnectionError:\n    print(\"连不上：网络断了，或域名/端口不对\")\nexcept requests.RequestException as e:\n    print(f\"其他请求类错误：{e}\")\n```\n\n> **记住这条分界**：\n> - **服务器回了话**（哪怕是 404 / 401 / 500）→ 那是**响应**，你按 `status_code` 处理，代码不会崩。\n> - **连话都没回上**（超时、DNS 失败、连接被拒）→ 那是**异常**，必须用 `try/except` 接住。\n>\n> ⚠️ **一个实测提醒**：具体报哪个异常，**跟你的网络环境有关**。\n> 如果你机器上配了代理，本该\"连接被拒\"的请求可能变成\"超时\"，甚至返回一个错误页。\n> **别背结论，跑一次看你自己的环境报什么** —— 这也是以后排查问题的基本习惯。\n\n---\n\n## 验收：能讲出来才算会\n\n1. 一次请求由哪四部分组成？一次响应由哪三部分组成？\n2. `401` 和 `500` 的处理策略为什么不一样？（谁该改）\n3. 为什么必须设 `timeout`？不设会发生什么？\n4. 为什么\"重试\"不能无脑做？哪类错误不该重试？\n5. 为什么 `requests` 收到 404 不报错？你该怎么判断成功失败？\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 能背出\"请求四件、响应三件\" = 复位成功。\n2. 打开任意一篇调用接口的代码，能指出：URL 在哪、headers 在哪、body 在哪、状态码怎么判。\n3. 看\"验收\"题，答不出的回对应小步。\n> 记忆锚：**本步 = \"请求（方法/URL/头/体）→ 响应（状态码/头/体）；4xx 改我、5xx 等它；超时必设、重试有上限\"。**\n\n## 下一步：现在你可以真正去\"调用\"了\n\n你已经有了 Python 零件（变量到模块），又看清了 HTTP 的结构。\n下一站把这些合起来——**发一个 POST，带上一段 JSON，把模型的回答取回来**。\n那一刻你会发现：所谓\"调用大模型\"，你早就知道它长什么样了。\n\n> 下一篇：阶段一 · `04_大模型API调用实战.md`\n"}, {"id": "sec8", "group": "阶段一 · Python 与 API", "title": "大模型API调用实战", "basename": "04_大模型API调用实战.md", "markdown": "# 阶段一 · 第 4 步：调用大模型 API（产出第一交付物）\n\n> 这一站解决什么：上一站你已经把\"请求 — 响应\"的结构看穿了。这一站真的发出去——把文本送出去、把回复取回来。\n> 你之前的程序只会算自己写死的逻辑，**从这一站起它开始\"能生成内容\"**。\n> 这一站给它接一个外部接口：把你输入的文本发出去，把模型的回复取回来。\n> 做完你会明确一件事——**所谓\"调用大模型\"，本质就是一次 HTTP 请求。**\n> 📍 **项目坐标**：做完这一篇，你的客服助手到 **v0.1 → v0.2** —— 它第一次能\"说话\"，并且记得住上下文。\n> 验证方式看 `00_项目主线`：跑 `python evolution_demo.py`，对比 v0.1 和 v0.2 的输出。\n> 判断基准：2026-09-20。本笔记以 **DeepSeek** 为例（对新手友好、便宜），换智谱/Kimi 思路完全一样。\n> 交付物对应：`companion/phase1/chat_cli.py`（本篇末尾会把它升级成\"健壮可上线\"的版本）。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：`.env` 里写成 `DEEPSEEK_API_KEY=\"sk-abc\"`（**带引号**），`os.getenv()` 取出来的是什么？引号会不会一起进去？\n2. 动手：发请求时 `messages` 里**只放当前这一句**，然后问它「我叫什么」。它会答什么？为什么？\n3. 概念：`.gitignore` 里第一行该写什么？不写会有什么后果？\n\n**站纲（跨 4 小步）**\n**先搞清它是\"无状态的文本补全\" → 认识接口的输入输出 → 手写第一个请求 → 用 messages 数组实现多轮（→ 交付物）**\n\n---\n\n## 第 1 步 大模型在你眼里，到底是什么（先懂再动手）\n\n忘掉\"智能\"\"深度学习\"这些吓人的词。站在\"你的代码\"的角度，大模型就一个行为：\n\n> **你塞给它一段文字，它吐回\"最像接着往下写\"的文字。**\n\n它**不查你的数据库**、**不记得你之前说过什么**。它只会一件事：**根据你刚给它的整段文字，预测接下来该接什么字。**\n\n> 💡 这句话决定了后面好几个关键写法——尤其\"它没记忆，所以多轮对话要把历史整段发过去\"这条，是第 4 步的核心。\n\n## 第 2 步 接口的三个要素：地址、凭证、报文\n\n模型跑在别人的服务器上，你的程序不可能\"直接调用\"它——只能通过它开放的一个 **HTTP 接口（API）**。\n\n这个接口要你操心的就三样：\n\n| 要素 | 它是什么 | 在你代码里长什么样 |\n|---|---|---|\n| **地址（URL）** | 往哪儿发 | `https://api.deepseek.com/chat/completions` |\n| **凭证（Key）** | 证明\"这是我发的，账记我头上\" | 放在 `Authorization` 请求头里 |\n| **报文（JSON）** | 你发什么、它回什么 | 请求体写模型名和对话；响应体里读回复 |\n\n所以代码里永远只有三件事：**带上凭证 → 发一份 JSON → 从返回的 JSON 里取字段。**\n第 3 步你会亲手写这三件事。**写一遍，比背十遍有用。**\n\n### 先拿到凭证：申请一个 API Key\n\n1. 打开 DeepSeek 开放平台，注册/登录，找到 **API Keys** 页面。\n2. 新建一个 Key——得到一串 `sk-` 开头的东西。**只显示这一次，立刻复制存好。**\n3. ⚠️ 安全：**这把 Key 就是你的付款凭证**，泄露了别人能直接花你的钱。别发群、别传 GitHub（下面教你放进环境变量）。\n\n## 第 3 步 手写第一个请求（每一行在干什么）\n\n我们不用任何现成封装，直接用 `requests` 手写发请求——**因为只有你自己拼一次，才真正看懂\"调用\"到底是往哪里发、拿回什么。**\n\n```python\nimport requests                                 # 发 HTTP 请求的库\nimport os\nfrom dotenv import load_dotenv\nload_dotenv()                                   # 把 .env 里的键值读进环境变量\n\nAPI_KEY = os.getenv(\"DEEPSEEK_API_KEY\")         # 凭证：从环境变量取，不写死在代码里\nurl = \"https://api.deepseek.com/chat/completions\"  # 接口地址\n\nheaders = {\n    \"Authorization\": f\"Bearer {API_KEY}\",       # 凭证放请求头（注意 Bearer 后有空格）\n    \"Content-Type\": \"application/json\"          # 声明\"我发的是 JSON\"\n}\n\npayload = {\n    \"model\": \"deepseek-chat\",                    # 我要点\"哪个菜\"（哪个模型）\n    \"messages\": [                                # 这是一份\"对话记录\"\n        {\"role\": \"system\", \"content\": \"你是友好的助手\"},   # 设定它的\"人设\"\n        {\"role\": \"user\", \"content\": \"你好，介绍一下你自己\"} # 你问的话\n    ]\n}\n\nresp = requests.post(url, headers=headers, json=payload)  # 打出去，等回信\ndata = resp.json()                               # 回信是 JSON，转成 dict 方便取\n\nanswer = data[\"choices\"][0][\"message\"][\"content\"]  # 一层层剥开，拿到文字\nprint(answer)\n```\n\n【本质一行】**你做的只是\"发一次 HTTP POST + 从返回的 JSON 里按字段取值\"，没有任何魔法。** 跑通那一刻你会觉得\"大模型也就这样\"——对，它首先是个普通的网络接口。\n\n这个认知值钱的地方在后头：以后遇到\"接口超时\"\"返回字段变了\"\"被限流了\"，你处理的是**网络与数据结构问题**，不是玄学。\n\n> 想看回信长啥样？加一行 `print(resp.json())`，亲眼看它的结构，比背任何东西都管用。\n\n### 把凭证放进 .env（安全，必须做）\n\n同目录建一个 `.env` 文件放密钥，别写死在代码里：\n\n```\nDEEPSEEK_API_KEY=sk-你的key\n```\n\n先 `pip install python-dotenv`，代码里 `load_dotenv()` + `os.getenv(...)` 就能读（上面代码已按这个写法给你）。**这样你即使把代码传 GitHub，Key 也不会泄露。**\n\n## 第 4 步 让它记住对话：多轮聊天（阶段一交付物 🎉）\n\n这里有个反直觉的点：**接口是无状态的**——你第 2 次请求时，它根本不知道你第 1 次问过什么。\n所以\"连续对话\"不是它记住了，而是**你每次把完整的历史数组重新发一遍**：\n\n```python\nimport requests, os\nfrom dotenv import load_dotenv\nload_dotenv()\nAPI_KEY = os.getenv(\"DEEPSEEK_API_KEY\")\nurl = \"https://api.deepseek.com/chat/completions\"\nheaders = {\"Authorization\": f\"Bearer {API_KEY}\", \"Content-Type\": \"application/json\"}\nMODEL = \"deepseek-chat\"\n\nmessages = [{\"role\": \"system\", \"content\": \"你叫小远，回答尽量简短\"}]\n\ndef ask(user_text):\n    messages.append({\"role\": \"user\", \"content\": user_text})        # 记下你这句话\n    resp = requests.post(url, headers=headers,\n                         json={\"model\": MODEL, \"messages\": messages})\n    answer = resp.json()[\"choices\"][0][\"message\"][\"content\"]\n    messages.append({\"role\": \"assistant\", \"content\": answer})      # 记下 AI 这句\n    return answer\n\nwhile True:\n    u = input(\"你说：\")\n    if u.strip().lower() in (\"quit\", \"exit\", \"退出\"):\n        break\n    print(\"AI：\", ask(u))\n```\n\n> **这就是阶段一的交付物——一个能连续对话的命令行助手。** 你跑起来，跟它聊上几句，第一条\"会说话的生产线\"就跑通了。\n\n`messages` 就是个数组，每次请求**整个发过去**。说过的话都堆在里面，所以你的报文会一次比一次长——\n**这正是多轮对话越来越慢、越来越贵的原因**（记住这条，后面讲成本时要用）。想改它的行为，就改 `system` 那条消息。\n\n### 两个最常调的参数\n\n```python\npayload = {\"model\": MODEL, \"messages\": messages,\n           \"temperature\": 0.7,   # 越低越严谨、越高越有创意\n           \"max_tokens\": 500}    # 最多生成多少字，防超长\n```\n\n### 训练营增量：把\"能聊\"升级成\"健壮可上线\"\n\n上面那版能聊，但它是**练习版**：缺 Key 会抛裸异常、断网时你看到的是 Python 堆栈、没有日志、也没有测试保护。\n要交的是 **`companion/phase1/chat_cli.py`（v1.0.0）那个\"健壮版\"**——它把这一站讲的东西全落实了，对照着数它带了哪些：\n\n- **配置从 `.env` 读**，缺 Key 时抛出\"照着做\"的友好提示（不是堆栈）。\n- **请求失败分类**：网络错 / 401(Key 无效) / 429(限流) / 服务端错，分别讲人话。\n- **日志**：`--verbose` 才暴露 DEBUG，平时安静。\n- **延迟 import**：让 `test_smoke.py` 不装任何第三方包也能跑 —— 这就是\"可运行契约\"能随手验证的原因。\n\n> 🔬 训练营要求：**别直接 copy。** 读完上面再对照 `companion/phase1/chat_cli.py`，理解每一处\"为什么要这么写\"，再用你自己的话把它敲出来一遍。\n\n它的冒烟测试在 `companion/phase1/test_smoke.py`（已通过，见上一站）。CI 里 `push` 也会跑它——你改坏了它会红，逼你看懂为什么。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n> 三类分开打勾：**🧠 理解**（能讲清）｜**🔧 实践**（能跑通）｜**📌 证据**（有产物）。\n> ⚠️ **证据类才是硬指标** —— 理解可以自我欺骗，实践跑一下就知道，证据骗不了人。\n\n**🧠 理解（能用自己的话讲出来）**\n- [ ] 能对朋友讲清：大模型**没记忆**，多轮靠\"把整段历史原样发回去\"\n- [ ] 能讲清 `[\"choices\"][0][\"message\"][\"content\"]` 你剥开的是哪几层\n\n**🔧 实践（能跑通才算）**\n- [ ] 故意删掉 `.env` 里 Key 再跑——看到的是友好中文提示 + 退出码 1，**不是 Python 堆栈**\n- [ ] 用你的 Key 跑 `companion/phase1/chat_cli.py`，能连续对话 3 轮以上\n- [ ] `python phase1\\test_smoke.py` 输出 `OK`（6 项全过）\n\n**📌 证据（这几条必须真拿出东西，不许打勾了事）**\n- [ ] **贴出你那 3 轮对话的真实输出**，其中必须包含它答出「小林」那一句\n- [ ] **贴出 Key 写错 / 断网时的报错信息**——证明你看到的是人话，不是 Python 堆栈\n- [ ] 给这条交付物 `git commit` 了一句（Git 已在本站前面装好）\n\n## 常见坑（这一步的高发区）\n\n| 现象 | 根本原因 | 解决 |\n|---|---|---|\n| 401 认证失败 | Key 不对 / `Bearer ` 后面没空格 | 核对 Key 与空格 |\n| 404 | 模型名或 URL 写错 | 回官方文档对 `model` 名 |\n| 429 超额度 | 额度用完/太频繁 | 看余额；`time.sleep(1)` 降频 |\n| 缺 Key 报英文堆栈 | 用了练习版代码 | 换 companion 的健壮版 |\n| 中文乱码 | 编码 | `.py` 保存为 UTF-8 |\n| 觉得 API 贵 | 模型成本高 | 换 DeepSeek/智谱/Kimi 更便宜的模型，代码逻辑不变 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/`，激活 venv，跑 `python phase1\\test_smoke.py` → `OK` 则环境没坏。\n2. 跑 `python phase1\\chat_cli.py` 跟它聊一句，确认接口还能调通。\n3. 看\"验收清单\"，未勾的补上；勾满就进阶段二。\n> 记忆锚：**本步 = \"发一次 HTTP 请求 + 按结构取结果\"，再加\"缺什么报什么\"的健壮化。**\n\n## 下一步：阶段一完成，进入真正的\"知识库\"\n\n你不是在\"调用魔法\"，而是在**发一次 HTTP 请求、按结构取结果**。想通这点，第一关就打通了——\n接下来 RAG、Agent，全都是**在这个请求的前后加环节**：前面加检索、后面加工具循环。\n\n> 进入阶段二 · `03_阶段二_RAG知识库`。\n> 记得给这一阶段的交付物 `git commit` 并存 GitHub——它是你作品集的第一块积木。"}, {"id": "sec9", "group": "阶段一 · Python 与 API", "title": "真环境关卡", "basename": "05_真环境关卡.md", "markdown": "# 阶段一 · 真环境关卡：把\"测试跑绿\"换成\"真的聊过天\"\n\n> **这是一道关卡，不是一课。过不了，不要翻阶段二。**\n> 为什么单独设它：companion 的冒烟测试是**零依赖、不需要 Key** 的——这是优点（随时能跑），\n> 但也埋了个坑：**你可以一路测试全绿，却从没真正调用过一次大模型。**\n> 那种情况下你以为自己学会了，实际只是把代码看了一遍。这一关就是把这个洞堵上。\n> 📍 **项目坐标**：**关卡①**：不推进版本，但它决定 v0.1–v0.2 **算不算数**——测试跑绿不等于你真的调通过大模型。\n\n---\n\n## 第 1 关 拿到一把真钥匙\n\n1. 打开 DeepSeek 开放平台 → 注册/登录 → 找到 **API Keys** → 新建。\n2. 得到一串 `sk-` 开头的字符。**它只完整显示一次**，立刻复制存好。\n3. 充值一点点就行（几块钱够你跑完整个手册的练习）。\n\n> 🔬 训练营要求：这一关不接受\"我先看看别人的代码\"。**没有 Key 就等于这一关没过。**\n\n## 第 2 关 真的聊起来，并且证明它有上下文\n\n```bash\ncd companion\ncopy .env.example .env      # 然后打开 .env，把你的 sk- Key 粘进去\npython phase1\\chat_cli.py\n```\n\n然后**按这个顺序**聊，专门测\"它记不记得\"：\n\n```\n你：我叫小林，请记住\n你：我刚刚说我叫什么？\n你：那我叫什么名字来着，再说一遍\n```\n\n**它必须答得出\"小林\"。** 答不出说明你的 messages 没在累积——回阶段一第 4 步看那根\"越缠越长的记录绳\"。\n\n## 第 3 关 故意把它弄坏（这一步最能证明你懂了）\n\n把 `.env` 里的 Key 改成 `sk-wrong`，再跑一次。\n\n- ❌ 如果你看到一大段 Python 堆栈 → 你用的是**练习版**代码，不是 companion 的健壮版。\n- ✅ 如果你看到人话，比如\"API Key 无效（401），请检查 .env 里的 DEEPSEEK_API_KEY\" → 过关。\n\n再把 Key 改回来，确认能正常聊。然后**断网**跑一次，看它给你的提示是不是人话（网络类错误）。\n\n---\n\n## 通过标准（把证据贴出来，别只打勾）\n\n- [ ] 贴出你那 3 轮对话的真实输出（截图或粘贴），其中必须包含它答出\"小林\"\n- [ ] 贴出 Key 写错时的报错信息（证明你看到的是人话而不是堆栈）\n- [ ] 贴出断网时的提示，并说清它属于哪一类错误（网络 / 401 / 429 / 服务端）\n- [ ] 能给朋友讲明白：**为什么这三次测试单靠 `test_smoke.py` 一个都验不出来**\n- [ ] 把 `.env` 加进了 `.gitignore`（用 `git status` 确认它没被跟踪）\n\n## 卡住了看这里\n\n| 现象 | 原因 | 解法 |\n|---|---|---|\n| `ModuleNotFoundError: dotenv` | 没装依赖 | `pip install -r requirements.txt`（在 venv 里） |\n| 401 认证失败 | Key 错，或 `Bearer ` 后面少空格 | 核对 `.env` 与空格 |\n| 402 / 余额不足 | 账户没充值 | 充一点，几块钱即可 |\n| 429 | 调用太频繁 | 等几秒再试 |\n| 中文乱码 | 终端编码 | Windows 终端执行 `chcp 65001` |\n| `.env` 里 Key 有引号 | `KEY=\"sk-xxx\"` 的引号被当成值的一部分 | 去掉引号，写成 `KEY=sk-xxx` |\n\n## 过了这关，你手上多了什么\n\n**你已经真的调用过大模型了**，而且是在三种失败模式下都亲手验证过。\n\n这件事的价值：从这一关起，\"我调过大模型 API\"就是**真话**——而不是\"我看过调用的代码\"。\n面试官问\"你怎么处理 Key 失效\"时，你答的是自己踩过的，不是背的。\n\n> 下一站：阶段二 · RAG 知识库 → `03_阶段二_RAG知识库/01_RAG概念与全流程.md`。\n> 阶段二末尾也有一道真环境关卡（`07_真环境关卡.md`），到那儿要把**真的 chromadb 装上**——先记住这件事。\n"}, {"id": "sec10", "group": "阶段二 · RAG 知识库", "title": "周边扩展地图", "basename": "00_背景_周边扩展地图.md", "markdown": "# 阶段二 · 背景：周围还有谁——grep / SQL / 知识库 到底跟你学的 RAG 什么关系\n\n> 这一站解决什么：你刚学完 RAG，可能冒出疑问——\"grep、SQL、知识库 这些词，跟 RAG 是一回事吗？我要不要全学？\"这一篇不写代码，只帮你**把地图摊开**，看清楚\"你在 AI 检索这条路上站在哪、旁边是谁\"，免得学习时钻进信息茧房。\n> 判断基准：2026-09-19。\n> 📍 **项目坐标**：背景篇，不推进版本。这一页把检索周边（grep / SQL / 知识库）摆到一张地图上，让你知道自己站的位置。\n\n---\n\n## 一句话先定位：它们都是\"让 AI 拿到资料\"的几种姿势\n\nRAG、`grep`、`SQL`、知识库问答——本质都在解决同一件事：**让大模型基于资料回答**，只是\"资料长什么样、怎么取\"不同。用一个\"私厨+资料员\"的比方串起来：\n\n| 名字 | 它是什么 | 在\"资料员\"体系里像什么 | 要不要学 |\n|---|---|---|---|\n| **RAG（你刚学的）** | 按\"意思\"找文本块 | 资料员会**语义检索**，按你的意思翻资料柜 | 主线，已学 |\n| **`grep`** | 按\"**字**\"精确找代码/文本 | 资料员会**精确喊名字**：搜一行字、它在哪个文件 | 用 AI 写代码时很常用，顺手就懂，不占课 |\n| **SQL** | 查**结构化表格**数据（数据库） | 资料员会**按列查询**：从表格里筛出符合条件的行 | 要做\"查企业数据的智能体\"时才需深学；对\"AI × 结构化数据\"是加分 |\n| **知识库问答** | 把文档/wiki 建索引给 AI 查 | 它就是 **RAG 最典型的产品形态** | 不用另学——你阶段二做的就是它 |\n\n## 为什么这些\"很老\"的东西没被淘汰，反而还重要\n\n判断\"前不前\"，不看**诞生的年份**，看它**是否被当代主流范式重新用起来**：\n\n- **`grep`**：它本身是几十年的老命令，但现在是\"AI 读写代码库\"时**给智能体做精确检索**的工具——等于被\"Agentic 编程\"重新激活了，所以在 AI 圈一点不过时。\n- **SQL**：SQL 老，但 **Text-to-SQL（让大模型自己生成 SQL 去查库）** 是当下明确的前沿能力。你将来若做大模型查企业数据，它就是支点。\n- **\"LLM wiki / 知识库问答\"**：其实就是 RAG 的核心场景——**你阶段二做的产品，正是它。** 所以你根本没学错，也没学旧。\n\n> 💡 一句话收下：**这些都不是\"要不要内卷的新东西\"，而是\"同一个问题下的不同取数方式\"。** 你用\"这是哪种资料、哪种取法、AI 能用它干嘛\"去看，任何新名词都不再有陌生感。\n\n## 顺手把\"身边那圈\"也想一遍：理解即可，不用深修\n\n除了上面三个，你以后还会碰到这些词——**知道它是干嘛的、和你主线啥关系**就够，别一上来就学：\n\n| 词 | 一句话 | 和你主线的关系 |\n|---|---|---|\n| **微调 Fine-tuning** | 改模型本身的\"性格/知识\" | 和 RAG 互补：RAG 改\"给模型看什么\"、可溯源；微调改\"模型自己\"、适合固定风格 |\n| **Text-to-SQL** | 让大模型自己生成 SQL 去查数据库 | 你做\"靠 AI 查企业数据\"时才显身手，是加分项 |\n| **Embedding 模型选型** | 选哪个向量模型决定检索上限 | 阶段二你已经在用，先够用即可 |\n| **Streaming 流式** | 一个字一个字吐出来，体验像打字机 | 提升手感的优化项 |\n| **多模态 Multimodal** | 模型能看图像、听音频 | 进阶方向，现在不必深耕 |\n| **AI 编程 Agent** | 用 AI 帮你读代码库、写代码 | **你当下就用它学习**，这是趋势本身 |\n\n## 防信息茧房的三件小事（每周约 30 分钟，别忽略）\n\n你学得越专注，越要主动往外看一眼，才不会\"只会做、不知全貌\"。低成本三件：\n\n1. **读官方源头，别只看二手教程**：OpenAI ∕ Anthropic ∕ LangChain/LangGraph 官方博客与文档，最新最准。\n2. **每周跑通一个\"没做过的小 demo\"**：比如一个小 Text-to-SQL、一个小 GraphRAG——把地图上的点变成\"亲手碰过\"。\n3. **把\"还不会的词\"记 3 条一句话**：每周攒几个不懂的名词，主动搜一次、听懂大意，认知边界就外扩一点。\n\n> 核心尺子就一句：**它现在能不能帮你把 AI 应用往前推、或靠近想要的岗位？** 能才学，否则先跳过，别为焦虑买单。这样你既不会茧房，也不会被新名词牵着走。\n\n## 验收：能讲懂才算会\n\n1. 用同一个\"资料员\"比方，说出 `grep`、`SQL`、RAG 三者分别擅长\"怎么取资料\"。\n2. 为什么老命令 `grep` 在 AI 时代反而\"不过时\"？\n3. 当你看到一个新概念（比如\"GraphRAG\"），你会用什么问题去判断它要不要学？\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n本步是\"地图\"，不写代码。复位只需一句话：**凡是名词，用同一把尺子问它——\"它现在是帮我把 AI 应用往前推，还是让我更靠近想要的岗位？\"能答是才学。** 忘词了就回看上面两张表。\n> 记忆锚：**本步 = \"grep=按字找、SQL=按列查、RAG=按意思找，都是让 AI 拿资料的姿势；被今天主流范式重新用起来的，才算不过时。\"**\n\n## 下一步：阶段二到此收官\n\n你已经具备\"让大模型基于你的资料回答 + 知道它怎么运作 + 答得不准就调\"的完整能力。下一阶段，让它**长出手来**——升级成会自己决定\"要不要查、怎么查\"的 Agent。\n\n> 进入阶段三 · `04_阶段三_Agent`。"}, {"id": "sec11", "group": "阶段二 · RAG 知识库", "title": "RAG概念与全流程", "basename": "01_RAG概念与全流程.md", "markdown": "# 阶段二 · 第 1 步：先看地图——RAG 是什么、为什么需要、一整条路怎么走\n\n> 这一站解决什么：阶段一让你能\"请大模型聊天\"。但它只会\"把话说得漂亮\"，**它根本不知道你的世界**——你的课程资料、你公司的文档，它一概没见过，问急了还一本正经地编（叫\"幻觉\"）。这一站出场一个叫 **RAG** 的东西，专门治这两个病：**让它\"先翻你的资料，再开口回答\"。**\n> 判断基准：2026-09-20。这一站先只求\"看懂地图\"，后面几篇再一行行把地图上每段路建起来。\n> 📍 **项目坐标**：**v0.3 的地图**：先看懂「问题 → 检索 → 拼证据 → 生成」这条线，接下来三篇负责把它一段段建起来。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：拿阶段一的 `chat_cli.py`，问它一个**只有你公司内部才知道**的规则。它答了什么？是编的还是说不知道？\n2. 动手：把一段 3000 字的文章整个塞进 prompt 里发给模型。想想：这次请求会花多少钱、它真能记住每一条吗？\n3. 概念：阶段一的交付物做到了哪一步、缺了什么？\n\n**站纲（这一站跨 4 小步，先懂再动手）**\n**大模型的两个硬伤 → RAG 是什么（一句话+逐字拆） → 一整条路怎么走（一张图) → 你将做出的东西长啥样**\n\n---\n\n## 第 1 步 先看清：大模型有两个硬伤（面试必答，但你要真懂）\n\n阶段一你学的调用，本质是：**把你给的一段文字发给大模型，它靠着训练时背过的海量资料，一个字一个字\"接着写\"下去。** 站在\"使用\"的肩膀上，它有俩毛病：\n\n1. **幻觉**：它没见过的内容会**一本正经地编**。你问\"我这学期教材第 3 章讲了什么\"——它根本没有那本书，也会煞有介事给你讲一大段，很可能全错。\n2. **知识截止**：它只知道**训练截止那天**之前的东西。今天刚出的数据、你私有的文档，它都不认识。\n\n> 🍳 一句话落地：**大模型\"会说话\"，但\"不知道你的世界\"。** 这就是为什么你不能直接拿它当\"公司客服\"——它没读你们的产品手册。\n>\n> 而你的不满恰好就是人家的机会：**\"能不能让它先翻'我的资料'再回答？\"** —— 能，那套做法就叫 RAG。\n\n## 第 2 步 RAG 是什么：一句话 + 逐字拆开\n\n**RAG（Retrieval-Augmented Generation，检索增强生成）**\n= 回答之前，先从**你自己准备好的资料库**里，**捞出跟这个问题最相关的几段**，再把\"**这几段资料 + 你的问题**\"一起丢给大模型，让它**看着资料回答**。\n\n把名字拆开你就不会忘：\n- **Retrieval 检索** = 先去资料堆里**翻**出最相关的几页。\n- **Augmented 增强** = 在\"生成\"之前，**额外喂给它证据**。\n- **Generation 生成** = 让它照着证据把话说完整。\n\n> 🍳 类比（贯穿整个阶段二）：把场景想成\"**私厨 + 资料员**\"。\n> - 大模型 = 一位**见多识广、但没读过你公司资料的厨师**；\n> - 你的资料库 = 公司**自家资料柜**；\n> - 你问的问题 = 一张**点单**；\n> - RAG = 一位**资料员**：先照着点单去资料柜**翻出最相关的几页**，把\"这几页纸 + 你的问题\"一起递给厨师。\n>\n> 于是厨师不再是凭脑子乱猜，而是**看着那几页纸来给你上菜**——答得准、还有出处。你要记住的全部动作，本质就是这一套\"翻资料→递给厨师\"。\n\n## 第 3 步 一整条路怎么走：一张图看完（画熟它）\n\nRAG 分**两段**：一段\"一次性把资料柜建好\"，一段\"每次回答时去翻\"。\n\n```\n━━━━ 离线准备（做一次就好）━━━━\n你自己的资料（课程/手册/笔记）\n      │  ① 切成一段段（分块）\n      ▼\n一块一块的\"切片\"\n      │  ② 想想每一块讲什么 → 转成一组数字（向量化）\n      ▼\n数字 + 原文字段，一起存进向量库（Chroma）\n     （这一步 = 把文档\"记忆\"进去，以后它才查得到）\n\n━━━━ 在线回答（每次提问都走）━━━━\n用户的问题\n      │  ③ 把问题也转成同样格式的数字（query 向量）\n      ▼\n去向量库找\"和这个问题最像的几块\"\n      │  ④ 取回 top 几块原文（检索）\n      ▼\n把\"这几块原文 + 你的问题\"拼进一段话\n      │  ⑤ 丢给大模型（增强 + 生成）\n      ▼\n带着出处的回答\n```\n\n> 💡 别被这么多步吓到——**绝大多数工具已经帮你做了**。你真正要亲手写的，退化成了三件小事：**怎么切成块(①)→怎么存(②+④)→怎么拼给大模型(⑤)**。而这几件，正好就是本阶段接下来每一篇笔记的主题。先有个地图在脑，后面就不会迷路。\n\n## 第 4 步 你将做出的东西，长什么样（给\"学完目标\"一个具体的脸）\n\n学完阶段二，你要交付的是——**\"读我资料才回答的助手\"**：\n\n```\n你: 我们产品的退货流程是怎样的？\nAI: 根据《客服手册.docx》：先和客户确认原因，\n    再在后台提交退货单，7 个工作日内审核。（见 P23）\n```\n\n它跟阶段一\"闲聊助手\"的差别，就一句话：**它只对着\"你自己的资料\"说话，而且能告诉你出处。** 这就是为什么企业愿意为它掏钱——这不再是\"聊天玩具\"，而是\"公司内部的问答助手\"。\n\n---\n\n## 验收：这一站只考\"懂\"（不背）\n\n1. 为什么不能裸拿大模型当\"公司客服\"？用你自己的话说出那**两个硬伤**。\n2. 用\"资料员 + 私厨\"的比方，给另一个人讲清楚 RAG 是干嘛的。\n3. 在一张纸上画 RAG 全流程，能标出\"哪些是一次性做的、哪些是每次提问都做的\"。\n\n答不上就回上文，别硬猜。\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 把 RAG 跟\"微调\"搞混 | 只记名词 | RAG=给模型看资料（可溯源）；微调=改模型本身（固定风格） |\n| 以为 RAG 要自己写一堆复杂东西 | 被名字唬住 | 你要亲手写的只剩三件：切块→存/查→拼给大模型（细看下面各篇） |\n| 担心\"知识库=要装全套大厂套件\" | 误以为重 | 离线就能先从头学起；真库只在需要时装 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n看上面那张 RAG 流程图：**一张纸画两段（离线准备 / 在线回答）**，能随口说出\"哪几步是一次性做的、哪几步是每次提问都走的\"，就算复位成功。接不上就回看第 3 步。\n> 记忆锚：**本步 = \"大模型有'幻觉+知识截止'两硬伤 → RAG 治它们 → 思想=私厨+资料员：先翻资料再答，答得准还有出处\"。**\n\n## 下一步：你先把地图装在脑子里，我们开始建路\n\n接下来几篇，一步步把地图上的路铺出来：**怎么把一堆文档切成\"一块一块\"(分块) → 怎么转成\"数字\"(向量) → 怎么存起来能查(Chroma) → 怎么串成完整闭环**。\n\n> 下一篇：阶段二 · `02_读取文档与分块.md`"}, {"id": "sec12", "group": "阶段二 · RAG 知识库", "title": "读取文档与分块", "basename": "02_读取文档与分块.md", "markdown": "# 阶段二 · 第 2 步：给资料\"切菜\"——读取文档 + 分块\n\n> 这一站解决什么：RAG 的第一步，是把你的原始资料变成\"一块一块能查的小切片\"。但**大模型和检索系统都啃不动一整本 PDF**——它们需要一个\"切得刚刚好\"的粒度。这一站就做这件事：**把文件读进来，切成合适大小的块。**\n> 判断基准：2026-09-20。库名会变，但\"先读、再切、切得合适的原理\"永不过时。\n> 📍 **项目坐标**：**v0.3 第一步**：给项目加「读资料」的能力——先把公司资料切成能用的块。\n> 交付物对应：`companion/phase2/chunker.py`（本文讲的切分，它已实现并带测试）。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：拿一段中文，用 `text.split()`（按空格切）切一下，看切出来几块。**为什么对中文几乎没用？**\n2. 动手：设 `size=100, overlap=0`，切两份相邻的块。这两块之间会丢掉什么？\n3. 概念：为什么不能把整本文档直接喂给大模型？（两个原因）\n\n**站纲（跨 3 小步）**\n**为什么不能整篇喂 → 把文件读进来 → 切成又小又刚好的一块块（附判断\"切得好不好\"的办法）**\n\n---\n\n## 第 1 步 先想明白：为什么不能把整份文档一把抓？\n\n直觉上你会想\"直接让大模型读整本文档不就行了\"。**不行，原因有二**：\n\n1. **装不下**：文档可能比模型一次能\"记住\"的上下文还长，塞不下。\n2. **不对题**：就算塞得下，你要回答的往往是**其中一小段**——把整本都喂进去，有用的被淹没在噪声里，反而答不准。\n\n> 🍳 所以我们要\"切菜\"：把大块的资料，切成**一小块一小块**。后面检索时只需挑出\"最像的那几块\"端给大模型。\n> 关键正是**切得\"刚刚好\"**——这决定后面查得准不准。\n\n## 第 2 步 把资料读进 Python\n\n文件各自用不同的库打开（它们都是\"打开对应格式的工具箱\"，装好 `import` 即可用）：\n\n```python\n# PDF（最常见）\nimport pdfplumber\nwith pdfplumber.open(\"手册.pdf\") as pdf:\n    text = \"\\n\".join(p.extract_text() for p in pdf.pages)\n\n# Word 文档\nfrom docx import Document\ndoc = Document(\"说明.docx\")\ntext = \"\\n\".join(p.text for p in doc.paragraphs)\n\n# 纯文本 / Markdown\ntext = open(\"笔记.md\", encoding=\"utf-8\").read()\n```\n\n【本质一行】**不同类型的文件=不同格式的\"壳\"，只是打开方式不同；目的都一样：把里面的文字提取成最普通的文本 `text`。** 后面所有操作，都是对这个 `text` 动手。\n\n> 提示：库名/导入写法官方偶尔会变，装了报错就按官方文档对齐，思路不变。\n\n## 第 3 步 把 text 切成\"一块一块\"（分块）\n\n最简单的切法思路有两种，实际常结合用：\n\n**分层 A：先按\"自然段落\"切开** —— 一段段文字往往自带语义边界：\n\n```python\nparagraphs = [p.strip() for p in text.split(\"\\n\\n\") if p.strip()]\n```\n\n**分层 B：再按\"长度上限 + 有一点重叠\"切** —— 单段太长就再拆小，并在边界处**留一点重叠**避免把一句话拦腰截断：\n\n```python\ndef chunk_by_chars(text, size=400, overlap=80):\n    chunks = []\n    start = 0\n    while start < len(text):\n        chunks.append(text[start : start + size])\n        start += size - overlap      # 往后挪 size - overlap，保证和前一块重叠\n    return chunks\n```\n\n> 🍳 把这个想象成**切菜**：paragraphs 是\"按自然纹理(顺着叶脉)撕开\"，chunk_by_chars 是\"太长就补一刀\"。**重叠那 80 个字，就像\"接缝处多留一点\"，保证话不被人为腰斩。**\n\n**怎么判断\"切得好不好\"？** 一个偷懒但有效的自检：随机抽几块，**看每块读起来是不是意思完整的一段话**。如果一块经常才说半句话就被切断（比如\"退货流程如下：1、……\"被切成两半卡在中间），说明块大小太小或重叠不够，调大即可。\n\n> 💡 记两个经验值（不是死规矩）：中文块大概 **300–600 字**比较稳；**重叠 50–100 字**防止断句。等你后面学了\"优化\"，还会按效果回来调它。\n\n### 训练营增量：你上面这套，`companion/phase2/chunker.py` 已经做成更完整、可测的版本\n\n不让你直接 copy，但值得看它怎么把\"切分\"做成**可测、可选、可靠**——它提供 **三档策略 + overlap + 一组通过了的测试**：\n\n- **按段落**（`split_blocks`）：最稳的一层分段，按空行切、去空块。\n- **按固定字数 + 重叠**（`chunk_by_fixed_size`）：超长块按 `size` 切、相邻带 `overlap`，**关键词跨块不丢**——就是上面 `chunk_by_chars` 的正规版。\n- **按句子**（`chunk_by_sentence`）：对问答型资料更友好，**一句不拆**。\n- **`keyword_overlap(query, doc)`**：没向量模型也能用的朴素\"召回\"粗筛（**英文按词、中文按字**——按空白分词对中文是全失效的，这是真坑）。\n\n验证它：\n\n```shell\npython phase2\\test_chunker.py    # 6 项测试；含\"关键词跨块不丢\"\"句子不切断\"\"相关块分更高\"\n```\n\n> 🔬 训练营要求：**对照 `chunker.py` 理解每个函数为何这么写**，尤其看 `test_chunker.py` 用哪些用例\"钉死\"了正确行为——这才叫\"可靠\"，不是\"碰巧能跑\"。PDF 这类**容易出错的文档解析**，坑见下方\"常见坑\"。\n\n---\n\n## 这一步的产出：把你的资料变成\"一摞能查的切片\"\n\n做一次就够：遍历整个资料文件夹，把每份文档读进来 → 用 `chunker.py` 切成块 → 随机抽几块打印，看切得整不整 → 调到你\"读着都顺\"。块先暂存在一个列表里（下一站把它变成数字）。\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n> 三类分开打勾：**🧠 理解**（能讲清）｜**🔧 实践**（能跑通）｜**📌 证据**（有产物）。\n> ⚠️ **证据类才是硬指标** —— 理解可以自我欺骗，实践跑一下就知道，证据骗不了人。\n\n**🧠 理解（能用自己的话讲出来）**\n- [ ] 用 `pdfplumber`/`docx` 成功把至少一份真实资料提取成 `text`（PDF 乱码也别灰心，见常见坑）\n- [ ] 用 `chunker.py` 的 `chunk()` 对你的资料切块，随机抽 3 块读出来，**都是意思完整的话**\n- [ ] 能讲清：三种切分策略各适合什么？`overlap` 去掉会怎样？\n- [ ] 能讲清为什么\"按空白分词对中文失效\"，中文该怎么处理\n\n**🔧 实践（能跑通才算）**\n- [ ] 跑 `python phase2\\test_chunker.py`，输出 `OK`（6 项）\n\n**📌 证据（这几条必须真拿出东西，不许打勾了事）**\n- [ ] **贴出你切块的结果**：切出几块、每块开头是什么（证明分块真的跑过）\n- [ ] 给本步交付物 `git commit` 了一句\n\n> 记忆一句话：**\"切得刚刚好\"不是玄学 = 不同策略 + 重叠 + 一眼自检\"每块是完整的话\"。**\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| PDF 提取出中文乱码/空页 | PDF 是图片扫描件或编码怪 | 换 `pdfplumber` 提文本；扫描件要靠 OCR（临时先跳过） |\n| 检索到一半块、答案被切断 | 块太小 / overlap=0 | 调大 `size` 到 300–600、`overlap` 50–100 |\n| 召回评估全 0、无区分度 | 对中文按空白分词=分成了一个整词 | 中文按字/用 jieba 分词（companion 已示范） |\n| Word 表格丢了 | `docx` 只取 `.paragraphs` | 要取表格用 `doc.tables` 二次遍历 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/phase2/chunker.py`，扫一眼三个切分函数——看得懂=复位成功。\n2. 跑 `python phase2\\test_chunker.py` → `OK` 则环境/代码没坏。\n3. 看\"验收清单\"，没勾的补上；勾满就进下一步。\n> 记忆锚：**本步 = \"文档解析 + 多策略分块 + 能自检切得好不好\"，切分决策直接影响检索准不准。**\n\n## 下一步：光有文字块还不够——检索要认\"数字\"\n\n切好的块现在只是\"文字\"，而计算机判断\"两段文字像不像\"，靠的不是肉眼，而是**把它们都变成一组数字（向量）**，再比远近。下一站就讲这道\"变数字\"的工序。\n\n> 下一篇：阶段二 · `03_词向量与检索原理.md`"}, {"id": "sec13", "group": "阶段二 · RAG 知识库", "title": "词向量与检索原理", "basename": "03_词向量与检索原理.md", "markdown": "# 阶段二 · 第 3 步：文本嵌入与检索原理\n\n> 这一站解决什么：现在你把资料切成一摞\"文字块\"了，但**电脑没法用肉眼判断\"哪两句话意思接近\"**。检索要的就是\"找最像的几块\"。所以这一步的关键动作是：**把每个文字块和一个问题，都变成一组\"数字\"，让\"像不像\"变成\"数一数远不远\"。** 这组数字就叫**向量（Vector）**。\n>\n> 📌 **术语先对齐**（面试会问）：中文习惯叫\"词向量\"，但这一站干的是**把一整段文字（一个块、一个问题）**变成向量，严格名叫**文本嵌入（text embedding）**；\"词向量（word vector）\"特指把**单个词**变成向量。你从这一站开始，一律说\"**文本嵌入**\"更准确。\n> 判断基准：2026-09-20。这一步是 RAG 的\"灵魂\"，也最值得你挖底层——懂了它，后面 Chroma 就是个\"替你算远近\"的工具箱。\n> 📍 **项目坐标**：**v0.3 第二步**：让机器能判断「哪两块意思接近」——把文字块和问题都变成向量，再用距离比远近。\n> 交付物对应：`companion/phase2/search.py`（余弦、伪向量、召回评估——离线先能测）。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：两个**完全相同**的向量，余弦相似度是多少？两个**方向完全相反**的向量呢？（取值范围是 −1 到 1）\n2. 动手：用离线伪向量检索「番茄怎么炒」，它能匹配到「西红柿可以炒蛋」那句吗？为什么？\n3. 概念：为什么要把文字块变成向量来比较，而不是直接比文字？\n\n**站纲（跨 3 小步）**\n**为什么文字要变数字 → 这组数字怎么来（Embedding）怎么比远近 → 用代码请出一个向量**\n\n---\n\n## 第 1 步 为什么非得把文字变成\"数字\"？\n\n真相很朴素：**电脑要\"比较\"，只会比数字，不会比文字**。\"苹果 vs 香蕉\"它没法直接说\"像不像\"；但如果说\"苹果=[3,1] 香蕉=[3,5] 汽车=[20,-2]\"，一量距离就知道**苹果离香蕉近、离汽车远**。\n\n> 说精确一点：**向量就是这段文字在语义空间里的坐标（一串数字）**。\n> 文字长得不一样没关系——只要坐标**离得近**，检索就认为它们意思相近，会把它们一起取回来。\n\n## 第 2 步 这组数字怎么来、怎么比远近\n\n**① 数字怎么来（Embedding 词嵌入）**：你请一个\"翻译官\"（叫 **Embedding 模型**）做一次转换：\n\n```\n\"苹果是什么水果\"   →翻译→  [0.32, -0.18, 0.77, …]   （通常几百上千个数字）\n\"香蕉有什么营养\"   →翻译→  [0.35, -0.15, 0.81, …]   （看起来和上面很像）\n\"北京今天限行吗\"   →翻译→  [-0.6, 0.4, -0.2, …]     （明显不一样）\n```\n\n关键是这门\"翻译\"本领是**从海量语言里学出来的**——它把\"意思接近的词\"翻译成\"位置也互相靠近\"的数字。所以语义越像，数字也越像。**这就是检索的底气，不用背，记住结论即可。**\n\n**② 怎么比远近（余弦相似度，人话版）**：两个向量\"像不像\"，用一个叫**余弦相似度**的数衡量，它的取值是 **−1 到 1**：**越接近 1 越像**（两个向量方向几乎重合），**越接近 −1 越不像**（方向相反），**0 表示两者没什么关系**。做文本检索时你见到的多半是 0~1 之间的正数，但**完整范围是 −1~1，别以为 0 就是\"最不像\"**。你**完全不用手算**——这是检索工具帮你算的。你只需要懂这个思想：**\"像不像\" = \"这串数字有多近\"**。\n\n## 第 3 步 用代码请出一个\"向量\"（最小演示）\n\n跟上一步调大模型 API 是同一招：调一个 **Embedding API**，传入文字，返回一串数字。\n\n```python\nimport requests, os\nfrom dotenv import load_dotenv\nload_dotenv()\n\n# 每家模型的名字/地址会不同，以你所选平台的官方文档为准\nEMBED_URL = os.getenv(\"EMBED_URL\")            # 例如 OpenAI 的 /v1/embeddings\nEMBED_KEY = os.getenv(\"EMBED_KEY\")\n\ndef embed(text):\n    resp = requests.post(EMBED_URL,\n        headers={\"Authorization\": f\"Bearer {EMBED_KEY}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"text-embedding-3-small\",   # Embedding 模型名，按平台改\n              \"input\": text})\n    return resp.json()[\"data\"][0][\"embedding\"]     # 一串数字\n\nv = embed(\"苹果是什么水果\")\nprint(len(v))        # 数字的个数，比如 1536\nprint(v[:5])         # 一串浮点数：这个块在语义空间里的坐标\n```\n\n跑出来那一大串数字别慌——它**不用你读懂，只用来比远近**。\n\n> 换个注意点：Embedding 模型和你阶段一的\"对话模型\"是**两种不同的东西**。对话模型负责\"说话\"（生成文字），Embedding 只负责把文字变成向量。别搞混，也不用背，记住\"各有分工\"即可。\n\n### 训练营增量：先看懂\"比远近\"和\"召回评估\"，离线就能测（不用等 Key）\n\n真实检索要真 embedding + 向量库（要网络/Key）。但两件最值钱的事——\"**怎么比远近**\"和\"**怎么评估召回准不准**\"——不该等那些装好才学。`companion/phase2/search.py` 用**确定性伪向量**把它们落地并测试通过：\n\n```python\nfrom search import cosine_similarity, demo_embed, DummyRetriever, eval_recall\n\n# ① 余弦：像不像 = 这串数字有多近（同向量=1，正交≈0）\nprint(cosine_similarity(demo_embed(\"退货流程\"), demo_embed(\"退货流程\")))  # ~1.0\n\n# ② 一个能离线的\"小检索器\"：存文档 → 按余弦取 top-k\nr = DummyRetriever()\nr.add([\"鸡蛋和西红柿可以同炒\", \"北京今天限行尾号 3\", \"退货需先提交工单\"])\nprint(r.query(\"退货流程怎么走\", k=2))\n\n# ③ 召回评估：top-k 里相关块被召回了几个 → 这就是\"召回率\"的起点\nprint(eval_recall(r, \"退货\", relevant={2}, k=1))\n```\n\n> 🔬 embedding **选型**方向（不必现在定）：质量 vs 成本 vs 多语言。中文语料优先挑**中文表现好的开源/API 模型**；决定检索上限。别一上来追贵的——先用便宜的跑通，后面再按\"召回率\"决定要不要换。\n> 训练营要求：**把 `search.py` 和 `test_search.py` 读一遍**，尤其看 `eval_recall` 怎么算召回率。你上真 embedding 后，检索管线逻辑一行不改——这就是\"先把评估能力搭起来\"的价值。\n\n### 本地跑可选（想省钱练手）\n\n不想花钱调 API，也可以装开源本地模型（如 `sentence-transformers`），一行生成向量。后面\"完整闭环\"时我给你一个\"能用 API 也行、本地也行\"的写法，先知道有这条路即可。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n> 三类分开打勾：**🧠 理解**（能讲清）｜**🔧 实践**（能跑通）｜**📌 证据**（有产物）。\n> ⚠️ **证据类才是硬指标** —— 理解可以自我欺骗，实践跑一下就知道，证据骗不了人。\n\n**🧠 理解（能用自己的话讲出来）**\n- [ ] 用 `search.py` 的 `DummyRetriever` 存 5 条资料，问一个问题，眼睛看它 top-k 排得对不对\n- [ ] 能对朋友讲清：**什么是向量、什么把\"像不像\"变成\"远不远\"**、余弦≈1 是很像还是很不像\n- [ ] 能讲清 `eval_recall` 算什么、为什么要\"先能测\"再说优化\n- [ ] 能讲清 Embedding 模型和\"对话大模型\"不是一回事\n\n**🔧 实践（能跑通才算）**\n- [ ] 跑 `python phase2\\test_search.py` → `OK`（7 项：余弦/伪向量/排序/召回率）\n\n**📌 证据（这几条必须真拿出东西，不许打勾了事）**\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 余弦/检索结果\"都是 0 分没区分度\" | 对中文按空白分词 / 伪向量维度过低 | 用 `search.py` 对中文**按字**切 + 维度≥256 |\n| 想把 Embedding 模型当\"对话模型\"用 | 两种模型分工不同 | 对话=生成文字；Embedding=把文字变成向量 |\n| 一上来就追贵的 embedding | 先有优先 | 先用便宜跑通，按召回率再决定换不换 |\n| 只看\"好像更像了\"就说检索好 | 没量化 | 用 `eval_recall` 记一个数字 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 跑 `python phase2\\test_search.py` → `OK` 则代码没坏。\n2. 打开 `search.py` 看 `cosine_similarity` 和 `eval_recall`——看得懂=复位成功。\n3. 看\"验收清单\"补勾，勾满进下一步。\n> 记忆锚：**本步 = \"文本嵌入（向量）+ 余弦比远近 + 召回评估先能测\"。**\n\n## 下一步：向量有了，得放进一个专门的检索索引\n\n你手上现在有\"很多块 + 各自的向量\"。下一个问题很现实：**几千块呢，总不能每问一次都跟全库逐条算一遍距离吧？**\n答案是**向量数据库**——它用**近似最近邻（ANN）索引**，你给一个查询向量，它在毫秒级返回最像的前几条。下一站就装它。\n\n> 下一篇：阶段二 · `04_向量数据库Chroma实践.md`"}, {"id": "sec14", "group": "阶段二 · RAG 知识库", "title": "向量数据库Chroma实践", "basename": "04_向量数据库Chroma实践.md", "markdown": "# 阶段二 · 第 4 步：向量数据库 Chroma —— 建库、写入、查询\n\n> 这一站解决什么：你有了几百、几千块\"带向量的文字块\"。如果每次提问都**从头到尾跟全库逐条算距离**，慢且笨。\n> 向量数据库（我们用 **Chroma**）就是干这件事的：**给它一个查询向量，它用索引在毫秒级返回最像的前几条**。\n> 判断基准：2026-09-20。库名（Chroma 或它的竞品）会变、API 会迭代，但\"**存向量 → 查最近邻**\"的思想永不变。\n> 📍 **项目坐标**：**v0.3 收尾**：把向量存进真库，用一个查询向量换回最像的几块。做完这版，项目「手里有资料」了。\n> 交付物对应：`companion/phase2/search.py` 里的 `DummyRetriever`（先用它把\"存→查\"逻辑离线测通，真 Chroma 等你接上真 embedding 时一换即可）。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：`collection.add(ids=[...], documents=[...])` **不传 embeddings**，它会怎么处理？（提示：它会自己算）\n2. 动手：查询时只给一个 `query_embeddings`，库内部凭什么不用把上万个向量逐个比一遍？\n3. 概念：线性扫描和 ANN 索引的取舍是什么？\n\n**站纲（跨 3 小步）**\n**为什么需要索引 → 认识三个动作(建/存/查) → 先用离线替身跑通\"放进去再查出来\"**\n\n---\n\n## 第 1 步 为什么不能只用 Python 列表硬搜？\n\n理论上你把\"向量 + 原文\"塞进一个 Python 列表、每次遍历算一遍距离也能得到结果——但那是**线性扫描（逐条比对）**：几千条还行，上万条就慢到没法用。\n\n向量数据库的过人之处，是内部建了**近似最近邻（ANN）索引**（常见实现如 HNSW）：**不用逐条比**，就能在毫秒级告诉你\"和这个查询向量最像的前 k 条在哪\"。\n\n> 说得具体点：线性扫描的耗时随数据量**线性增长**（1 万条就是 1 万次距离计算）；\n> ANN 索引把耗时压到**近似常数**。代价是结果**不保证全局最优**，但通常在可接受范围内。\n> 这个\"拿一点精度换巨大速度\"的取舍，就是向量数据库存在的理由。\n\n## 第 2 步 Chroma 的三板斧：建库 → 塞入 → 查询\n\n```python\nimport chromadb\n\nclient = chromadb.PersistentClient(path=\"./kb\")      # 1) 建库：指定本地目录做持久化\ncollection = client.get_or_create_collection(\"docs\")  #    在里面开一个\"集合\"（相当于一张表）\n\n# 2) 塞入：每条 = id + 原文字块 + 它的向量\nchunks = [\"鸡蛋和西红柿可以同炒\", \"北京今天限行尾号 3\", \"退货需先提交工单\"]\nvecs   = [embed(c) for c in chunks]                 # embed 见上一站\n\ncollection.add(\n    ids=[f\"c{i}\" for i in range(len(chunks))],\n    documents=chunks,        # 存原文（供取回后用）\n    embeddings=vecs,         # 存向量（供检索用）\n)\n\n# 3) 查询：给一个查询向量，取回最像的 2 条\nres = collection.query(query_embeddings=[embed(\"西红柿和什么炒好吃\")], n_results=2)\nprint(res[\"documents\"][0])   # 最像的原文\n```\n\n> 💡 记住这个接口约定：**写入时 `embeddings`（向量）和 `documents`（原文）一起给；查询时只给 `query_embeddings`（查询向量），它回你 `documents`（最像的原文）。** 存两层、查一层，原文取回来当证据给用户看。\n\n（Chroma 的调用写法会随版本变化，装好后以 `pip show chromadb` 对应版本文档为准，核心三动作不变。）\n\n### 训练营增量：先别急着装 Chroma——用离线替身把这三板斧看懂、测通\n\n真 Chroma + 真 embedding 要装包、要网络/Key，上手有摩擦。但\"**建库→塞→查**\"这套动作，上一站的 `DummyRetriever` 已经能离线替你演示一遍，且逻辑与将来接真 Chroma **一模一样**：\n\n```python\nfrom search import DummyRetriever\n\n# 建库+塞入：add 一段段原文（内部自动向量化）\nkb = DummyRetriever()\nkb.add([\"鸡蛋和西红柿可以同炒\", \"北京今天限行尾号 3\", \"退货需先提交工单\"])\n\n# 查询：给一个问题，回最像的前 2 条（含相似度，score=True）\nfor idx, doc, score in kb.query(\"西红柿怎么炒\", k=2, score=True):\n    print(idx, round(score, 3), doc)\n```\n\n> 🔬 呼应上一篇的验收：真 Chroma 只是\"换了更快的库 + 更真的向量\"，**查询管线这段代码你一行都不用改**。这里先把\"存两层、查一层、取回原文当证据\"的概念钉死——这才是 04 的真正目的，库是工具，思想不变。\n> 训练营要求：真 Chroma 你已经读过上面的代码了。把 `search.py` 的 `DummyRetriever.add/query` 读一遍，跑通上面这段\"放进去再查出来\"，再决定要不要现在装 chromadb（可以等第 5 步闭环演示一起装）。\n\n## 第 3 步 亲自验证\"它真的能语义找\"（真环境下的爽点）\n\n最爽的验证不是找一模一样的，而是**找长得像但词语不同的**：\n\n```\n存入: \"鸡蛋和西红柿可以同炒\"\n查询: \"番茄跟蛋一起煮可以吗\"\n结果: 返回了上面那句 ✓\n```\n\n> 为什么✓？（真 embedding 下）因为 Embedding 把\"西红柿/番茄\"\"同炒/一起煮\"这些**意思相近的词翻译到了相近的位置**——这正是 RAG 比\"搜关键词\"厉害的地方：它按**意思**找，不只是按**字**找。\n> ⚠️ 注意：离线 `DummyRetriever` 的伪向量**没有语义**，\"番茄≈西红柿\"它认不出来（它只是按字重合）。所以\"按意思找\"这条要等你接真 embedding 后在 Chroma 里验证——两者进度不同，别用伪向量去验证\"语义\"，那是真刀的活。\n\n---\n\n## 这一步的产出：一个\"能按意思找人\"的本地资料库\n\n把上一站切的块全部 `add` 进 Chroma（一次性；或先用 `DummyRetriever` 离线跑同款动作）。之后你问任何问题，它都能秒回\"最像的几块原文\"。**这时你再回头看你画的 RAG 地图——\"存进并查询 Chroma\"这两步，你完成了（离线版）或即将完成（真环境版）。**\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n> 三类分开打勾：**🧠 理解**（能讲清）｜**🔧 实践**（能跑通）｜**📌 证据**（有产物）。\n> ⚠️ **证据类才是硬指标** —— 理解可以自我欺骗，实践跑一下就知道，证据骗不了人。\n\n**🧠 理解（能用自己的话讲出来）**\n- [ ] 读得懂 Chroma 三板斧代码：`add` 时存了哪两层？`query` 时只给什么、回你什么？\n- [ ] 能讲清：为什么\"按意思找\"该在真 embedding 下验证，而不是在 `DummyRetriever` 里\n\n**🔧 实践（能跑通才算）**\n- [ ] 用 `search.py` 的 `DummyRetriever`，把 5 条资料\"建库→塞入→查询\"，能按相关度排回最像的前几条\n- [ ] 能对朋友讲清：向量数据库和\"Python 列表线性搜\"的本质差别（为什么快，不用报算法名）\n- [ ] 跑 `python phase2\\test_search.py`，输出 `OK`（核心检索能力离线受保护）\n\n**📌 证据（这几条必须真拿出东西，不许打勾了事）**\n- [ ] **贴出一次真实检索的输出**：问题 + 返回的前 3 块（带距离或相似度）\n- [ ] 给本步交付物 `git commit` 了一句\n\n> 记忆一句话：**\"写入存两层（向量 + 原文）、查询只给一层（查询向量）、返回最像的几块原文当证据\"——向量库里就这三件事，库名随便换。**\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 想用伪向量验证\"番茄≈西红柿\"的语义 | `DummyRetriever` 无语义，只按字重合 | 语义验证放到真 embedding + Chroma；伪向量只测\"管线/CB\" |\n| 版本变了代码报错 | Chroma API 迭代快 | 以 `pip show chromadb` 对应版本为准，三动作思想不变 |\n| 一上来就装一堆向量库 | 工具先行、思想没通 | 先用 `DummyRetriever` 离线跑通\"存→查\"；需要真语义再装 |\n| 库建在临时路径，重启就没了 | 忘了用 `PersistentClient(path=...)` | 加一个持久化路径参数，别用纯内存 `EphemeralClient` 存长期资料 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/phase2/search.py`，扫一眼 `DummyRetriever.add/query`——看得懂=复位成功。\n2. 跑 `python phase2\\test_search.py` → `OK` 则环境/代码没坏。\n3. 看\"验收清单\"，没勾的补上；勾满就进下一步。\n> 记忆锚：**本步 = \"建库→塞入→查询\"，思想是\"存两层、查一层、取回原文当证据\"；库里没有\"语义\"，语义在 embedding 里。**\n\n## 下一步：把前面所有零件串成一根完整的线\n\n现在你零件都到齐了：**切块 ✓ 向量 ✓ 存/查 ✓**。下一站把它们 + 阶段一\"请大模型\"，拼成一个完整的 `ask()`——问你一个问题，它自动\"检索 → 拼资料 → 请大模型 → 带出处地回答\"。那就是阶段二的交付物。\n\n> 下一篇：阶段二 · `05_完整RAG闭环.md`"}, {"id": "sec15", "group": "阶段二 · RAG 知识库", "title": "完整RAG闭环", "basename": "05_完整RAG闭环.md", "markdown": "# 阶段二 · 第 5 步：把零件串成一根线——完整 RAG 闭环（阶段二交付物）\n\n> 这一站解决什么：前四站你把\"切块、向量、存/查、请大模型\"各自备好，但还**没连成一根线**。这一站把它们拼成一个完整的 `ask(query)`——你问一句，它自动\"检索 → 拼资料 → 请大模型 → 带出处地回答\"。**这一步跑通，你的\"读我资料才回答的助手\"就诞生了。**\n> 判断基准：2026-09-20。这就是**贯穿作品的第一个里程碑**（企业客服知识库的开端）。\n> 📍 **项目坐标**：**v0.4**：把前面三个零件串成一根线——检索 → 拼进提示词 → 生成。**这是第一个里程碑**：它开始「读你的资料才回答」。\n> 交付物对应：`companion/phase2/ragbot.py`（三段式闭环，离线可测）＋ 真环境版 `ask()`（下文代码）。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：`ask()` 里**跳过「拼 prompt」那一步**，直接把问题丢给模型，结果会差在哪？（提示：模型看不到资料）\n2. 动手：知识库是空的，`ask()` 应该返回什么？如果它编了一个答案，问题出在哪一环？\n3. 概念：检索「取回原文」是为了什么？取回不塞进 prompt 行不行？\n\n**站纲（跨 3 小步）**\n**把 RAG 地图翻译成一个 `ask()` → 用一个可跑、可测的离线闭环钉住它 → 顺手把作品推上 GitHub（你的名片）**\n\n---\n\n## 第 1 步 把地图翻译成一件事：一个 `ask()` 函数\n\n还记得 RAG 地图吗？在线回答只有 4 步：**编码问题 → 取最像的几块 → 把\"资料+问题\"拼起来 → 请大模型看着资料答**。恰好每步你都学过了。我们把它写成一个函数 `ask(query)`：\n\n```python\ndef ask(query):\n    # ① 把问题变成查询向量\n    q_vec = embed(query)\n\n    # ② 去 Chroma 取最像的前 3 块原文\n    hits = collection.query(query_embeddings=[q_vec], n_results=3)\n    context = \"\\n\\n\".join(hits[\"documents\"][0])\n\n    # ③ 把\"资料 + 问题\"拼成一段话（第③步就是\"增强\"，RAG 唯一的魔法）\n    prompt = f\"只用下面资料回答；资料里没有就说不知道；附出处编号。\\n\\n资料：\\n{context}\\n\\n问题：{query}\"\n\n    # ④ 让大模型依据资料回答（阶段一学的 API 调用）\n    return chat(prompt)   # chat() 就是你阶段一写的那个调用函数\n```\n\n> 【本质一行】**RAG 的\"增强\"就发生在第 ③ 步**——你只是把检索到的原文**拼到了问题前面**，让大模型\"看着证据说话\"。就这么简单，不要想象得太玄。③ 这一行的质量，决定了你的助手是\"背书的复读机\"还是\"真的在看资料\"。\n\n## 第 2 步 先跑通一个\"能测\"的版本：`ragbot.py`（真环境版见下）\n\n真闭环要 chromadb + 真 embedding + 网络/Key，上手有摩擦。但闭环的**骨架（切块→检索→增强→生成）**是无辜的——不该等 Key 装好才验。`companion/phase2/ragbot.py` 用 `chunker`+`DummyRetriever`+一个**可插拔的 llm**，把整个闭环离线跑通：\n\n```python\nfrom ragbot import RagBot\n\nbot = RagBot(top_k=3)\nn = bot.index_texts([\"你的几段资料原文…\"])   # 内部：切块 → 入库\nprint(n, \"块\")\n\n# 离线模式（没给 llm）：只展示\"检索到啥、将拼给大模型的 prompt\"，不臆造答案\nprint(bot.ask(\"退货流程是什么？\"))\n\n# 真闭环模式：把阶段一的 chat() 塞进去，它就真\"看着资料\"答了\nbot.ask(\"退货流程是什么？\", llm=my_chat)      # my_chat = 你阶段一写的 chat()\n```\n\n> 🔬 为什么值钱：**上生产只需换 3 处**（检索器→Chroma、向量→真 embedding、llm→你的 chat()），骨架一行不改——这被写进了 `ragbot.py` 的 `PRODUCTION_SWAP` 注释，也被测试钉死了。这就是\"把可靠性先测通\"：离线版能测，真环境只是换真零件。\n> 训练营要求：**读一遍 `ragbot.py` 的 `build_prompt`**，它是\"增强唯一发生处\"。再看 `test_ragbot.py` 里怎么断言\"命中的原文真的拼进了 prompt\"——这是它不像\"背书的复读机\"的证据。跑：\n>\n> ```shell\n> python phase2\\test_ragbot.py    # 4 项：检索/增强/空库优雅降级/可插拔 llm\n> ```\n\n### 真环境版（把四站零件填进去，能直接跑）\n\n```python\nimport requests, os\nfrom dotenv import load_dotenv\nimport chromadb\nload_dotenv()\n\n# ---- 零件 1：Embedding ——（见第 3、4 步）\ndef embed(text):\n    resp = requests.post(os.getenv(\"EMBED_URL\"),\n        headers={\"Authorization\": f\"Bearer {os.getenv('EMBED_KEY')}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"text-embedding-3-small\", \"input\": text})\n    return resp.json()[\"data\"][0][\"embedding\"]\n\n# ---- 零件 2：对话大模型 ——（见阶段一）\ndef chat(prompt):\n    resp = requests.post(\"https://api.deepseek.com/chat/completions\",\n        headers={\"Authorization\": f\"Bearer {os.getenv('DEEPSEEK_API_KEY')}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"deepseek-chat\", \"messages\": [\n            {\"role\": \"system\", \"content\": \"你是资料问答助手\"},\n            {\"role\": \"user\", \"content\": prompt}]})\n    return resp.json()[\"choices\"][0][\"message\"][\"content\"]\n\n# ---- 零件 3：向量库 ——（见第 4 步）\nclient = chromadb.PersistentClient(path=\"./kb\")\ncollection = client.get_or_create_collection(\"docs\")\n\n# ---- 组装：ask()\ndef ask(query):\n    hits = collection.query(query_embeddings=[embed(query)], n_results=3)\n    context = \"\\n\\n\".join(hits[\"documents\"][0])\n    prompt = (f\"只用下面资料回答；资料没有就说不知道，别编。\\n\\n\"\n              f\"资料：\\n{context}\\n\\n问题：{query}\")\n    return chat(prompt)\n\n# ---- 用起来\nprint(ask(\"公司的退货流程是什么？\"))\n```\n\n> 也许换个问法它仍能答（因为大模型训练时可能真见过类似资料）——要**验证它\"真的在读你的资料\"**，用一个最狠的问法：\n> > \"请只引用我们手册第 X 页的原话，回答……\" —— 它得讲得出你的**专有细节**才算真在翻你的资料。\n\n## 第 3 步 顺手把作品推上 GitHub（你是自学者，这是你的名片）\n\n> 阶段一结尾预告过\"用到 Git 时顺带讲\"，现在正好。Git 就三件事，边做边记：\n\n```shell\ngit init                        # 1) 在这个文件夹里开一个\"版本仓\"\ngit add .                        # 2) 把当前所有改动装进\"待提交区\"\ngit commit -m \"完成RAG问答助手\"   # 3) 拍一张快照存下来\n```\n\n然后去 GitHub 建一个空仓库，把本地的推上去：\n```shell\ngit remote add origin 你的仓库地址\ngit push -u origin main\n```\n> ⚠️ 别忘了 `.env` 不该上传——把 `.env` 加进一个叫 `.gitignore` 的文件（内容就一行 `.env`），它就会被 Git 自动忽略，Key 不会泄露。\n\n**为什么现在就必须推**：你是自学者、谈资少，GitHub 上\"一个能 clone 下来直接跑、跑不了还有 CI 报错、带 README 讲原理\"的仓库，就是你求职时最硬的名片。从现在起，**每完成一小步就 push 一次**，比什么都值。而且这正是贯穿全营的**\"演进契约\"**——仓库里有更新日志，你的成长是看得见的脚印。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n> 三类分开打勾：**🧠 理解**（能讲清）｜**🔧 实践**（能跑通）｜**📌 证据**（有产物）。\n> ⚠️ **证据类才是硬指标** —— 理解可以自我欺骗，实践跑一下就知道，证据骗不了人。\n\n**🧠 理解（能用自己的话讲出来）**\n- [ ] 读一遍 `ragbot.py` 的 `build_prompt`，能指出\"增强唯一发生处\"是哪一行，为什么\n- [ ] 能讲清 `PRODUCTION_SWAP`：上生产只需换哪 3 处，骨架为什么不用改\n- [ ] 用一个\"引手册原话\"的狠问法，验证它真在读你的资料，而非背诵\n- [ ] 能给朋友完整讲一遍 `ask()` 四步：把问题转成向量 → 检索取回证据 → 把证据拼进提示词 → 交给大模型生成\n\n**🔧 实践（能跑通才算）**\n- [ ] 跑 `python phase2\\test_ragbot.py`，输出 `OK`（4 项：离线闭环受保护）\n- [ ] （真环境版，可选）接上 Key + Chroma，跑通 `ask(\"你的资料问题\")` 并拿到\"带出处\"的回答\n\n**📌 证据（这几条必须真拿出东西，不许打勾了事）**\n- [ ] **贴出一个带出处的回答**（回答里能看到 sources / 出处编号）\n- [ ] **贴出一次「答不了」的输出**——问一个知识库里没有的，看它有没有明说查不到\n- [ ] 建了 `.gitignore` 并确认 `.env` 没被 push；`git push` 推上 GitHub\n- [ ] 在手册 `00_总览` 的贯穿作品记录里，勾掉\"里程碑一：读我资料才回答的客服助手\"\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| Key 被 push 上 GitHub | 没建 `.gitignore` | 建 `.gitignore` 写 `.env`；已泄露就立刻去平台吊销换新 |\n| 真 Chroma 装不好/报错 | API 版本迭代、依赖冲突 | 先用 `ragbot.py` 离线跑通闭环；真库放进独立 venv，以官方文档为准 |\n| \"增强\"写错位置 | 把原文拼错地方/没拼 | 记住第③步 `context` 必须塞进 prompt；用 `test_prompt_really_contains_evidence` 兜底 |\n| 空库或没命中还硬编答案 | 没做原则校验 | `ragbot.py` 里空库直接\"说不知道\"，绝不臆造——这是防幻觉的底 |\n| 改了检索逻辑要连坐改 prompt | 三段耦合太紧 | 骨架三段（检索/增强/生成）分开写，改一处不连累另两处 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/phase2/ragbot.py`，扫一眼 `ask()` 四步——看得懂=复位成功。\n2. 跑 `python phase2\\test_ragbot.py` → `OK` 则闭环没坏。\n3. 看\"验收清单\"，没勾的补上；`git push` 后再进下一步。\n> 记忆锚：**本步 = \"检索→拼资料→请大模型→带出处答\"，增强唯一发生在'把检索原文拼进 prompt'那一行；作品已上 GitHub。**\n\n## 下一步：它\"会了\"，但不一定\"准\"——还能更好\n\n现在的助手能跑、能带出处，但如果答得弱（检索到废话、或不肯老实照着资料说），别急——下一站就是\"它答得不对时怎么优化\"，以及为阶段四的\"效果评测\"埋线。\n\n> 下一篇：阶段二 · `06_RAG效果优化.md`"}, {"id": "sec16", "group": "阶段二 · RAG 知识库", "title": "RAG效果优化", "basename": "06_RAG效果优化.md", "markdown": "# 阶段二 · 第 6 步：它\"会了\"但\"准吗\"——RAG 效果优化\n\n> 这一站解决什么：你的助手能跑了。但当它**答得不对**时，你要知道该调哪里——而不是盲改代码。这一站给你一套\"先说结论再动手\"的诊断思路：**答得不对，多半是\"没找到对的资料\"或\"没照着资料说\"，分清楚再对症下药。**\n> 判断基准：2026-09-20。优化没有银弹，靠的是\"定位环节 + 从便宜到贵逐级试 + 每次改都记效果\"。\n> 📍 **项目坐标**：**v0.5**：v0.4 能答了，但答得准不准你没数。这一版给检索加上关键词那一路、再加重排，并**用召回率数字证明它真的变好了**。\n> 交付物对应：这一站**没有新代码**，因为它给的是\"怎么判断要改哪、按什么顺序改\"的方法论；已有的 `search.py`（召回评估）正是你量化\"变好了没\"的尺子。\n\n**前置自测（2 道动手题 + 1 道概念题；答不上就先回上一篇）**\n1. 动手：把分块的 `size` 从 500 调到 100，你猜召回率会升还是降？为什么？（拿 `eval_recall` 实测验证你的猜想）\n2. 动手：只靠向量检索，为什么很容易漏掉 `SKU-998` 这种型号问法？\n3. 概念：想证明「检索变好了」，靠感觉行吗？靠什么？\n\n**站纲（跨 3 小步）**\n**先诊断\"问题在检索还是生成\" → 常见四种优化（从便宜到贵） → 养成\"改一次记一次\"的习惯（为阶段四铺路）**\n\n---\n\n## 第 1 步 先诊断：答不对，问题出在\"检索\"还是\"生成\"？\n\nRAG 只有两大环节。答得不好，一定是其一，先分清再修：\n\n- **检索没找到对的** → 症状：它答非所问、或回答里带的\"出处\"根本不对题。**病根在\"没翻到你要的那页\"。**\n- **找到但没照着说** → 症状：检索到的原文明明有答案，它却自己发挥、甚至编。**病根在\"提示词没约束住\"。**\n\n> 💡 一个零成本诊断法：**直接把检索到的原文 `print` 出来看一眼**——如果\"最像的几块\"压根不相关，别去调大模型，问题在检索；如果原文很相关它却瞎说，问题在生成。**先看了症，才敢下药。**\n\n## 第 2 步 四种最实用的优化（对症下药，从便宜到贵）\n\n### ① 最便宜：在提示词里把话说死 → 治\"生成侧跑偏/瞎编\"\n\n在拼给大模型的 prompt 里明确两条：**\"只根据上面资料回答\"；\"资料里没有，就直说不知道，不要编。\"**\n这一条不花任何算力，往往是\"生成侧\"最有效的开关。**先试它**——05 的 `ragbot.py` 已经把这个约束写死在 `build_prompt` 里了，你加的每次 `ask` 都自带这条防线。\n\n### ② 次便宜：回分块调大小/重叠 → 治\"检索源头就切坏了\"\n\n检索质量很多时候早早在\"切块\"就定了：块太大，一块里塞了太多信息答不干净；块太碎，上下文散回到第 2 步调一调（`chunker.py` 的 `size`/`overlap`），用 `eval_recall` 看召回变化。**这是\"花最少的钱，往往收益最大\"的一档**，因为病灶在源头。\n\n### ③ 检索侧升级：混合检索（BM25 + 向量，再 Re-rank）\n\n纯粹\"按意思找\"(向量) 有时反而忽略\"关键词\"很强的信号（如产品型号 `SKU-998`）。思路：**\"按意思找\"和\"按关键词找\"两条腿走路**。注意这里是**两步、两件事**，别混成一步（面试很爱问这个）：\n\n1. **融合（fusion）**：把两路召回的结果**合并成一个列表**。最常用的是 **RRF（倒数排名融合）**——不看分数只看排名，按 `1/(k+排名)` 累加，简单而且几乎不用调参。\n2. **重排（rerank）**：拿融合后的候选，交给一个**专门的重排模型**（交叉编码器，如 BGE-reranker）逐条**重新打分精排**。它只管\"排得更准\"，**不负责合并两路结果**。\n\n底层逻辑不用记公式，记结论：**混合召回（关键词+向量）→ 融合（RRF）→ 重排，通常比单向量更稳。** 上这个之前，先用 `eval_recall` 拿到单向量召回率的数字当\"底数\"，改完再比——没有底数，上再贵的方案也是玄学。\n\n### ④ 更麻烦：把问题改写得更\"好检索\"（query 改写/扩展）\n\n原始问法有时太口语或太歧义。让一个小模型**先把你问的话改写成\"更利于检索的句子\"** 再去查。例：你问\"那个东西咋弄？\"→ 改写\"**如何申请退货并提交工单**\"→ 再查，命中率高很多。\n\n> 一个顺序建议：**先生成侧的\"提示词说死\"(①) → 再检索侧的源头\"分块\"(②) → 再\"混合检索\"(③) → 视情况 query 改写(④)。** 从便宜到贵、从快到稳，**别一上来就上复杂方案，也别一次改好几个变量**——否则你永远分不清是谁起的作用。\n\n## 第 3 步 养成\"改一次记一次\"的习惯（为阶段四埋线）\n\n别靠感觉\"好像变好了\"。**每次改之前，先跑一遍\"固定的 10 个问题\"，记下答案；改完再跑同一批，对比有没有改善。** 固定问题集+前后对比，就是阶段四要做的\"评测集\"的雏形——现在就开始攒，后面你写简历那句\"把准确率从 60% 提到 85%\"时，靠的就是这几行记录。\n\n> 🔬 你现在手里的量化工具：`search.py` 的 `eval_recall` 能算出\"检索召回多少\"。**Recall（召回率）是检索侧的尺子**；它现在（伪向量/离线）就能跑，等你接真 embedding 后继续用。这就是\"先把评估能力搭起来\"的价值——优化之前，先有尺子。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n> 三类分开打勾：**🧠 理解**（能讲清）｜**🔧 实践**（能跑通）｜**📌 证据**（有产物）。\n> ⚠️ **证据类才是硬指标** —— 理解可以自我欺骗，实践跑一下就知道，证据骗不了人。\n\n**🧠 理解（能用自己的话讲出来）**\n- [ ] 说出四档优化按\"从便宜到贵\"的正确顺序，以及为什么\"别一次改好几个变量\"\n- [ ] 指出\"提示词说死\"这一档在 `ragbot.py` 的哪里已经写死，你随手加的 `ask` 自带防线\n- [ ] 用 `eval_recall` 在改\"分块 size/overlap\"前后各测一次，记下两个数字（先有底数再改）\n- [ ] \"混合检索补上了哪一路信号、为什么重排有用\"能用一句话讲给朋友\n- [ ] 建了一张\"固定 10 问\"的清单（哪怕就写在 `.md` 里），为阶段四的评测集起了个头\n\n**🔧 实践（能跑通才算）**\n- [ ] 能用\"零成本诊断法\"说清\"答非所问\"和\"答案跑偏\"分别该查哪一侧（检索 or 生成）\n\n**📌 证据（这几条必须真拿出东西，不许打勾了事）**\n- [ ] **贴出「改前 / 改后」两个召回率数字**（`eval_recall` 的输出），并写清你改了什么\n- [ ] 给本步的记录 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 一次改好几个变量，不知道谁有用 | 没做对照 | 一次只改一个，改前先用 `eval_recall` 记底数 |\n| 问题在检索，却去调大模型 | 没诊断就下药 | 先 `print` 检索命中，判明环节再动手 |\n| 一上来就上重排/query 改写 | 追求复杂 | 按\"便宜→贵\"顺序；先试提示词说死 + 分块 |\n| 靠\"好像变好了\" | 没量化 | 用 `eval_recall`（检索侧尺子）+ 固定问题集（生成侧尺子）记数字 |\n| 分块越切越碎 | 以为\"碎=细=准\" | 块太小反而上下文散；用 `eval_recall` 验证，不是想当然 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 记记忆锚下面这句话，能复述\"答不对分两侧、按便宜到贵调\"就算复位。\n2. 跑 `python phase2\\test_search.py` + `test_ragbot.py` → `OK` 则代码没坏。\n3. 看\"验收清单\"，没勾的补上；尤其把\"固定 10 问\"建起来再说下一步。\n> 记忆锚：**本步 = \"先诊断（检索/生成）→ 从便宜到贵逐级试（提示词说死→分块→混合检索→query改写）→ 改一次记一次（为了评测）\"。优化没有银弹，靠尺子和对照。**\n\n---\n\n## 下一步：阶段二收官，进入\"会自己干活\"的 Agent\n\n你现在有了一个\"能翻资料、还知道出处\"的助手。但它是**被动的**——你问一句它答一句，它不会自己决定\"要不要去查、去搜\"。\n\n阶段三要让它**长出手**：从\"问答器\"升级成\"会自己决定怎么干活的智能体\"。\n\n> 进入阶段三 · `04_阶段三_Agent`。\n\n---\n\n> 附：阶段二知识点速览（回来随手复盘用，不是要背）\n> 资料→[分块]→切片→[Embedding]→带指纹的向量→[Chroma]→能秒查\n> 提问→编码成指纹→Chroma 召回最像几块→[拼进 prompt]→大模型\"看着资料\"答"}, {"id": "sec17", "group": "阶段二 · RAG 知识库", "title": "真环境关卡", "basename": "07_真环境关卡.md", "markdown": "# 阶段二 · 真环境关卡：把\"按字重合\"换成\"按意思找\"\n\n> **这是一道关卡，不是一课。过不了，不要翻阶段三。**  \n> 为什么设它：`companion/phase2` 里跑的一切，靠的都是 `DummyRetriever` 的**伪向量**——  \n> 它只是对文字做哈希，**完全没有语义**。所以\"番茄 ≈ 西红柿\"这种事，它一辈子都做不到。  \n> 这一关要求你装上真的 chromadb、真的嵌入，**亲手验证一次\"按意思找\"**。\n> 📍 **项目坐标**：**关卡②**：不推进版本，但它决定 v0.3 **算不算数**——你用的是真嵌入，还是只按字重合的伪向量。\n\n---\n\n## 第 1 关 把真库装上\n\n```bash\npython -m venv .venv && .venv\\Scripts\\activate    # 建议单独建环境\npip install chromadb\npython -c \"import chromadb; print('chromadb', chromadb.__version__)\"\n```\n\n> ⚠️ 如果版本是 1.x，先看一遍官方文档的\"从 0.5 迁移\"说明——**chromadb 1.0 有过破坏性变更**，  \n> 网上老教程很多还是 0.4/0.5 的写法。**以你装到的版本的文档为准**（这也是阶段二 04 那篇提醒过的）。\n>\n> ✅ 本关卡的代码已在 **chromadb 1.5.9（2026-09 实测）** 上跑通：  \n> `PersistentClient(path=...)`、`collection.add(ids, documents)`、`collection.query(query_texts, n_results)` 全部可用，  \n> `query` 返回 **dict**，所以 `res[\"documents\"][0]` 这么取是对的。\n\n## 第 2 关 让\"意思相近\"真的能匹配上\n\n把下面这段**逐行敲进去**（别 copy，敲的过程中你会注意到每一行的作用）：\n\n```python\nimport chromadb\n\nclient = chromadb.PersistentClient(path=\"./kb\")\ncol = client.get_or_create_collection(\"demo\")\n\ndocs = [\n    \"鸡蛋和西红柿可以同炒\",     # 用\"西红柿\"\n    \"北京今天限行尾号 3\",\n    \"退货需先提交工单，7 个工作日审核\",\n]\ncol.add(ids=[\"d0\", \"d1\", \"d2\"], documents=docs)   # 不传向量 → 用默认 embedding
