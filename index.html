<script>
const DATA=[{"id": "sec0", "group": "总览与计划", "title": "先读我", "basename": "00_README_先读我.md", "markdown": "# AI 应用开发 · 自学库\n\n> 定位：大二 · 有一点编程基础 · 时间不固定 · 目标\"先扎实学会 + 两个都要(先 AI 后 Web)\"\n> 学法调优：**自由节奏 · 不背只求懂 · 一步一步 · 过渡已排好**。\n> 信息基准：**2026-09-19**。库名/API/数据会随时间变化，但能力链与稳定范式不受影响。\n\n---\n\n## 一、这一页往后就是全部（简洁，没有堆文档）\n\n- 顶层只有 2 篇：**先读我（本页）** 和 **总览（路线·学法·产出）**——读那篇即可起步。\n- 四个阶段是整条主线，每阶段开头一篇「背景」，之后每篇按顺序读，上一篇的产物就是下一篇的输入，自然衔接。\n- 完整目录见下方。\n\n## 二、文件夹地图\n\n```\nAI_Dev_Learn/\n├── 00_README_先读我.md            ← 本页：用法 + 地图\n├── 00_总览_路线学法与产出.md      ← 全库总纲：值不值 / 先AI后Web / 学法五原则 / 每阶段产出物（先读）\n├── 02_阶段一_Python与API/\n│   ├── 00_背景_技术栈导航-学什么别学什么.md  ← 碰 Python 前，先看清技术全景\n│   ├── 01_环境搭建与终端基础.md\n│   ├── 02_Python最小闭环.md\n│   └── 03_大模型API调用实战.md\n├── 03_阶段二_RAG知识库/\n│   ├── 00_背景_周边扩展地图.md     ← 学检索时，顺带懂 grep/SQL/知识库\n│   ├── 01_RAG概念与全流程.md\n│   ├── 02_读取文档与分块.md\n│   ├── 03_词向量与检索原理.md\n│   ├── 04_向量数据库Chroma实践.md\n│   ├── 05_完整RAG闭环.md\n│   └── 06_RAG效果优化.md\n├── 04_阶段三_Agent/\n│   ├── 00_背景_前沿范式雷达.md     ← 学 Agent 时，先看稳定范式坐标\n│   ├── 01_从问答到Agent.md\n│   ├── 02_LangGraph核心-节点边状态.md\n│   ├── 03_工具调用与Agent闭环.md\n│   ├── 04_接入真实工具-搜索与RAG.md\n│   ├── 05_MCP让Agent能力标准化.md\n│   └── 06_完整Agent项目.md\n├── 05_阶段四_评测与求职/\n│   ├── 00_背景_行业与未来.md       ← 市场在招什么 + 未来往哪走（2026-09）\n│   ├── 01_评测与调优.md            ← 证明智能体\"可靠\"，把 60%→85%\n│   ├── 02_部署与CI.md              ← 带鉴权上线 + git push 自动跑回归\n│   └── 03_求职-简历与面试.md       ← 作品集 / 简历数字 / 面试讲原理\n├── companion/                     ← 实验台：每篇对应的可运行代码 + 冒烟测试 + CI（与手册一一对应）\n├── build.py                       ← 把以上所有 .md 重建成单文件 index.html\n├── index.html                     ← 产物：全部内容打成一页，双击即读（由 build.py 生成，别手改）\n└── 99_学习打卡模板.md              ← 进度记号（可选，不记也行）\n```\n\n> 只想读不想配环境：直接双击 **`index.html`**（左侧目录 + 全文一页看）。\n> 改了任何 `.md` 之后，跑一句 `python build.py` 重建 `index.html`——**产物名固定为 index.html，不要再另存别的名字**，否则会出现\"两份同名页面、内容不一样\"的坑。\n\n## 三、怎么用（自由版）\n\n1. **当\"路径\"不当课表**：从阶段一开始一篇篇往后走，断档就回头接上，不追进度。\n2. **一步一步**：每篇先\"概念/原理\"再动手，别跳步。\n3. **懂原理优先于背**：库名/接口都能查；能用自己的话讲清＝真懂了。\n4. **过渡已排好**：顺着读自然衔接，不用自己找联系。\n5. **记录是选择**：`99 打卡` 爱用不用，真正要留的是\"这个知识点我讲得清吗\"。\n\n## 四、核心学习方式：AI 辅助开发\n\n代码用 AI Agent 生成，你负责：**给清上下文 → 审查(看懂/对不对/边界) → 让它改 → 拆小步**。\n红线：**RAG/Agent 的原理必须自己懂**——这是面试底气。\"让它写\"≠\"什么都不用懂\"。\n\n## 五、每条路线都注意这两点\n\n1. 知识以\"**能跑通**\"为学会标准，别停在\"看完\"。\n2. 评价自己的唯一标准：**能不能给另一个人把一个项目从头讲到尾**。\n\n---\n\n现在翻开 **`00_总览_路线学法与产出.md`**，从阶段一第 1 步开始。"}, {"id": "sec1", "group": "总览与计划", "title": "总览·路线学法与产出", "basename": "00_总览_路线学法与产出.md", "markdown": "# 训练营总纲 · 路线 · 工程契约 · 一条贯穿作品（全库一页总纲）\n\n> 这一页是全库的\"宪法\"，读完它你就知道整本手册从\"路线图\"升级成了\"训练营/工程手册\"。\n> 判断基准：2026-09-20。**核心转变：不是\"我教你跑通 4 个 demo\"，而是\"我带你把 1 个能上线的作品，越做越硬\"。**\n\n---\n\n## 一、先回应三个最要紧的事实\n\n- **\"跑通 demo ≠ 学会\"**。能跑只证明逻辑通；能被公司信任地上线，才证明你处理过真实工程的脏活：依赖、Git、鉴权、日志、异常、测试、部署、成本、并发、安全。整本手册的目标，从\"跑通\"抬到\"能被信任\"。\n- **用 AI Agent 写教材会把\"全而浅\"放大**。所以本库立了个死规矩：**每个代码块必须能在 companion 仓库里真的跑通**；配不上可运行代码的讲解，一律不写。AI 写代码没跑过的部分，我会明确标\"未验证\"，绝不假装都对。\n- **作品不能同质化**。命令行闲聊→RAG→Agent→成绩单，这个套路招聘方看腻了。本库改成**一个有业务场景、有用户、有约束、有取舍**的贯穿作品（见下）。\n\n> 目标仍清晰：两个月的训练营，最后你手里的不是\"一堆 demo\"，而是**一个能点开就跑、带评测、讲得出为什么这么设计的客服智能体作品 + 一段能白话讲透的工程叙事**。\n\n## 二、贯穿作品：企业客服知识库 + 工单 Agent（CSKP）\n\n整个手册都长在这一件作品上，四阶段 = 把它做硬的四道里程碑：\n\n```\n企业客服智能体（Customer Service Knowledge Portal）\n├── 阶段一 Python+API    : 能把\"客服问题→要点回答\"的命令行助手（地基 + 工程化）\n├── 阶段二 RAG 知识库    : 只许对着\"产品手册/FAQ\"答，能报出处、能拒绝答不了的（防幻觉）\n├── 阶段三 Agent        : 能自主\"查知识库/翻订单/查物流\"，把多步客服流程跑完（含失败重试）\n└── 阶段四 评测+部署    : 用评测集证明可靠 + 带鉴权的 HTTP 服务 + CI 回归（能被别人 clone 跑）\n```\n\n它为什么能打破同质化（招聘方会问你这些，提前想好）：\n- **用户**：客服坐席（不是聊天机器人演示者）。有真实角色、权限边界。\n- **约束**：幻觉必须可控（答不了就承认）、成本要压（缓存/限流）、权限要封（客服查不到别人订单）。\n- **取舍**：宁可让 Agent\"多问一句\"也别瞎猜；检索\"广但杂\" vs \"窄但准\"要权衡。\n这些\"用户/约束/取舍\"学进每一阶段——**面试讲的不是\"我做了什么\"，是\"我为什么这么设计、哪里失败、怎么权衡\"。**\n\n## 三、三条工程契约（每篇都遵守，是\"可信\"的根基）\n\n### 契约 ① 可运行契约\n- 每个代码块都能在 `companion/` 仓库里跑通；`companion/` 配 CI，`git push` 即自动跑冒烟测试。\n- 手册里我明确写代码源自 companion 哪个文件；**凡是\"理论展示、故意不跑\"的代码，标题都写明\"示意，非可运行\"**，绝不混淆。\n\n### 契约 ② 验收契约\n- 每篇末尾是**验收清单（可勾选的自测）**，不是\"能讲懂才叫会\"的空话：**勾得满 = 本篇过；勾不满 = 回到\"卡在哪\"栏找缺漏**。\n- 每个阶段有\"里程碑验收\"：当场跑通 + 能对别人讲完\"为什么这么设计\"。\n\n### 契约 ③ 演进契约\n- companion 仓库与手册每篇都标**版本日期**；改一次，往 `更新日志` 记一条（日期 + 改了啥 + 是否有破坏性变更）。\n- 库名/API/依赖版本变了 → 手册与仓库一起升版本，进日志。**你的学习不因\"我写的教程过时\"而卡壳。**\n\n## 四、每篇固定栏目（让自学不迷路，\"偏读\"变\"偏做\"）\n\n每一篇都保留这五个栏，位置固定：\n1. **前置自测**（开篇 3 题）：读过上一篇的才答得上来——断了档一眼就看出来。\n2. **这一站解决什么**（一句话定位 + 判断基准日期）。\n3. **动手 + 验收清单**（对应 companion 文件，跑一步勾一步）。\n4. **常见坑**（这一步所有人必踩的 3 个坑，含报错长啥样、怎么解）。\n5. **断档接续**（隔了几天怎么快速接上：先跑哪条命令、先看哪个文件）。\n\n> 你断了档不用从头翻——按\"断档接续\"给的最短路径，5 分钟复位。\n\n## 五、\"AI 应用全栈\"该有的，不再省略（跳过的会明说）\n\n全栈不只\"最小 HTML/CSS/JS + Python 调 API\"。要能当一个\"可信的作品\"，你至少得把下面这些在你作品里走一遍（顺序随阶段展开；确实跳过的会明说，绝不让你误以为\"够用\"）：\n- **后端**：依赖管理(venv/requirements)、`.env` 密钥安全、日志、异常分层、认证鉴权、CORS、请求限流、数据库(SQLite 起步)。\n- **接口形态**：流式输出(打字机)、消息格式约定、错误码约定、健康检查 `/healthz`。\n- **部署与可靠性**：Git + CI(GitHub Actions 跑测试)、`.dockerignore/Dockerfile` 起步部署、监控/可观测(把\"调了啥/检索到啥/哪步出错\"记日志)。\n- **性能与成本**：缓存、并发受限、成本预算（一次回答花多少钱）。\n> 这些不全是\"现在满分掌握\"，而是在四阶段里**逐一上手并留有复用点**——用到哪写到哪，不空谈。\n\n## 六、companion 仓库 = 手册的\"实验台\"\n\n- 位置：`AI_Dev_Learn/companion/`\n- 职责：每个阶段的可运行代码 + 冒烟测试 + CI 配置 + 更新日志，与手册一一对应。\n- 你的用法：**跟着手册每篇，把 companion 对应文件亲手敲一遍/改一遍**，理解为什么这样写，而不是直接 copy。\n- 红线：**RAG/Agent 的原理必须自己懂**——\"让 AI 写\"≠\"什么都不用懂\"；面试讲不出原理，就回到对应篇补。\n- 产物：全库 `.md` 由 `python build.py` 重建成单文件 `index.html`（双击即读）。\n  **产物名固定为 `index.html`**——手工另存别的名字会造出\"两份同名页面、内容不同步\"，读者拿到的是旧版。\n\n## 七、怎么用（自由版）\n\n1. **当\"训练营路径\"不当课表**：从阶段一第 1 步往后走，断档用\"断档接续\"快速复位，不追进度。\n2. **每篇先\"前置自测\"**：答得上来 = 接着走；答不上 = 回上一篇。\n3. **验收清单勾满才算过**：没勾满就回\"卡在哪\"，不硬赶。\n4. **跟着 companion 亲手写**：理解 > 背；跑得通 + 讲得清 = 学会。\n5. **记录是选择**：`99 打卡` 爱用不用；真正的进度 = 验收清单勾满几篇。\n\n---\n**现在翻阶段一第 1 步：先装 Git、建 venv、把 `companion/` 拉到你本机跑通第一条冒烟测试。**"}, {"id": "sec2", "group": "阶段一 · Python 与 API", "title": "技术栈导航-学什么别学什么", "basename": "00_背景_技术栈导航-学什么别学什么.md", "markdown": "# 阶段一 · 背景：技术栈导航——先学什么、别碰什么（一张地图）\n\n> 这一站解决什么：不教你写代码，而是给你**一张技术全景地图**——哪些是主干必修、哪些是配套可选、哪些是你这种\"AI 应用开发者\"根本不该抢跑的方向。有地图才不会被带偏（防信息茧房第一层）。\n> 判断基准：2026-09-20。这一篇是\"判断尺子\"，学完随时回来查，不强求一次记全。\n\n**前置自测（可先跳过，读到阶段中再回来看一眼）**\n1. 你这条主线的主轴语言是哪个？\n2. HTML/CSS/JS 在你路线里算\"主干\"还是\"把 AI 包装成网页的加分\"？\n3. Java/C 为什么\"不为转行主动学\"？\n\n---\n\n## 1. 判断一句话：学不学它，看\"对 AI 应用有没有用\"\n\n很多技术本身很好，但**对你这阶段的目标没有增益**。判断要不要学，只问一件事：**它现在能否把\"AI 应用项目\"往前推一步，或让你离想要的岗位更近。** 其余都是噪音。\n\n## 2. 一张总表：技术归位（背下来当锚点）\n\n| 技术 | 分类 | 在你的路线里 | 要不要学／何时学 |\n|---|---|---|---|\n| **Python** | 主干·必学 | AI/NLP 的默认语言，RAG/Agent 全在这 | ★ 从现在就开始 |\n| **HTML / CSS** | 界面·配套 | 把 AI 应用做成网页的\"外壳\" | 主线之后再补，AI 全栈会用到 |\n| **JavaScript (JS)** | 界面·配套 | 网页交互 + `fetch` 调后端 | 同上，排在 HTML/CSS 之后 |\n| **Node.js** | 后端·可选 | 也能做后端，但你不是必须用它 | 想走纯 JS 全栈/前端岗才学 |\n| **SQL** | 数据·加分 | **Text-to-SQL**（让 LLM 查数据库）更强 | 想进企业/做查库 Agent 再加 |\n| **Java** | 后端·校内 | AI 应用主线基本用不上 | 学校课程要过才学，不为转行主动学 |\n| **C 语言** | 底层·校内 | 完全不在 AI 应用主线 | 学校要过就学，别因此分心 |\n| **React/Vue 等前端框架** | 界面·进阶 | 早年界面够用即可；复杂交互才上框架 | 明确做前端/AI 全栈产品时再上 |\n| **深度学习理论/微调训练** | 模型·了解 | 不必深修；知道\"它是什么\"即可（评测阶段会用） | 需要时再挖 |\n\n> 关键记忆点：**Python 是主轴，JS/CSS 是让它\"能被人点开\"的加分，Java/C 是另一条路。**\n\n## 3. \"AI 应用全栈\"到底是什么（和你想法的校准）\n\n你想要的不是传统网站全栈，而是 **\"AI 应用全栈\"= 以 AI 为核心（后端 Python），补一层网页界面（前端 HTML/CSS/JS）把它包装成可用产品**。\n\n```\nAI 能力（RAG / Agent，Python）\n   │  用 FastAPI 暴露成 HTTP 接口\n   ▼\n网页界面（HTML 结构 → CSS 样式 → JS 交互：点按钮 fetch 调接口、展示回答）\n```\n\n> 前端只学\"够把 AI 包成网页\"的最小集，不要一头扎进 React 生态，那是另一个大坑。\n\n## 4. 三个常见\"容易误导你\"的说法（提前免疫）\n\n1. **\"不会前端当不了全栈\"** —— 那是传统全栈的焦虑。你要的 AI 全栈，前端只需够用。\n2. **\"大家都学后端 Java\"** —— 那是企业 Java 岗，不是 AI 应用岗。你跟 AI 主线，Java 不用抢跑。\n3. **\"先系统学 Python 语法毕业\"** —— 不必。你用 AI Agent 写代码+看懂就够，主线靠项目推进（已在计划引言）。\n\n## 5. 本篇小结\n\n- 主轴：**Python**；配套：**HTML/CSS/JS**；加分：**SQL**；避开：**Java/C 抢跑**。\n- 用 \"对 AI 应用有没有用\" 当唯一尺子，就不会被各种\"爆款技术\"带偏。\n\n> 下一篇：阶段二你会触达检索/数据相关（grep、SQL、知识库）——用同一把\"尺子\"判断它们值不值得学。\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n- 这一篇是\"地图/尺子\"，断了不用补\"进度\"——真有\"要不要学 X\"的纠结时，回来看这张总表即可。\n- 记忆锚：**主轴 Python；配套 HTML/CSS/JS；加分 SQL；避开 Java/C 抢跑。判断一律问\"对 AI 应用有没有用\"。**"}, {"id": "sec3", "group": "阶段一 · Python 与 API", "title": "环境搭建与终端基础", "basename": "01_环境搭建与终端基础.md", "markdown": "# 阶段一 · 第 1 步：把工作台搭成\"训练营的样子\"——环境 + 终端 + 工程地基\n\n> 这一站解决什么：别人教环境搭建只教\"装个 Python 能跑就行\"。训练营的标准是——**从第一句代码起，就按\"能上线的工程\"搭地基**：独立的虚拟环境、管理密钥、装好 Git、用 `.gitignore` 管住秘密。这些\"工程债\"现在不还,后面堆成山。\n> 判断基准：2026-09-20。本步对应 companion 仓库（见文末\"断档接续\"）。\n\n**前置自测（答不上就先回上一站）**\n1. \"真去执行代码\"的是什么？（Python / VS Code / 终端 三者里选）——答不出回读总纲。\n2. 你接下来学的东西最后会汇进一个什么\"贯穿作品\"？\n3. 跑代码前要先把密钥藏着——你觉得该藏在代码里，还是藏在别处？\n\n---\n\n## 站纲（跨 5 小步，别跳）\n**认识工作台三角色 → 装 Python 点亮灶台 → 认识终端 → 建\"工程地基\"(venv/Git/.env/.gitignore) → 跑通第一条生产线**\n\n---\n\n## 第 1 步 认知先立住：你的工作台上有三个角色\n\n写代码不需要\"很多软件\"，只需要**分工明确的三位**——记不住这个，后面每一步都迷路。\n\n> 🍳 类比：学做菜需要**灶台（真正把菜煮熟的）** + **案板（备菜的）** + **你喊话的对象（厨师）**。少一个都做不成饭。\n\n| 角色 | 工具 | 做的活 |\n|---|---|---|\n| **真会执行的发动机** | Python | 那口灶台——真正把你的指令跑起来 |\n| **你写字的桌子** | VS Code | 那张案板——舒服地写代码 |\n| **你跟电脑说话的话筒** | 终端 / Terminal | 那扇窗口——喊命令、看结果 |\n\n> 💡 底层一句话：**写代码 = 在\"写字桌\"起草指令 → 交给\"发动机\"执行 → 通过\"窗口\"看结果。** 现在你就知道每个工具管哪一段，不会被\"装了 VS Code 就会跑代码\"这种菜鸟误会骗到（VS Code 只是写字桌，真正跑的是 Python）。\n\n## 第 2 步 请来主力：装 Python（别漏 PATH 那个勾）\n\n→ 打开 `python.org` → Downloads → 装 Windows 安装包。\n\n> ❗ 安装时那个勾选框 **`Add python.exe to PATH` 一定要勾**。不勾：第 3 步窗口里喊 `python` 它听不懂——这是新手第一道墙，现在堵上。\n\n验证（Windows 终端 = PowerShell，按 `Win` 输 `powershell` 回车）：\n\n```shell\npython --version\npip --version\n```\n\n看到 `Python 3.10+` 和 `pip 23.x` 就通了。 报\"不是内部命令\"= 那个勾没勾，重装即可。\n\n## 第 3 步 打开写字桌 + 认识终端\n\n**装 VS Code**（`code.visualstudio.com`）：左边文件列表，中间写字，底部/顶部\"终端\"标签=喊话口。\n\n**必会命令（看懂缩写就记住了，不看懂靠背）**：\n\n```shell\npwd          # 我现在在哪个文件夹\ndir          # 这个文件夹里有啥\ncd 文件夹     # 走进这个文件夹\ncd ..        # 退回上一层\n```\n\n## 第 4 步 工程地基（本步真正的\"训练营\"增量）💡\n\n前三步是\"能跑\"，这一步让它\"能体面地跑、别给自己埋雷\"。四件小事，件件讲清为什么：\n\n**① 建虚拟环境 venv（把依赖\"关进一个小房间\"）**\n不建 venv 的话，你装的东西会跟系统里的其它项目互相打架（A 项目要 requests 2.x，B 要 3.x，全乱套）。venv = 每个项目一间独立小房间：\n\n```shell\ncd 你的项目文件夹\npython -m venv .venv\n.venv\\Scripts\\activate     # Windows 激活；成功会自动在开头出现 (.venv)\npip install python-dotenv requests   # 装到这一间小房间里\n```\n\n> 为什么重要：**`requirements.txt` 能锁住版本，`venv` 能锁住\"装在哪\"**。两者是你的依赖不掉队的前提——全线都长在 completaion 你的每个阶段上。\n\n**② 装 Git（版本控制，训练营的\"后悔药 + 时间机器\"）**\nGit = 把你的代码每一步都留底，改坏了能退回、还能推到 GitHub 当作品集。本机若还没有就装（搜\"Git for Windows\"装好）。\n> ⚠️ 之前确认过你这台机 Git 未装——**这一站的第一桩事就是装好它**，后面每一步代码都 `git commit` 一下。\n\n```shell\ngit config --global user.name \"你的名字\"\ngit config --global user.email \"你的邮箱\"\ngit init                  # 把这个文件夹变成 Git 仓库\n```\n\n**③ 建 `.env` 存密钥 + `.gitignore` 藏住秘密**（安全，必须做）\n密钥（API Key）是\"花钱的通行证\"。存代码里 = 上 GitHub 就泄露 + 被人盗刷。正确做法：\n\n- 建一个 `.env` 文件放 Key：`DEEPSEEK_API_KEY=sk-xxxx`\n- 建一个 `.gitignore`，写上 `.env`——这样 `git add` 永远不会把 Key 提交上去。\n\n> 对照 companion：`companion/.env.example`（模板）+ `companion/.gitignore`（已写好）就是标准答案。**你的项目里应该有个 `.gitignore`，里面第一行就是 `.env`。**\n\n**④ 把 `companion` 拉回本地**\ncompanion 是全手册的实验台（有冒烟测试 + CI）。用 VS Code 打开 `AI_Dev_Learn/companion/`，先跑一句零依赖冒烟，确认地基是好的：\n\n```shell\npython phase1\\test_smoke.py   # 不看代码也能先验环境通不通\n```\n\n> 只能跑出 `OK` 才往下一步；跑红 = 先解决它，别带着问号往下走。这就是\"验收契约\"的第一次使用。\n\n## 第 5 步 亲手跑出第一句话（生产线的第一次走通）\n\n① 在 companion 里建 `my_first/` 文件夹 → ② VS Code 打开 → ③ 新建 `hello.py` → ④ 写 `print(\"你好，我开始了\")` → ⑤ `Ctrl+S` → ⑥ 终端跑：\n\n```shell\npython my_first\\hello.py\n```\n\n看到 `你好，我开始了` **= 草案→执行→看结果** 整条链第一次走通。你已经在用跟\"能上线的工程\"一样的姿势起步了。\n\n> 顺带记住**交互式**：终端输 `python` 回车出现 `>>>`，能一句句\"当场试\"，调试时最顺手；`Ctrl+Z` 回车或 `exit()` 退出。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] `python --version` 和 `pip --version` 有输出\n- [ ] `python -m venv .venv` 建好，激活后开头出现 `.venv`\n- [ ] Git 装好，`git --version` 和 `git config` 设置成功，`git init` 成功\n- [ ] companion 里建好 `.env`，`.gitignore` 首行是 `.env`，且 `/companion` 的冒烟 `python phase1\\test_smoke.py` 输出 `OK`\n- [ ] `hello.py` 用 `python` 跑出 `你好，我开始了`\n- [ ] 能对你朋友讲清\"Python / VS Code / 终端 各管哪一段\"\n\n勾不满就回\"常见坑\"找，别硬赶。\n\n## 常见坑（这一步 90% 的人踩）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| `python` 没反应 | PATH 勾没选 | 重装勾 *Add Python to PATH* |\n| 冒烟报 ModuleNotFoundError 的 `chat_cli` | 终端没在 companion 目录 | 先 `cd` 到 companion 再跑 |\n| venv 激活失败 | 权限/路径 | 用 `python -m venv .venv` 再 `.venv\\Scripts\\activate` |\n| 把 `.env` 推到 GitHub | `.gitignore` 没建 | 立刻补 `.gitignore` 写 `.env`，并去 GitHub 撤销那个提交 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 VS Code 打开 `companion/`，激活 venv（`.venv\\Scripts\\activate`）。\n2. 跑一次 `python phase1\\test_smoke.py`——`OK` 则环境没坏。\n3. 看一眼本步\"验收清单\"，没勾的补上；勾满就进下一步。\n> 记忆锚：**这一步 = \"把地基打得像能上线的工程\"**（venv+Git+​.​env+​​.gitignore），不是\"能跑就行\"。\n\n## 下一步：地基好了，给灶台喂\"会用到的语法\"\n\n下一站把 `print` 一句升级成\"能算、能存、能做点轻活\"的最小语法零件——只学后面调大模型够用的那丁点，其余深奥语法留给学校。\n\n> 去读阶段一 · `02_Python最小闭环.md`。"}, {"id": "sec4", "group": "阶段一 · Python 与 API", "title": "Python最小闭环", "basename": "02_Python最小闭环.md", "markdown": "# 阶段一 · 第 2 步：给灶台写\"菜谱\"——Python 最小闭环\n\n> 这一站解决什么：上一站你把\"起草→执行→看结果\"的生产线架起来了，但这根线只会干一件事：`print` 一句话。这一站，我们给**这台灶台喂\"会用到的语法\"**——不多，只要够你后面调大模型、做项目用的那一丁点，其余深奥语法让学校课去讲。\n> 判断基准：2026-09-20。\n\n**前置自测（答不上就先回上一站）**\n1. 上一步你搭的\"四大件\"里，Python 负责什么？venv 又是什么？\n2. 用一句话说明\"变量\"是干嘛的（贴标签的碗）？\n3. 还记得 `.gitignore` 里第一行该写什么吗？\n\n**站纲（这一站跨够 6 小步，别跳）**\n**懂变量 → 类型 → 列表/字典 → 条件/循环 → 函数 → 拿现成工具**，最后把它们拧成一个小程序。\n\n全程记着上一站那句话：**你写的不是\"要给电脑看的咒语\"，是\"给灶台的一张操作菜谱\"。** 每学一个零件，都问一句：\"它在我那座灶台上，管的是什么活？\"\n\n---\n\n## 第 1 步 变量：让灶台能\"记住\"东西\n\n很多时候，你辛苦算出来的值稍后还要用到——灶台得有个地方**记得住它**。\n\n> 🍳 类比：变量 = 厨房里的一只**贴了标签的碗**。`苹果 = 3` 就是\"往贴着'苹果'的碗里放 3\"。下次你说\"苹果\"，灶台知道你说的是那 3。\n\n```python\napple = 3        # 把数字 3 存进名为 apple 的碗\nprice = 2.5      # 存一个小数\nname = \"阿远\"    # 存一段文字\n\nprint(apple * price)   # 用的时候，直接喊碗的名字就行 → 7.5\n```\n\n【本质一行】**\"=\" 不是\"等于\"，是\"把右边装进左边这个名字\"。** 现在还不理解，后面写多了自然就顺了。\n\n## 第 2 步 类型：记住的东西，分几类\n\n灶台要正确\"处理\"别人的东西，得先知道它**是什么类别**——文字不能相乘、文字里也可能带着数字的陷阱。\n\n| 类别 | 名字 | 例子 |\n|---|---|---|\n| 文字 | `str` 字符串 | `\"你好\"`, `\"20\"` |\n| 整数 | `int` | `20` |\n| 小数 | `float` | `1.75` |\n| 真/假 | `bool` | `True` / `False` |\n\n> 💡 **这步最容易栽的坑**：`input()` 拿进来的哪怕你输的是\"20\"，灶台也当它是**文字**。要当数字用，必须显式喊它转：`age = int(input(\"你几岁\"))`。\n> 记住一个动作就好：**要数字，先 `int(...)`**。\n\n## 第 3 步 列表 & 字典：装\"一组东西\"和\"带名字的东西\"\n\n你经常要面对的不是一个值，而是一堆。两种最常用的\"容器\"：\n\n**列表——一排贴着 0、1、2 号码的格子：**\n\n```python\nfruits = [\"苹果\", \"香蕉\", \"橙子\"]\nprint(fruits[0])      # 苹果 —— 注意！从 0 开始编号\nprint(fruits[-1])     # 橙子 —— -1 是倒数第一个\nfruits.append(\"梨\")   # 末尾加\n```\n\n> 🔥 新手最大的反直觉点：**第一个格子叫 0，不叫 1**。把它理解成\"第几个\"减 1，就不会错。\n\n**字典——一排放了标签的收纳盒，按名字取：**\n\n```python\nuser = {\"name\": \"阿远\", \"age\": 20}\nprint(user[\"name\"])    # 用名字拿 → 阿远\nuser[\"city\"] = \"嘉兴\"  # 新增一个格子\n```\n\n> 💡 提前告诉你为什么这个必须懂：**后面你调大模型，它 return 回来的就是一层套一层的 `dict`。** 这一站把\"用名字从盒子里取值\"练熟，下一站你取回答就是顺手的事。\n\n## 第 4 步 条件 & 循环：让灶台会\"判断\"和\"重复\"\n\n只会一句句往下执行的灶台没价值。得让它**看情况走**、**按遍数兜圈**。\n\n**判断（if）——岔路口选一条走：**\n\n```python\nscore = int(input(\"考了多少分？\"))\nif score >= 90:\n    print(\"优秀\")\nelif score >= 60:\n    print(\"及格\")\nelse:\n    print(\"不及格\")\n```\n\n> ⏰ 三个口头禅记牢：**句子末尾要冒号 `:`；下面缩进告诉灶台\"这两行是一伙的\"；只往一个分支走。**\n\n**循环——重复干活（`for` 固定遍数，`while` 看条件）：**\n\n```python\nfor i in range(5):      # range(5) = 0,1,2,3,4\n    print(\"第\", i, \"次\")\n\nfor f in fruits:        # 把列表整个走一遍，每个都打印\n    print(f)\n\ncount = 0\nwhile count < 3:\n    print(count)\n    count = count + 1   # 千万别漏这句，否则死循环\n```\n\n## 第 5 步 函数：把一段工序打包成\"一个按钮\"\n\n同一串动作你常要反复用——与其每次重抄，不如**打包成一个按钮，点一下执行一次**。\n\n```python\ndef greet(name, times):\n    for i in range(times):\n        print(f\"你好，{name}！\")\n\ngreet(\"阿远\", 2)     # 点按钮\n```\n\n> 【本质一行】**函数 = \"把一道工序封装成可反复调用的按钮\"，还能 `return` 把结果交出来给你 → 这就是你将来写一切工具的最小零件。**\n\n## 第 6 步 import：去\"工具箱\"拿现成工具（重中之重）\n\n写稍微正经的程序，十有八九不必从 0 造轮子——Python 社区把常用功能打包成了**一个个工具箱（库）**，你 `import` 一下就拿来用。\n\n```python\nimport math\nprint(math.sqrt(16))     # 4.0 —— 平方根现成有\n\nimport random\nprint(random.randint(1, 10))   # 1~10 随机整数\n```\n\n> 🍳 类比：库 = 超市里**别人已经做好的半成品**。你要调大模型，后面必装一个叫 `requests` 的库——它让你能用代码发\"网络请求\"。一会儿就装好它备用：\n> ```shell\n> pip install requests\n> ```\n\n---\n\n## 当场把它拧成\"一座会记账的小灶台\"（本步产出物，连着做）\n\n把上面 6 个零件拼起来，你就拥有了第一个\"有点用\"的小程序——**能加账、能看账**的记账小工具：\n\n```python\nbooks = []                       # 一个空列表，装所有账\n\ndef add(what, amount):           # 函数：收一条账\n    books.append({\"事情\": what, \"金额\": amount})\n\ndef show():                      # 函数：把所有账打印出来\n    for b in books:              # 循环遍历\n        print(b[\"事情\"], b[\"金额\"])\n\n# 用起来\nadd(\"早饭\", 8)\nadd(\"地铁\", 4)\nshow()\n```\n\n> 你看，这一小段**同时用上了**变量、列表、字典、循环、函数、调库——这些就是你之后做 AI 应用的全部语法零件。别小看它。\n\n---\n\n## 验收：能讲出来才算会（不笔试、不看笔记）\n\n1. `user = {\"name\": \"阿远\"}`，我怎么拿到\"阿远\"？为什么“第一个格子”是 0？\n2. 用户输入年纪后，我哪怕要把它当数字用，也得先 `int(...)`——为什么？\n3. 什么叫\"把一段工序打包成函数\"？函数里的 `return` 是干嘛的？\n\n答不上就回上文对应小步找，别硬猜。\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n- 不用重读全文：打开 companion 的 `phase1/chat_cli.py` 看几分钟——里面 dict 取值、函数、循环、import 全都有实际用法；看得懂=复位成功。\n- 记忆锚：**这一站的 6 个零件（变量/类型/容器/判断循环/函数/import）+ 一条：\"后面调大模型的返回就是一个 dict，用名字取\"。**\n\n## 下一步：第 2 步的\"菜谱\"零件你已经备齐了\n\n下一站，我们往这座灶台上**接一根真正的\"外援\"电话线**——让它能开口说话、讲道理。用到的东西全在前面这 6 个零件里。\n\n> 去读阶段一 · `03_大模型API调用实战.md`。"}, {"id": "sec5", "group": "阶段一 · Python 与 API", "title": "大模型API调用实战", "basename": "03_大模型API调用实战.md", "markdown": "# 阶段一 · 第 3 步：接一根\"外援\"电话线——调用大模型 API（产出第一交付物）\n\n> 这一站解决什么：上一站你学会给\"灶台\"写菜谱，但它只会算你自己写的东西，**不会说话**。这一站我们给它接一根电话线，打给\"外援大厨\"（大模型）——让灶台能把你问的话送出去、把回答带回来。这根线一通，你能做的事立刻上一个台阶。\n> 判断基准：2026-09-20。本笔记以 **DeepSeek** 为例（对新手友好、便宜），换智谱/Kimi 思路完全一样。\n> 交付物对应：`companion/phase1/chat_cli.py`（这本篇末尾会把它升级成\"健壮可上线\"的版本）。\n\n**前置自测（答不上就先回上一站）**\n1. `API Key` 该放哪、不该放哪？为什么？（上一站刚教）\n2. 大模型**有记忆吗**？那要多轮对话，得怎么做？（一句话）\n3. 你在什么 \"文件夹\" 里跑 `python xx.py`，决定它找得到文件？（上上站）\n\n**站纲（跨 4 小步）**\n**先懂大模型在你眼里是啥 → 认识那根\"电话线\"(API) → 亲手打第一通 → 让它记住对话（→ 交付物）**\n\n---\n\n## 第 1 步 大模型在你眼里，到底是什么（先懂再动手）\n\n忘掉\"智能\"\"深度学习\"这些吓人的词。站在\"你的代码\"的角度，大模型就一个行为：\n\n> **你塞给它一段文字，它吐回\"最像接着往下写\"的文字。**\n\n它**不查你的数据库**、**不记得你之前说过什么**。它只会一件事：**根据你刚给它的整段文字，预测接下来该接什么字。**\n\n> 💡 这句话决定了后面好几个关键写法——尤其\"它没记忆，所以多轮对话要把历史整段发过去\"这条，是第 4 步的核心。\n\n## 第 2 步 认识那根\"电话线\"：什么是 API、什么是 Key\n\n你写代码时，想让大模型接活，得通过一个**别人开好的\"远程接口\"**——就叫 **API**。\n\n> 🍳 类比：这就像你**点外卖**。你把需求写在单子上 → 通过\"电话\"递给中央厨房 → 它把你的餐（答案）送回来。\n> - **API** = 那个\"电话 / 点单入口\"（一个网址）\n> - **API Key** = 你的**会员卡**（证明\"我有资格下单\"，同时记你账上）\n> - 我发的**参数** = 你点单时填的\"要什么口味\"\n> - **返回结果** = 送回来的那份\"餐\"\n\n所以你在代码里做的，永远只有三句话的事：**证明我是谁(Key) → 把我的话发过去 → 把回答拿出来。**\n\n### 15 分钟，办一张\"会员卡\"（拿 Key）\n\n1. 打开 DeepSeek 开放平台，注册/登录，找到 **API Keys** 页面。\n2. 新建一个 Key——得到一串 `sk-` 开头的东西。**只显示这一次，立刻复制存好。**\n3. ⚠️ 安全：这等于\"花钱的通行证\"，**别发群、别传 GitHub**（第 4 步教你藏到环境变量）。\n\n## 第 3 步 亲手打第一通电话（看懂每一行在干嘛）\n\n我们不用任何现成封装，直接用 `requests` 手写发请求——**因为只有你自己拼一次，才真正看懂\"调用\"到底是往哪里发、拿回什么。**\n\n```python\nimport requests                                 # 拿出\"能发网络请求\"的工具\nimport os\nfrom dotenv import load_dotenv\nload_dotenv()                                   # 读取藏在 .env 里的 Key\n\nAPI_KEY = os.getenv(\"DEEPSEEK_API_KEY\")         # 会员卡：从环境变量取出\nurl = \"https://api.deepseek.com/chat/completions\"  # 电话线：API 地址\n\nheaders = {\n    \"Authorization\": f\"Bearer {API_KEY}\",       # 亮出会员卡（注意 Bearer 后有空格）\n    \"Content-Type\": \"application/json\"          # 说\"我要发的是一份 JSON\"\n}\n\npayload = {\n    \"model\": \"deepseek-chat\",                    # 我要点\"哪个菜\"（哪个模型）\n    \"messages\": [                                # 这是一份\"对话记录\"\n        {\"role\": \"system\", \"content\": \"你是友好的助手\"},   # 设定它的\"人设\"\n        {\"role\": \"user\", \"content\": \"你好，介绍一下你自己\"} # 你问的话\n    ]\n}\n\nresp = requests.post(url, headers=headers, json=payload)  # 打出去，等回信\ndata = resp.json()                               # 回信是 JSON，转成 dict 方便取\n\nanswer = data[\"choices\"][0][\"message\"][\"content\"]  # 一层层剥开，拿到文字\nprint(answer)\n```\n\n【本质一行】**你做的只是\"发一次网络请求 + 按导航从返回的 dict 里取值\"**，和 `requests` 抓个天气没两样。跑通那一刻你会觉得\"大模型也就这样\"——对，第一步本来就是把它当普通接口用。\n\n> 想看回信长啥样？加一行 `print(resp.json())`，亲眼看它的结构，比背任何东西都管用。\n\n### 顺手把 Key 藏好（安全，必须做）\n\n同目录建一个 `.env` 文件放密钥，别写死在代码里：\n\n```\nDEEPSEEK_API_KEY=sk-你的key\n```\n\n先 `pip install python-dotenv`，代码里 `load_dotenv()` + `os.getenv(...)` 就能读（上面代码已按这个写法给你）。**这样你即使把代码传 GitHub，Key 也不会泄露。**\n\n## 第 4 步 让它记住对话：多轮聊天（阶段一交付物 🎉）\n\n大模型**没有记忆**——你第 2 句问它，它不知道第 1 句说了啥。所以要做\"连续对话\"，你得**把整段历史连人常话带 AI 的话，每次都一起发回去**：\n\n```python\nimport requests, os\nfrom dotenv import load_dotenv\nload_dotenv()\nAPI_KEY = os.getenv(\"DEEPSEEK_API_KEY\")\nurl = \"https://api.deepseek.com/chat/completions\"\nheaders = {\"Authorization\": f\"Bearer {API_KEY}\", \"Content-Type\": \"application/json\"}\nMODEL = \"deepseek-chat\"\n\nmessages = [{\"role\": \"system\", \"content\": \"你叫小远，回答尽量简短\"}]\n\ndef ask(user_text):\n    messages.append({\"role\": \"user\", \"content\": user_text})        # 记下你这句话\n    resp = requests.post(url, headers=headers,\n                         json={\"model\": MODEL, \"messages\": messages})\n    answer = resp.json()[\"choices\"][0][\"message\"][\"content\"]\n    messages.append({\"role\": \"assistant\", \"content\": answer})      # 记下 AI 这句\n    return answer\n\nwhile True:\n    u = input(\"你说：\")\n    if u.strip().lower() in (\"quit\", \"exit\", \"退出\"):\n        break\n    print(\"AI：\", ask(u))\n```\n\n> **这就是阶段一的交付物——一个能连续对话的命令行助手。** 你跑起来，跟它聊上几句，第一条\"会说话的生产线\"就跑通了。\n\n背后的 `messages` 就是一根越缠越长的记录绳：**已经发生过的话都堆在这，每次把所有话原样发回去，它就有了\"上下文\"。** 想换风格？改 `system` 那句\"人设\"就行。\n\n### 想再精致点？加两个参数（可选）\n\n```python\npayload = {\"model\": MODEL, \"messages\": messages,\n           \"temperature\": 0.7,   # 越低越严谨、越高越有创意\n           \"max_tokens\": 500}    # 最多生成多少字，防超长\n```\n\n### 训练营增量：把\"能聊\"升级成\"健壮可上线\"\n\n上面的版本能聊，但它是**练习版**：缺 Key 会抛裸异常、网络断了你看到的是 Python 堆栈、代码没日志、也没被测试保护。训练营不交这个——正确的是 **`companion/phase1/chat_cli.py`（v1.0.0）那个\"健壮版\"**，它把这一站讲的东西全落实了，你数数看它带上了哪些：\n\n- **配置从 `.env` 读**，缺 Key 时抛出\"照着做\"的友好提示（不是堆栈）。\n- **请求失败分类**：网络错 / 401(Key 无效) / 429(限流) / 服务端错，分别讲人话。\n- **日志**：`--verbose` 才暴露 DEBUG，平时安静。\n- **延迟 import**：让 `test_smoke.py` 不装任何第三方包也能跑 —— 这就是\"可运行契约\"能随手验证的原因。\n\n> 🔬 训练营要求：**别直接 copy。** 读完上面再对照 `companion/phase1/chat_cli.py`，理解每一处\"为什么要这么写\"，再用你自己的话把它敲出来一遍。\n\n它的冒烟测试在 `companion/phase1/test_smoke.py`（已通过，见上一站）。CI 里 `push` 也会跑它——你改坏了它会红，逼你看懂为什么。\n\n### 想再精致点？两个参数\n\n```python\npayload = {\"model\": MODEL, \"messages\": messages,\n           \"temperature\": 0.7,   # 越低越严谨、越高越有创意\n           \"max_tokens\": 500}    # 最多生成多少字，防超长\n```\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 用你的 Key 跑 `companion/phase1/chat_cli.py`，能连续对话 3 轮以上\n- [ ] 故意删掉 `.env` 里 Key 再跑——看到的是友好中文提示 + 退出码 1，**不是 Python 堆栈**\n- [ ] `python phase1\\test_smoke.py` 输出 `OK`（6 项全过）\n- [ ] 能对朋友讲清：大模型**没记忆**，多轮靠\"把整段历史原样发回去\"\n- [ ] 能讲清 `[\"choices\"][0][\"message\"][\"content\"]` 你剥开的是哪几层\n- [ ] 给这条交付物 `git commit` 了一句（Git 已在本站前面装好）\n\n## 常见坑（这一步的高发区）\n\n| 现象 | 根本原因 | 解决 |\n|---|---|---|\n| 401 认证失败 | Key 不对 / `Bearer ` 后面没空格 | 核对 Key 与空格 |\n| 404 | 模型名或 URL 写错 | 回官方文档对 `model` 名 |\n| 429 超额度 | 额度用完/太频繁 | 看余额；`time.sleep(1)` 降频 |\n| 缺 Key 报英文堆栈 | 用了练习版代码 | 换 companion 的健壮版 |\n| 中文乱码 | 编码 | `.py` 保存为 UTF-8 |\n| 觉得 API 贵 | 模型成本高 | 换 DeepSeek/智谱/Kimi 更便宜的模型，代码逻辑不变 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/`，激活 venv，跑 `python phase1\\test_smoke.py` → `OK` 则环境没坏。\n2. 跑 `python phase1\\chat_cli.py` 跟它聊一句，确认线还通。\n3. 看\"验收清单\"，未勾的补上；勾满就进阶段二。\n> 记忆锚：**本步 = \"发一次 HTTP 请求 + 按结构取结果\"，再加\"缺什么报什么\"的健壮化。**\n\n## 下一步：阶段一完成，进入真正的\"知识库\"\n\n你不是在\"调用魔法\"，而是在**发一次 HTTP 请求、按结构取结果**。想通这点，AI 应用开发第一关就打通了——接下来 RAG、Agent 全都是**在这根电话线的前后加环节**。\n\n> 进入阶段二 · `03_阶段二_RAG知识库`。\n> 记得给这一阶段的交付物 `git commit` 并存 GitHub——它是你作品集的第一块积木。"}, {"id": "sec6", "group": "阶段二 · RAG 知识库", "title": "周边扩展地图", "basename": "00_背景_周边扩展地图.md", "markdown": "# 阶段二 · 背景：周围还有谁——grep / SQL / 知识库 到底跟你学的 RAG 什么关系\n\n> 这一站解决什么：你刚学完 RAG，可能冒出疑问——\"grep、SQL、知识库 这些词，跟 RAG 是一回事吗？我要不要全学？\"这一篇不写代码，只帮你**把地图摊开**，看清楚\"你在 AI 检索这条路上站在哪、旁边是谁\"，免得学习时钻进信息茧房。\n> 判断基准：2026-09-19。\n\n---\n\n## 一句话先定位：它们都是\"让 AI 拿到资料\"的几种姿势\n\nRAG、`grep`、`SQL`、知识库问答——本质都在解决同一件事：**让大模型基于资料回答**，只是\"资料长什么样、怎么取\"不同。用一个\"私厨+资料员\"的比方串起来：\n\n| 名字 | 它是什么 | 在\"资料员\"体系里像什么 | 要不要学 |\n|---|---|---|---|\n| **RAG（你刚学的）** | 按\"意思\"找文本块 | 资料员会**语义检索**，按你的意思翻资料柜 | 主线，已学 |\n| **`grep`** | 按\"**字**\"精确找代码/文本 | 资料员会**精确喊名字**：搜一行字、它在哪个文件 | 用 AI 写代码时很常用，顺手就懂，不占课 |\n| **SQL** | 查**结构化表格**数据（数据库） | 资料员会**按列查询**：从表格里筛出符合条件的行 | 要做\"查企业数据的智能体\"时才需深学；对\"AI × 结构化数据\"是加分 |\n| **知识库问答** | 把文档/wiki 建索引给 AI 查 | 它就是 **RAG 最典型的产品形态** | 不用另学——你阶段二做的就是它 |\n\n## 为什么这些\"很老\"的东西没被淘汰，反而还重要\n\n判断\"前不前\"，不看**诞生的年份**，看它**是否被当代主流范式重新用起来**：\n\n- **`grep`**：它本身是几十年的老命令，但现在是\"AI 读写代码库\"时**给智能体做精确检索**的工具——等于被\"Agentic 编程\"重新激活了，所以在 AI 圈一点不过时。\n- **SQL**：SQL 老，但 **Text-to-SQL（让大模型自己生成 SQL 去查库）** 是当下明确的前沿能力。你将来若做大模型查企业数据，它就是支点。\n- **\"LLM wiki / 知识库问答\"**：其实就是 RAG 的核心场景——**你阶段二做的产品，正是它。** 所以你根本没学错，也没学旧。\n\n> 💡 一句话收下：**这些都不是\"要不要内卷的新东西\"，而是\"同一个问题下的不同取数方式\"。** 你用\"这是哪种资料、哪种取法、AI 能用它干嘛\"去看，任何新名词都不再有陌生感。\n\n## 顺手把\"身边那圈\"也想一遍：理解即可，不用深修\n\n除了上面三个，你以后还会碰到这些词——**知道它是干嘛的、和你主线啥关系**就够，别一上来就学：\n\n| 词 | 一句话 | 和你主线的关系 |\n|---|---|---|\n| **微调 Fine-tuning** | 改模型本身的\"性格/知识\" | 和 RAG 互补：RAG 改\"给模型看什么\"、可溯源；微调改\"模型自己\"、适合固定风格 |\n| **Text-to-SQL** | 让大模型自己生成 SQL 去查数据库 | 你做\"靠 AI 查企业数据\"时才显身手，是加分项 |\n| **Embedding 模型选型** | 选哪个向量模型决定检索上限 | 阶段二你已经在用，先够用即可 |\n| **Streaming 流式** | 一个字一个字吐出来，体验像打字机 | 提升手感的优化项 |\n| **多模态 Multimodal** | 模型能看图像、听音频 | 进阶方向，现在不必深耕 |\n| **AI 编程 Agent** | 用 AI 帮你读代码库、写代码 | **你当下就用它学习**，这是趋势本身 |\n\n## 防信息茧房的三件小事（每周约 30 分钟，别忽略）\n\n你学得越专注，越要主动往外看一眼，才不会\"只会做、不知全貌\"。低成本三件：\n\n1. **读官方源头，别只看二手教程**：OpenAI ∕ Anthropic ∕ LangChain/LangGraph 官方博客与文档，最新最准。\n2. **每周跑通一个\"没做过的小 demo\"**：比如一个小 Text-to-SQL、一个小 GraphRAG——把地图上的点变成\"亲手碰过\"。\n3. **把\"还不会的词\"记 3 条一句话**：每周攒几个不懂的名词，主动搜一次、听懂大意，认知边界就外扩一点。\n\n> 核心尺子就一句：**它现在能不能帮你把 AI 应用往前推、或靠近想要的岗位？** 能才学，否则先跳过，别为焦虑买单。这样你既不会茧房，也不会被新名词牵着走。\n\n## 验收：能讲懂才算会\n\n1. 用同一个\"资料员\"比方，说出 `grep`、`SQL`、RAG 三者分别擅长\"怎么取资料\"。\n2. 为什么老命令 `grep` 在 AI 时代反而\"不过时\"？\n3. 当你看到一个新概念（比如\"GraphRAG\"），你会用什么问题去判断它要不要学？\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n本步是\"地图\"，不写代码。复位只需一句话：**凡是名词，用同一把尺子问它——\"它现在是帮我把 AI 应用往前推，还是让我更靠近想要的岗位？\"能答是才学。** 忘词了就回看上面两张表。\n> 记忆锚：**本步 = \"grep=按字找、SQL=按列查、RAG=按意思找，都是让 AI 拿资料的姿势；被今天主流范式重新用起来的，才算不过时。\"**\n\n## 下一步：阶段二到此收官\n\n你已经具备\"让大模型基于你的资料回答 + 知道它怎么运作 + 答得不准就调\"的完整能力。下一阶段，让它**长出手来**——升级成会自己决定\"要不要查、怎么查\"的 Agent。\n\n> 进入阶段三 · `04_阶段三_Agent`。"}, {"id": "sec7", "group": "阶段二 · RAG 知识库", "title": "RAG概念与全流程", "basename": "01_RAG概念与全流程.md", "markdown": "# 阶段二 · 第 1 步：先看地图——RAG 是什么、为什么需要、一整条路怎么走\n\n> 这一站解决什么：阶段一让你能\"请大模型聊天\"。但它只会\"把话说得漂亮\"，**它根本不知道你的世界**——你的课程资料、你公司的文档，它一概没见过，问急了还一本正经地编（叫\"幻觉\"）。这一站出场一个叫 **RAG** 的东西，专门治这两个病：**让它\"先翻你的资料，再开口回答\"。**\n> 判断基准：2026-09-20。这一站先只求\"看懂地图\"，后面几篇再一行行把地图上每段路建起来。\n\n**前置自测（答不上就先回上一篇）**\n1. 你能一句话说出阶段一交付物是什么、它做到了哪一步吗？\n2. \"大模型不知道你的世界\"——它有两个硬伤，还记得是哪两个不？\n3. 你对\"切块\"先有个直觉：为什么不能把整本资料直接喂给大模型？\n\n**站纲（这一站跨 4 小步，先懂再动手）**\n**大模型的两个硬伤 → RAG 是什么（一句话+逐字拆） → 一整条路怎么走（一张图) → 你将做出的东西长啥样**\n\n---\n\n## 第 1 步 先看清：大模型有两个硬伤（面试必答，但你要真懂）\n\n阶段一你学的调用，本质是：**把你给的一段文字发给大模型，它靠着训练时背过的海量资料，一个字一个字\"接着写\"下去。** 站在\"使用\"的肩膀上，它有俩毛病：\n\n1. **幻觉**：它没见过的内容会**一本正经地编**。你问\"我这学期教材第 3 章讲了什么\"——它根本没有那本书，也会煞有介事给你讲一大段，很可能全错。\n2. **知识截止**：它只知道**训练截止那天**之前的东西。今天刚出的数据、你私有的文档，它都不认识。\n\n> 🍳 一句话落地：**大模型\"会说话\"，但\"不知道你的世界\"。** 这就是为什么你不能直接拿它当\"公司客服\"——它没读你们的产品手册。\n>\n> 而你的不满恰好就是人家的机会：**\"能不能让它先翻'我的资料'再回答？\"** —— 能，那套做法就叫 RAG。\n\n## 第 2 步 RAG 是什么：一句话 + 逐字拆开\n\n**RAG（Retrieval-Augmented Generation，检索增强生成）**\n= 回答之前，先从**你自己准备好的资料库**里，**捞出跟这个问题最相关的几段**，再把\"**这几段资料 + 你的问题**\"一起丢给大模型，让它**看着资料回答**。\n\n把名字拆开你就不会忘：\n- **Retrieval 检索** = 先去资料堆里**翻**出最相关的几页。\n- **Augmented 增强** = 在\"生成\"之前，**额外喂给它证据**。\n- **Generation 生成** = 让它照着证据把话说完整。\n\n> 🍳 类比（贯穿整个阶段二）：把场景想成\"**私厨 + 资料员**\"。\n> - 大模型 = 一位**见多识广、但没读过你公司资料的厨师**；\n> - 你的资料库 = 公司**自家资料柜**；\n> - 你问的问题 = 一张**点单**；\n> - RAG = 一位**资料员**：先照着点单去资料柜**翻出最相关的几页**，把\"这几页纸 + 你的问题\"一起递给厨师。\n>\n> 于是厨师不再是凭脑子乱猜，而是**看着那几页纸来给你上菜**——答得准、还有出处。你要记住的全部动作，本质就是这一套\"翻资料→递给厨师\"。\n\n## 第 3 步 一整条路怎么走：一张图看完（画熟它）\n\nRAG 分**两段**：一段\"一次性把资料柜建好\"，一段\"每次回答时去翻\"。\n\n```\n━━━━ 离线准备（做一次就好）━━━━\n你自己的资料（课程/手册/笔记）\n      │  ① 切成一段段（分块）\n      ▼\n一块一块的\"切片\"\n      │  ② 想想每一块讲什么 → 转成一组数字（向量化）\n      ▼\n数字 + 原文字段，一起存进向量库（Chroma）\n     （这一步 = 把文档\"记忆\"进去，以后它才查得到）\n\n━━━━ 在线回答（每次提问都走）━━━━\n用户的问题\n      │  ③ 把问题也转成同样格式的数字（query 向量）\n      ▼\n去向量库找\"和这个问题最像的几块\"\n      │  ④ 取回 top 几块原文（检索）\n      ▼\n把\"这几块原文 + 你的问题\"拼进一段话\n      │  ⑤ 丢给大模型（增强 + 生成）\n      ▼\n带着出处的回答\n```\n\n> 💡 别被这么多步吓到——**绝大多数工具已经帮你做了**。你真正要亲手写的，退化成了三件小事：**怎么切成块(①)→怎么存(②+④)→怎么拼给大模型(⑤)**。而这几件，正好就是本阶段接下来每一篇笔记的主题。先有个地图在脑，后面就不会迷路。\n\n## 第 4 步 你将做出的东西，长什么样（给\"学完目标\"一个具体的脸）\n\n学完阶段二，你要交付的是——**\"读我资料才回答的助手\"**：\n\n```\n你: 我们产品的退货流程是怎样的？\nAI: 根据《客服手册.docx》：先和客户确认原因，\n    再在后台提交退货单，7 个工作日内审核。（见 P23）\n```\n\n它跟阶段一\"闲聊助手\"的差别，就一句话：**它只对着\"你自己的资料\"说话，而且能告诉你出处。** 这就是为什么企业愿意为它掏钱——这不再是\"聊天玩具\"，而是\"公司内部的问答助手\"。\n\n---\n\n## 验收：这一站只考\"懂\"（不背）\n\n1. 为什么不能裸拿大模型当\"公司客服\"？用你自己的话说出那**两个硬伤**。\n2. 用\"资料员 + 私厨\"的比方，给另一个人讲清楚 RAG 是干嘛的。\n3. 在一张纸上画 RAG 全流程，能标出\"哪些是一次性做的、哪些是每次提问都做的\"。\n\n答不上就回上文，别硬猜。\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 把 RAG 跟\"微调\"搞混 | 只记名词 | RAG=给模型看资料（可溯源）；微调=改模型本身（固定风格） |\n| 以为 RAG 要自己写一堆复杂东西 | 被名字唬住 | 你要亲手写的只剩三件：切块→存/查→拼给大模型（细看下面各篇） |\n| 担心\"知识库=要装全套大厂套件\" | 误以为重 | 离线就能先从头学起；真库只在需要时装 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n看上面那张 RAG 流程图：**一张纸画两段（离线准备 / 在线回答）**，能随口说出\"哪几步是一次性做的、哪几步是每次提问都走的\"，就算复位成功。接不上就回看第 3 步。\n> 记忆锚：**本步 = \"大模型有'幻觉+知识截止'两硬伤 → RAG 治它们 → 思想=私厨+资料员：先翻资料再答，答得准还有出处\"。**\n\n## 下一步：你先把地图装在脑子里，我们开始建路\n\n接下来几篇，一步步把地图上的路铺出来：**怎么把一堆文档切成\"一块一块\"(分块) → 怎么转成\"数字\"(向量) → 怎么存起来能查(Chroma) → 怎么串成完整闭环**。\n\n> 下一篇：阶段二 · `02_读取文档与分块.md`"}, {"id": "sec8", "group": "阶段二 · RAG 知识库", "title": "读取文档与分块", "basename": "02_读取文档与分块.md", "markdown": "# 阶段二 · 第 2 步：给资料\"切菜\"——读取文档 + 分块\n\n> 这一站解决什么：RAG 的第一步，是把你的原始资料变成\"一块一块能查的小切片\"。但**大模型和检索系统都啃不动一整本 PDF**——它们需要一个\"切得刚刚好\"的粒度。这一站就做这件事：**把文件读进来，切成合适大小的块。**\n> 判断基准：2026-09-20。库名会变，但\"先读、再切、切得合适的原理\"永不过时。\n> 交付物对应：`companion/phase2/chunker.py`（本文讲的切分，它已实现并带测试）。\n\n**前置自测（答不上就先回上一站）**\n1. 为什么不能把整本文档直接喂给大模型？（两个原因）\n2. \"切块\"要留一点重叠，是为了防住什么？\n3. 还记得上一个教\"朴素召回度量\"时踩的中文坑吗？（切分相关）\n\n**站纲（跨 3 小步）**\n**为什么不能整篇喂 → 把文件读进来 → 切成又小又刚好的一块块（附判断\"切得好不好\"的办法）**\n\n---\n\n## 第 1 步 先想明白：为什么不能把整份文档一把抓？\n\n直觉上你会想\"直接让大模型读整本文档不就行了\"。**不行，原因有二**：\n\n1. **装不下**：文档可能比模型一次能\"记住\"的上下文还长，塞不下。\n2. **不对题**：就算塞得下，你要回答的往往是**其中一小段**——把整本都喂进去，有用的被淹没在噪声里，反而答不准。\n\n> 🍳 所以我们要\"切菜\"：把大块的资料，切成**一小块一小块**。后面检索时只需挑出\"最像的那几块\"端给大模型。\n> 关键正是**切得\"刚刚好\"**——这决定后面查得准不准。\n\n## 第 2 步 把资料读进 Python\n\n文件各自用不同的库打开（它们都是\"打开对应格式的工具箱\"，装好 `import` 即可用）：\n\n```python\n# PDF（最常见）\nimport pdfplumber\nwith pdfplumber.open(\"手册.pdf\") as pdf:\n    text = \"\\n\".join(p.extract_text() for p in pdf.pages)\n\n# Word 文档\nfrom docx import Document\ndoc = Document(\"说明.docx\")\ntext = \"\\n\".join(p.text for p in doc.paragraphs)\n\n# 纯文本 / Markdown\ntext = open(\"笔记.md\", encoding=\"utf-8\").read()\n```\n\n【本质一行】**不同类型的文件=不同格式的\"壳\"，只是打开方式不同；目的都一样：把里面的文字提取成最普通的文本 `text`。** 后面所有操作，都是对这个 `text` 动手。\n\n> 提示：库名/导入写法官方偶尔会变，装了报错就按官方文档对齐，思路不变。\n\n## 第 3 步 把 text 切成\"一块一块\"（分块）\n\n最简单的切法思路有两种，实际常结合用：\n\n**分层 A：先按\"自然段落\"切开** —— 一段段文字往往自带语义边界：\n\n```python\nparagraphs = [p.strip() for p in text.split(\"\\n\\n\") if p.strip()]\n```\n\n**分层 B：再按\"长度上限 + 有一点重叠\"切** —— 单段太长就再拆小，并在边界处**留一点重叠**避免把一句话拦腰截断：\n\n```python\ndef chunk_by_chars(text, size=400, overlap=80):\n    chunks = []\n    start = 0\n    while start < len(text):\n        chunks.append(text[start : start + size])\n        start += size - overlap      # 往后挪 size - overlap，保证和前一块重迭\n    return chunks\n```\n\n> 🍳 把这个想象成**切菜**：paragraphs 是\"按自然纹理(顺着叶脉)撕开\"，chunk_by_chars 是\"太长就补一刀\"。**重叠那 80 个字，就像\"接缝处多留一点\"，保证话不被人为腰斩。**\n\n**怎么判断\"切得好不好\"？** 一个偷懒但有效的自检：随机抽几块，**看每块读起来是不是意思完整的一段话**。如果一块经常才说半句话就被切断（比如\"退货流程如下：1、……\"被切成两半卡在中间），说明块大小太小或重叠不够，调大即可。\n\n> 💡 记两个经验值（不是死规矩）：中文块大概 **300–600 字**比较稳；**重叠 50–100 字**防止断句。等你后面学了\"优化\"，还会按效果回来调它。\n\n### 训练营增量：你上面这套，`companion/phase2/chunker.py` 已经做成更完整、可测的版本\n\n不让你直接 copy，但值得看它怎么把\"切分\"做成**可测、可选、可靠**——它提供 **三档策略 + overlap + 一组通过了的测试**：\n\n- **按段落**（`split_blocks`）：最稳的一层分段，按空行切、去空块。\n- **按固定字数 + 重叠**（`chunk_by_fixed_size`）：超长块按 `size` 切、相邻带 `overlap`，**关键词跨块不丢**——就是上面 `chunk_by_chars` 的正规版。\n- **按句子**（`chunk_by_sentence`）：对问答型资料更友好，**一句不拆**。\n- **`keyword_overlap(query, doc)`**：没向量模型也能用的朴素\"召回\"粗筛（**英文按词、中文按字**——按空白分词对中文是全失效的，这是真坑）。\n\n验证它：\n\n```shell\npython phase2\\test_chunker.py    # 6 项测试；含\"关键词跨块不丢\"\"句子不切断\"\"相关块分更高\"\n```\n\n> 🔬 训练营要求：**对照 `chunker.py` 理解每个函数为何这么写**，尤其看 `test_chunker.py` 用哪些用例\"钉死\"了正确行为——这才叫\"可靠\"，不是\"碰巧能跑\"。PDF 这类**容易出错的文档解析**，坑见下方\"常见坑\"。\n\n---\n\n## 这一步的产出：把你的资料变成\"一摞能查的切片\"\n\n做一次就够：遍历整个资料文件夹，把每份文档读进来 → 用 `chunker.py` 切成块 → 随机抽几块打印，看切得整不整 → 调到你\"读着都顺\"。块先暂存在一个列表里（下一站把它变成数字）。\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 用 `pdfplumber`/`docx` 成功把至少一份真实资料提取成 `text`（PDF 乱码也别灰心，见常见坑）\n- [ ] 跑 `python phase2\\test_chunker.py`，输出 `OK`（6 项）\n- [ ] 用 `chunker.py` 的 `chunk()` 对你的资料切块，随机抽 3 块读出来，**都是意思完整的话**\n- [ ] 能讲清：三种切分策略各适合什么？`overlap` 去掉会怎样？\n- [ ] 能讲清为什么\"按空白分词对中文失效\"，中文该怎么处理\n- [ ] 给本步交付物 `git commit` 了一句\n\n> 记忆一句话：**\"切得刚刚好\"不是玄学 = 不同策略 + 重叠 + 一眼自检\"每块是完整的话\"。**\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| PDF 提取出中文乱码/空页 | PDF 是图片扫描件或编码怪 | 换 `pdfplumber` 提文本；扫描件要靠 OCR（临时先跳过） |\n| 检索到一半块、答案被切断 | 块太小 / overlap=0 | 调大 `size` 到 300–600、`overlap` 50–100 |\n| 召回评估全 0、无区分度 | 对中文按空白分词=分成了一个整词 | 中文按字/用 jieba 分词（companion 已示范） |\n| Word 表格丢了 | `docx` 只取 `.paragraphs` | 要取表格用 `doc.tables` 二次遍历 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/phase2/chunker.py`，扫一眼三个切分函数——看得懂=复位成功。\n2. 跑 `python phase2\\test_chunker.py` → `OK` 则环境/代码没坏。\n3. 看\"验收清单\"，没勾的补上；勾满就进下一步。\n> 记忆锚：**本步 = \"文档解析 + 多策略分块 + 能自检切得好不好\"，切分决策直接影响检索准不准。**\n\n## 下一步：光有文字块还不够——检索要认\"数字\"\n\n切好的块现在只是\"文字\"，而计算机判断\"两段文字像不像\"，靠的不是肉眼，而是**把它们都变成一组数字（向量）**，再比远近。下一站就讲这道\"变数字\"的工序。\n\n> 下一篇：阶段二 · `03_词向量与检索原理.md`"}, {"id": "sec9", "group": "阶段二 · RAG 知识库", "title": "词向量与检索原理", "basename": "03_词向量与检索原理.md", "markdown": "# 阶段二 · 第 3 步：给每块菜做\"口味指纹\"——词向量与检索原理\n\n> 这一站解决什么：现在你把资料切成一摞\"文字块\"了，但**电脑没法用肉眼判断\"哪两句话意思接近\"**。检索要的就是\"找最像的几块\"。所以这一步的关键动作是：**把每个文字块和一问你题，都变成一组\"数字\"，让\"像不像\"变成\"数一数远不远\"。** 这组数字就叫**向量（Vector）**。\n> 判断基准：2026-09-20。这一步是 RAG 的\"灵魂\"，也最值得你挖底层——懂了它，后面 Chroma 就是个\"替你算远近\"的工具箱。\n> 交付物对应：`companion/phase2/search.py`（余弦、伪向量、召回评估——离线先能测）。\n\n**前置自测（答不上就先回上一篇）**\n1. 为什么要把文字块变成\"向量\"来比较？（一句话）\n2. 你手上一堆\"带指纹的块\"之后要存进什么？\n3. 上一站 `chunk()` 之后，你想过怎么判断\"检索准不准\"吗？（下面会给你答案）\n\n**站纲（跨 3 小步）**\n**为什么文字要变数字 → 这组数字怎么来（Embedding）怎么比远近 → 用代码请出一个向量**\n\n---\n\n## 第 1 步 为什么非得把文字变成\"数字\"？\n\n真相很朴素：**电脑要\"比较\"，只会比数字，不会比文字**。\"苹果 vs 香蕉\"它没法直接说\"像不像\"；但如果说\"苹果=[3,1] 香蕉=[3,5] 汽车=[20,-2]\"，一量距离就知道**苹果离香蕉近、离汽车远**。\n\n> 🍳 接住上一站的比方：每个文字块 = 一道菜；**向量 = 这道菜的\"口味指纹\"（一串数字）**。\n> 菜名不同没关系，只要\"口味指纹\"相近，资料员就知道\"这两道菜差不多、可以端给厨师一起参考\"。\n\n## 第 2 步 这组数字怎么来、怎么比远近\n\n**① 数字怎么来（Embedding 词嵌入）**：你请一个\"翻译官\"（叫 **Embedding 模型**）做一次转换：\n\n```\n\"苹果是什么水果\"   →翻译→  [0.32, -0.18, 0.77, …]   （通常几百上千个数字）\n\"香蕉有什么营养\"   →翻译→  [0.35, -0.15, 0.81, …]   （看起来和上面很像）\n\"北京今天限行吗\"   →翻译→  [-0.6, 0.4, -0.2, …]     （明显不一样）\n```\n\n关键是这门\"翻译\"本领是**从海量语言里学出来的**——它把\"意思接近的词\"翻译成\"位置也互相靠近\"的数字。所以语义越像，数字也越像。**这就是检索的底气，不用背，记住结论即可。**\n\n**② 怎么比远近（余弦相似度，人话版）**：两个向量\"像不像\"，用一个叫**余弦相似度**的数衡量：越接近 1 越像，越接近 0 越不像。你**完全不用手算**——这是检索工具帮你算的。你只需要懂这个思想：**\"像不像\" = \"这串数字有多近\"**。\n\n## 第 3 步 用代码请出一个\"向量\"（最小演示）\n\n跟上一步调大模型 API 是同一招：调一个 **Embedding API**，传入文字，返回一串数字。\n\n```python\nimport requests, os\nfrom dotenv import load_dotenv\nload_dotenv()\n\n# 每家模型的名字/地址会不同，以你所选平台的官方文档为准\nEMBED_URL = os.getenv(\"EMBED_URL\")            # 例如 OpenAI 的 /v1/embeddings\nEMBED_KEY = os.getenv(\"EMBED_KEY\")\n\ndef embed(text):\n    resp = requests.post(EMBED_URL,\n        headers={\"Authorization\": f\"Bearer {EMBED_KEY}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"text-embedding-3-small\",   # Embedding 模型名，按平台改\n              \"input\": text})\n    return resp.json()[\"data\"][0][\"embedding\"]     # 一串数字\n\nv = embed(\"苹果是什么水果\")\nprint(len(v))        # 数字的个数，比如 1536\nprint(v[:5])         # 一串浮点数：这道菜的\"口味指纹\"\n```\n\n跑出来那一大串数字别慌——它**不用你读懂，只用来比远近**。\n\n> 换个注意点：Embedding 模型和你阶段一的\"对话模型\"是**两种不同的东西**。对话生孩子说\"话\"，Embedding 只负责把文字变成\"数字指纹\"。别搞混，也不用背，记住\"各有分工\"即可。\n\n### 训练营增量：先看懂\"比远近\"和\"召回评估\"，离线就能测（不用等 Key）\n\n真实检索要真 embedding + 向量库（要网络/Key）。但两件最值钱的事——\"**怎么比远近**\"和\"**怎么评估召回准不准**\"——不该等那些装好才学。`companion/phase2/search.py` 用**确定性伪向量**把它们落地并测试通过：\n\n```python\nfrom search import cosine_similarity, demo_embed, DummyRetriever, eval_recall\n\n# ① 余弦：像不像 = 这串数字有多近（同向量=1，正交≈0）\nprint(cosine_similarity(demo_embed(\"退货流程\"), demo_embed(\"退货流程\")))  # ~1.0\n\n# ② 一个能离线的\"小检索器\"：存文档 → 按余弦取 top-k\nr = DummyRetriever()\nr.add([\"鸡蛋和西红柿可以同炒\", \"北京今天限行尾号 3\", \"退货需先提交工单\"])\nprint(r.query(\"退货流程怎么走\", k=2))\n\n# ③ 召回评估：top-k 里相关块被召回了几个 → 这就是\"召回率\"的起点\nprint(eval_recall(r, \"退货\", relevant={2}, k=1))\n```\n\n> 🔬 embedding **选型**方向（不必现在定）：质量 vs 成本 vs 多语言。中文语料优先挑**中文表现好的开源/API 模型**；决定检索上限。别一上来追贵的——先用便宜的跑通，后面再按\"召回率\"决定要不要换。\n> 训练营要求：**把 `search.py` 和 `test_search.py` 读一遍**，尤其看 `eval_recall` 怎么算召回率。你上真 embedding 后，检索管线逻辑一行不改——这就是\"先把评估能力搭起来\"的价值。\n\n### 本地跑可选（想省钱练手）\n\n不想花钱调 API，也可以装开源本地模型（如 `sentence-transformers`），一行生成向量。后面\"完整闭环\"时我给你一个\"能用 API 也行、本地也行\"的写法，先知道有这条路即可。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 跑 `python phase2\\test_search.py` → `OK`（7 项：余弦/伪向量/排序/召回率）\n- [ ] 用 `search.py` 的 `DummyRetriever` 存 5 条资料，问一个问题，眼睛看它 top-k 排得对不对\n- [ ] 能对朋友讲清：**what是向量、什么把\"像不像\"变成\"远不远\"**、余弦≈1 是很像还是很不像\n- [ ] 能讲清 `eval_recall` 算什么、为什么要\"先能测\"再说优化\n- [ ] 能讲清 Embedding 模型和\"对话大模型\"不是一回事\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 余弦/检索结果\"都是 0 分没区分度\" | 对中文按空白分词 / 伪向量维度过低 | 用 `search.py` 对中文**按字**切 + 维度≥256 |\n| 想把 Embedding 模型当\"对话模型\"用 | 两种模型分工不同 | 对话=生成文字；Embedding=变数字指纹 |\n| 一上来就追贵的 embedding | 先有优先 | 先用便宜跑通，按召回率再决定换不换 |\n| 只看\"好像更像了\"就说检索好 | 没量化 | 用 `eval_recall` 记一个数字 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 跑 `python phase2\\test_search.py` → `OK` 则代码没坏。\n2. 打开 `search.py` 看 `cosine_similarity` 和 `eval_recall`——看得懂=复位成功。\n3. 看\"验收清单\"补勾，勾满进下一步。\n> 记忆锚：**本步 = \"向量(数字指纹) + 余弦比远近 + 召回评估先能测\"。**\n\n## 下一步：向量有了，得放进一个\"能一秒找人\"的仓库\n\n你手上现在有\"很多块 + 各自的口味指纹\"。下一个问题很现实：**几千块呢，总不能每问一次都跟全库逐个比一遍吧？** 答案是你需要一个**向量数据库**——它专门干\"给你一个问题指纹，飞快返回最像的前几条\"。下一站认识它。\n\n> 下一篇：阶段二 · `04_向量数据库Chroma实践.md`"}, {"id": "sec10", "group": "阶段二 · RAG 知识库", "title": "向量数据库Chroma实践", "basename": "04_向量数据库Chroma实践.md", "markdown": "# 阶段二 · 第 4 步：建一个\"一秒找人\"的仓库——向量数据库 Chroma\n\n> 这一站解决什么：你有了几百、几千块\"带指纹的文字块\"。如果每次提问都**从头到尾跟全库逐条比一遍**，慢且笨。向量数据库（我们用 **Chroma**）就是那个专门\"**给我一个问题指纹，秒回最像的前几条**\"而生的仓库。\n> 判断基准：2026-09-20。库名（Chroma 或它的竞品）会变、API 会迭代，但\"**存向量 → 查最近邻**\"的思想永不变。\n> 交付物对应：`companion/phase2/search.py` 里的 `DummyRetriever`（先用它把\"存→查\"逻辑离线测通，真 Chroma 等你接上真 embedding 时一换即可）。\n\n**前置自测（答不上就先回上一篇）**\n1. 每个文字块和每个问题，最后都被变成了什么？（一个词）\n2. 两个东西\"像不像\"，用什么数来衡量？越接近几越像？\n3. 真 Chroma 检索需要真 embedding + 网络/Key——那一件\"最值钱\"\"不用等 Key 也能学\"的事是什么？（上一站已埋）\n\n**站纲（跨 3 小步）**\n**为什么需要\"专门\"的仓库 → 认识三个动作(建/存/查) → 先用离线替身跑通\"放进去再查出来\"**\n\n---\n\n## 第 1 步 为什么不能就用普通\"数组\"硬搜？\n\n理论上你把\"块+指纹\"塞进一个 Python 列表、每次遍历也算得出——但那是**逐条全比**，几千条还行，上万条就慢得没法用。向量数据库的过人之处，是内部用了一套**近似最近邻**的索引结构，**不用全比**，就能在毫秒级告诉你\"跟这个指纹最像的前 k 条在哪儿\"。\n\n> 🍳 类比：普通列表像\"整柜挨个翻\"；向量数据库像\"给每种口味建了分区索引\"，你按理直近的片区去找，快得多。**你只需要把东西存进去、把问题丢进去，剩下的\"怎么快\"它替你解决了。**\n\n## 第 2 步 Chroma 的三板斧：建库 → 塞入 → 查询\n\n```python\nimport chromadb\n\nclient = chromadb.PersistentClient(path=\"./kb\")     # 1) 建库：把一个本地文件夹当仓库\ncollection = client.get_or_create_collection(\"docs\") #     （命名一个\"柜子\"）\n\n# 2) 塞入：每条 = id + 原文字块 + 它的向量\nchunks = [\"鸡蛋和西红柿可以同炒\", \"北京今天限行尾号 3\", \"退货需先提交工单\"]\nvecs   = [embed(c) for c in chunks]                 # embed 见上一站\n\ncollection.add(\n    ids=[f\"c{i}\" for i in range(len(chunks))],\n    documents=chunks,        # 存原文（供取回后用）\n    embeddings=vecs,         # 存向量（供检索用）\n)\n\n# 3) 查询：给一个问题指纹，取回最像的 2 条\nres = collection.query(query_embeddings=[embed(\"西红柿和什么炒好吃\")], n_results=2)\nprint(res[\"documents\"][0])   # 最像的原文\n```\n\n> 💡 记住存取两个\"密码\"：**放的是 `embeddings`(指纹) 和 `documents`(原文) 一起放；查的时候只给 `query_embeddings`(问题指纹)，它回你 `documents`(最像的原文)。** 存\"两层\"、查\"一层\"，原文取回当证据。\n\n（Chroma 的调用写法会随版本变化，装好后以 `pip show chromadb` 对应版本文档为准，核心三动作不变。）\n\n### 训练营增量：先别急着装 Chroma——用离线替身把这三板斧看懂、测通\n\n真 Chroma + 真 embedding 要装包、要网络/Key，上手有摩擦。但\"**建库→塞→查**\"这套动作，上一站的 `DummyRetriever` 已经能离线替你演示一遍，且逻辑与将来接真 Chroma **一模一样**：\n\n```python\nfrom search import DummyRetriever\n\n# 建库+塞入：add 一段段原文（内部自动向量化）\nkb = DummyRetriever()\nkb.add([\"鸡蛋和西红柿可以同炒\", \"北京今天限行尾号 3\", \"退货需先提交工单\"])\n\n# 查询：给一个问题，回最像的前 2 条（含相似度，score=True）\nfor idx, doc, score in kb.query(\"西红柿怎么炒\", k=2, score=True):\n    print(idx, round(score, 3), doc)\n```\n\n> 🔬 呼应上一篇的验收：真 Chroma 只是\"换了更快的库 + 更真的向量\"，**查询管线这段代码你一行都不用改**。这里先把\"存两层、查一层、取回原文当证据\"的概念钉死——这才是 04 的真正目的，库是工具，思想不变。\n> 训练营要求：真 Chroma 你已经读过上面的代码了。把 `search.py` 的 `DummyRetriever.add/query` 读一遍，跑通上面这段\"放进去再查出来\"，再决定要不要现在装 chromadb（可以等第 5 步闭环演示一起装）。\n\n## 第 3 步 亲自验证\"它真的能语义找\"（真环境下的爽点）\n\n最爽的验证不是找一模一样的，而是**找长得像但词语不同的**：\n\n```\n存入: \"鸡蛋和西红柿可以同炒\"\n查询: \"番茄跟蛋一起煮可以吗\"\n结果: 返回了上面那句 ✓\n```\n\n> 为什么✓？（真 embedding 下）因为 Embedding 把\"西红柿/番茄\"\"同炒/一起煮\"这些**意思相近的词翻译到了相近的位置**——这正是 RAG 比\"搜关键词\"厉害的地方：它按**意思**找，不只是按**字**找。\n> ⚠️ 注意：离线 `DummyRetriever` 的伪向量**没有语义**，\"番茄≈西红柿\"它认不出来（它只是按字重合）。所以\"按意思找\"这条要等你接真 embedding 后在 Chroma 里验证——两者进度不同，别用伪向量去验证\"语义\"，那是真刀的活。\n\n---\n\n## 这一步的产出：一个\"能按意思找人\"的本地资料库\n\n把上一站切的块全部 `add` 进 Chroma（一次性；或先用 `DummyRetriever` 离线跑同款动作）。之后你问任何问题，它都能秒回\"最像的几块原文\"。**这时你再回头看你画的 RAG 地图——\"存进并查询 Chroma\"这两步，你完成了（离线版）或即将完成（真环境版）。**\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 跑 `python phase2\\test_search.py`，输出 `OK`（核心检索能力离线受保护）\n- [ ] 用 `search.py` 的 `DummyRetriever`，把 5 条资料\"建库→塞入→查询\"，能按相关度排回最像的前几条\n- [ ] 读得懂 Chroma 三板斧代码：`add` 时存了哪两层？`query` 时只给什么、回你什么？\n- [ ] 能对朋友讲清：向量数据库和\"Python 列表线性搜\"的本质差别（为什么快，不用报算法名）\n- [ ] 能讲清：为什么\"按意思找\"该在真 embedding 下验证，而不是在 `DummyRetriever` 里\n- [ ] 给本步交付物 `git commit` 了一句\n\n> 记忆一句话：**\"存两层（指纹+原文）、查一层（问题指纹）、回最像几块原文当证据\"——向量库里就这三件事，库名随便换。**\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 想用伪向量验证\"番茄≈西红柿\"的语义 | `DummyRetriever` 无语义，只按字重合 | 语义验证放到真 embedding + Chroma；伪向量只测\"管线/CB\" |\n| 版本变了代码报错 | Chroma API 迭代快 | 以 `pip show chromadb` 对应版本为准，三动作思想不变 |\n| 一上来就装一堆向量库 | 工具先行、思想没通 | 先用 `DummyRetriever` 离线跑通\"存→查\"；需要真语义再装 |\n| 库建在临时路径，重启就没了 | 忘了用 `PersistentClient(path=...)` | 加一个持久化路径参数，别用纯内存 `EphemeralClient` 存长期资料 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/phase2/search.py`，扫一眼 `DummyRetriever.add/query`——看得懂=复位成功。\n2. 跑 `python phase2\\test_search.py` → `OK` 则环境/代码没坏。\n3. 看\"验收清单\"，没勾的补上；勾满就进下一步。\n> 记忆锚：**本步 = \"建库→塞入→查询\"，思想是\"存两层、查一层、取回原文当证据\"；库里没有\"语义\"，语义在 embedding 里。**\n\n## 下一步：把前面所有零件串成一根完整的线\n\n现在你零件都到齐了：**切块 ✓ 向量 ✓ 存/查 ✓**。下一站把它们 + 阶段一\"请大模型\"，拼成一个完整的 `ask()`——问你一个问题，它自动\"检索 → 拼资料 → 请大模型 → 带出处地回答\"。那就是阶段二的交付物。\n\n> 下一篇：阶段二 · `05_完整RAG闭环.md`"}, {"id": "sec11", "group": "阶段二 · RAG 知识库", "title": "完整RAG闭环", "basename": "05_完整RAG闭环.md", "markdown": "# 阶段二 · 第 5 步：把零件串成一根线——完整 RAG 闭环（阶段二交付物）\n\n> 这一站解决什么：前四站你把\"切块、向量、存/查、请大模型\"各自备好，但还**没连成一根线**。这一站把它们拼成一个完整的 `ask(query)`——你问一句，它自动\"检索 → 拼资料 → 请大模型 → 带出处地回答\"。**这一步跑通，你的\"读我资料才回答的助手\"就诞生了。**\n> 判断基准：2026-09-20。这就是**贯穿作品的第一个里程碑**（企业客服知识库的开端）。\n> 交付物对应：`companion/phase2/ragbot.py`（三段式闭环，离线可测）＋ 真环境版 `ask()`（下文代码）。\n\n**前置自测（答不上就先回上一篇）**\n1. RAG 在线回答的 4 步是什么？\"增强\"到底发生在哪一步？（关键词：拼）\n2. 检索\"取回原文\"是为了什么？（答完大模型用的）\n3. 你手上现在有哪些零件？切块/向量/库分别在哪一步学的？\n\n**站纲（跨 3 小步）**\n**把 RAG 地图翻译成一个 `ask()` → 用一个可跑、可测的离线闭环钉住它 → 顺手把作品推上 GitHub（你的名片）**\n\n---\n\n## 第 1 步 把地图翻译成一件事：一个 `ask()` 函数\n\n还记得 RAG 地图吗？在线回答只有 4 步：**编码问题 → 取最像的几块 → 把\"资料+问题\"拼起来 → 请大模型看着资料答**。恰好每步你都学过了。我们把它写成一个函数 `ask(query)`：\n\n```python\ndef ask(query):\n    # ① 把问题变成\"指纹\"\n    q_vec = embed(query)\n\n    # ② 去 Chroma 取最像的前 3 块原文（资料员的活）\n    hits = collection.query(query_embeddings=[q_vec], n_results=3)\n    context = \"\\n\\n\".join(hits[\"documents\"][0])\n\n    # ③ 把\"资料 + 问题\"拼成一段话（第③步就是\"增强\"，RAG 唯一的魔法）\n    prompt = f\"只用下面资料回答；资料里没有就说不知道；附出处编号。\\n\\n资料：\\n{context}\\n\\n问题：{query}\"\n\n    # ④ 请大模型看着资料回答（阶段一的电话线）\n    return chat(prompt)   # chat() 就是你阶段一写的那个调用函数\n```\n\n> 【本质一行】**RAG 的\"增强\"就发生在第 ③ 步**——你只是把检索到的原文**拼到了问题前面**，让大模型\"看着证据说话\"。就这么简单，不要想象得太玄。③ 这一行的质量，决定了你的助手是\"背书的复读机\"还是\"真的在看资料\"。\n\n## 第 2 步 先跑通一个\"能测\"的版本：`ragbot.py`（真环境版见下）\n\n真闭环要 chromadb + 真 embedding + 网络/Key，上手有摩擦。但闭环的**骨架（切块→检索→增强→生成）**是无辜的——不该等 Key 装好才验。`companion/phase2/ragbot.py` 用 `chunker`+`DummyRetriever`+一个**可插拔的 llm**，把整个闭环离线跑通：\n\n```python\nfrom ragbot import RagBot\n\nbot = RagBot(top_k=3)\nn = bot.index_texts([\"你的几段资料原文…\"])   # 内部：切块 → 入库\nprint(n, \"块\")\n\n# 离线模式（没给 llm）：只展示\"检索到啥、将拼给大模型的 prompt\"，不臆造答案\nprint(bot.ask(\"退货流程是什么？\"))\n\n# 真闭环模式：把阶段一的 chat() 塞进去，它就真\"看着资料\"答了\nbot.ask(\"退货流程是什么？\", llm=my_chat)      # my_chat = 你阶段一写的 chat()\n```\n\n> 🔬 为什么值钱：**上生产只需换 3 处**（检索器→Chroma、向量→真 embedding、llm→你的 chat()），骨架一行不改——这被写进了 `ragbot.py` 的 `PRODUCTION_SWAP` 注释，也被测试钉死了。这就是\"把可靠性先测通\"：离线版能测，真环境只是换真零件。\n> 训练营要求：**读一遍 `ragbot.py` 的 `build_prompt`**，它是\"增强唯一发生处\"。再看 `test_ragbot.py` 里怎么断言\"命中的原文真的拼进了 prompt\"——这是它不像\"背书的复读机\"的证据。跑：\n>\n> ```shell\n> python phase2\\test_ragbot.py    # 4 项：检索/增强/空库优雅降级/可插拔 llm\n> ```\n\n### 真环境版（把四站零件填进去，能直接跑）\n\n```python\nimport requests, os\nfrom dotenv import load_dotenv\nimport chromadb\nload_dotenv()\n\n# ---- 零件 1：Embedding ——（见第 3、4 步）\ndef embed(text):\n    resp = requests.post(os.getenv(\"EMBED_URL\"),\n        headers={\"Authorization\": f\"Bearer {os.getenv('EMBED_KEY')}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"text-embedding-3-small\", \"input\": text})\n    return resp.json()[\"data\"][0][\"embedding\"]\n\n# ---- 零件 2：对话大模型 ——（见阶段一）\ndef chat(prompt):\n    resp = requests.post(\"https://api.deepseek.com/chat/completions\",\n        headers={\"Authorization\": f\"Bearer {os.getenv('DEEPSEEK_API_KEY')}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"deepseek-chat\", \"messages\": [\n            {\"role\": \"system\", \"content\": \"你是资料问答助手\"},\n            {\"role\": \"user\", \"content\": prompt}]})\n    return resp.json()[\"choices\"][0][\"message\"][\"content\"]\n\n# ---- 零件 3：仓库 ——（见第 4 步）\nclient = chromadb.PersistentClient(path=\"./kb\")\ncollection = client.get_or_create_collection(\"docs\")\n\n# ---- 组装：ask()\ndef ask(query):\n    hits = collection.query(query_embeddings=[embed(query)], n_results=3)\n    context = \"\\n\\n\".join(hits[\"documents\"][0])\n    prompt = (f\"只用下面资料回答；资料没有就说不知道，别编。\\n\\n\"\n              f\"资料：\\n{context}\\n\\n问题：{query}\")\n    return chat(prompt)\n\n# ---- 用起来\nprint(ask(\"公司的退货流程是什么？\"))\n```\n\n> 也许这个问法直接下载它仍能答（因为大模型可能真下载过某些资料）——**验证它\"真的在读你的资料\"**，用一个最狠的问法：\n> > \"请只引用我们手册第 X 页的原话，回答……\" —— 它得讲得出你的**专有细节**才算真在翻你的资料。\n\n## 第 3 步 顺手把作品推上 GitHub（你是自学者，这是你的名片）\n\n> 阶段一结尾预告过\"用到 Git 时顺带讲\"，现在正好。Git 就三件事，边做边记：\n\n```shell\ngit init                        # 1) 在这个文件夹里开一个\"版本仓\"\ngit add .                        # 2) 把当前所有改动装进\"待提交区\"\ngit commit -m \"完成RAG问答助手\"   # 3) 拍一张快照存下来\n```\n\n然后去 GitHub 建一个空仓库，把本地的推上去：\n```shell\ngit remote add origin 你的仓库地址\ngit push -u origin main\n```\n> ⚠️ 别忘了 `.env` 不该上传——把 `.env` 加进一个叫 `.gitignore` 的文件（内容就一行 `.env`），它就会被 Git 自动忽略，Key 不会泄露。\n\n**为什么现在就必须推**：你是自学者、谈资少，GitHub 上\"一个能 clone 下来直接跑、跑不了还有 CI 报错、带 README 讲原理\"的仓库，就是你求职时最硬的名片。从现在起，**每完成一小步就 push 一次**，比什么都值。而且这正是贯穿全营的**\"演进契约\"**——仓库里有更新日志，你的成长是看得见的脚印。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 跑 `python phase2\\test_ragbot.py`，输出 `OK`（4 项：离线闭环受保护）\n- [ ] 读一遍 `ragbot.py` 的 `build_prompt`，能指出\"增强唯一发生处\"是哪一行，为什么\n- [ ] 能讲清 `PRODUCTION_SWAP`：上生产只需换哪 3 处，骨架为什么不用改\n- [ ] （真环境版，可选）接上 Key + Chroma，跑通 `ask(\"你的资料问题\")` 并拿到\"带出处\"的回答\n- [ ] 用一个\"引手册原话\"的狠问法，验证它真在读你的资料，而非背诵\n- [ ] 建了 `.gitignore` 并确认 `.env` 没被 push；`git push` 推上 GitHub\n- [ ] 能给朋友完整讲一遍 `ask()` 四步，每一步对应\"资料员/私厨/点单\"类比里的谁\n- [ ] 在手册 `00_总览` 的贯穿作品记录里，勾掉\"里程碑一：读我资料才回答的客服助手\"\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| Key 被 push 上 GitHub | 没建 `.gitignore` | 建 `.gitignore` 写 `.env`；已泄露就立刻去平台吊销换新 |\n| 真 Chroma 装不好/报错 | API 版本迭代、依赖冲突 | 先用 `ragbot.py` 离线跑通闭环；真库放进独立 venv，以官方文档为准 |\n| \"增强\"写错位置 | 把原文拼错地方/没拼 | 记住第③步 `context` 必须塞进 prompt；用 `test_prompt_really_contains_evidence` 兜底 |\n| 空库或没命中还硬编答案 | 没做原则校验 | `ragbot.py` 里空库直接\"说不知道\"，绝不臆造——这是防幻觉的底 |\n| 改了检索逻辑要连坐改 prompt | 三段耦合太紧 | 骨架三段（检索/增强/生成）分开写，改一处不连累另两处 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/phase2/ragbot.py`，扫一眼 `ask()` 四步——看得懂=复位成功。\n2. 跑 `python phase2\\test_ragbot.py` → `OK` 则闭环没坏。\n3. 看\"验收清单\"，没勾的补上；`git push` 后再进下一步。\n> 记忆锚：**本步 = \"检索→拼资料→请大模型→带出处答\"，增强唯一发生在'把检索原文拼进 prompt'那一行；作品已上 GitHub。**\n\n## 下一步：它\"会了\"，但不一定\"准\"——还能更好\n\n现在的助手能跑、能带出处，但如果答得弱（检索到废话、或不肯老实照着资料说），别急——下一站就是\"它答得不对时怎么优化\"，以及为阶段四的\"效果评测\"埋线。\n\n> 下一篇：阶段二 · `06_RAG效果优化.md`"}, {"id": "sec12", "group": "阶段二 · RAG 知识库", "title": "RAG效果优化", "basename": "06_RAG效果优化.md", "markdown": "# 阶段二 · 第 6 步：它\"会了\"但\"准吗\"——RAG 效果优化\n\n> 这一站解决什么：你的助手能跑了。但当它**答得不对**时，你要知道该调哪里——而不是盲改代码。这一站给你一套\"先说结论再动手\"的诊断思路：**答得不对，多半是\"没找到对的资料\"或\"没照着资料说\"，分清楚再对症下药。**\n> 判断基准：2026-09-20。优化没有银弹，靠的是\"定位环节 + 从便宜到贵逐级试 + 每次改都记效果\"。\n> 交付物对应：这一站**没有新代码**，因为它给的是\"怎么判断要改哪、按什么顺序改\"的方法论；已有的 `search.py`（召回评估）正是你量化\"变好了没\"的尺子。\n\n**前置自测（答不上就先回上一篇）**\n1. RAG 总共两大环节是哪两个？\n2. 想证明\"变好了\"，靠感觉行吗？上一站你手里有什么\"能测出数字\"的工具？\n3. 检索（`eval_recall`）和大模型（生成），哪个环节你在 05 已经能独立测数字？\n\n**站纲（跨 3 小步）**\n**先诊断\"问题在检索还是生成\" → 常见四种优化（从便宜到贵） → 养成\"改一次记一次\"的习惯（为阶段四铺路）**\n\n---\n\n## 第 1 步 先诊断：答不对，问题出在\"检索\"还是\"生成\"？\n\nRAG 只有两大环节。答得不好，一定是其一，先分清再修：\n\n- **检索没找到对的** → 症状：它答非所问、或回答里带的\"出处\"根本不对题。**病根在\"没翻到你要的那页\"。**\n- **找到但没照着说** → 症状：检索到的原文明明有答案，它却自己发挥、甚至编。**病根在\"提示词没约束住\"。**\n\n> 💡 一个零成本诊断法：**直接把检索到的原文 `print` 出来看一眼**——如果\"最像的几块\"压根不相关，别去调大模型，问题在检索；如果原文很相关它却瞎说，问题在生成。**先看了症，才敢下药。**\n\n## 第 2 步 四种最实用的优化（对症下药，从便宜到贵）\n\n### ① 最便宜：在提示词里把话说死 → 治\"生成侧跑偏/瞎编\"\n\n在拼给大模型的 prompt 里明确两条：**\"只根据上面资料回答\"；\"资料里没有，就直说不知道，不要编。\"**\n这一条不花任何算力，往往是\"生成侧\"最有效的开关。**先试它**——05 的 `ragbot.py` 已经把这个约束写死在 `build_prompt` 里了，你加的每次 `ask` 都自带这条防线。\n\n### ② 次便宜：回分块调大小/重叠 → 治\"检索源头就切坏了\"\n\n检索质量很多时候早早在\"切块\"就定了：块太大，一块里塞了太多信息答不干净；块太碎，上下文散回到第 2 步调一调（`chunker.py` 的 `size`/`overlap`），用 `eval_recall` 看召回变化。**这是\"花最少的钱，往往收益最大\"的一档**，因为病灶在源头。\n\n### ③ 检索侧升级：混合检索（BM25 + 向量，再 Re-rank）\n\n纯粹\"按意思找\"(向量) 有时反而忽略\"关键词\"很强的信号（如产品型号 `SKU-998`）。思路：**\"按意思找\"和\"按关键词找\"两条腿走路**，挑两边的结果再用一个重排(Re-rank)模型融合排序。底层逻辑不用记公式，记结论：**混合(关键词+向量)+重排，通常比单向量更稳。** 上这个之前，先用 `eval_recall` 拿到单向量召回率的数字当\"底数\"，改完再比——没有底数，上再贵的方案也是玄学。\n\n### ④ 更麻烦：把问题改写得更\"好检索\"（query 改写/扩展）\n\n原始问法有时太口语或太歧义。让一个小模型**先把你问的话改写成\"更利于检索的句子\"** 再去查。例：你问\"那个东西咋弄？\"→ 改写\"**如何申请退货并提交工单**\"→ 再查，命中率高很多。\n\n> 一个顺序建议：**先生成侧的\"提示词说死\"(①) → 再检索侧的源头\"分块\"(②) → 再\"混合检索\"(③) → 视情况 query 改写(④)。** 从便宜到贵、从快到稳，**别一上来就上复杂方案，也别一次改好几个变量**——否则你永远分不清是谁起的作用。\n\n## 第 3 步 养成\"改一次记一次\"的习惯（为阶段四埋线）\n\n别靠感觉\"好像变好了\"。**每次改之前，先跑一遍\"固定的 10 个问题\"，记下答案；改完再跑同一批，对比有没有改善。** 固定问题集+前后对比，就是阶段四要做的\"评测集\"的雏形——现在就开始攒，后面你写简历那句\"把准确率从 60% 提到 85%\"时，靠的就是这几行记录。\n\n> 🔬 你现在手里的量化工具：`search.py` 的 `eval_recall` 能算出\"检索召回多少\"。**Recalling 是检索侧的尺子**；它现在（伪向量/离线）就能跑，等你接真 embedding 后继续用。这就是\"先把评估能力搭起来\"的价值——优化之前，先有尺子。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 能用\"零成本诊断法\"说清\"答非所问\"和\"答案跑偏\"分别该查哪一侧（检索 or 生成）\n- [ ] 说出四档优化按\"从便宜到贵\"的正确顺序，以及为什么\"别一次改好几个变量\"\n- [ ] 指出\"提示词说死\"这一档在 `ragbot.py` 的哪里已经写死，你随手加的 `ask` 自带防线\n- [ ] 用 `eval_recall` 在改\"分块 size/overlap\"前后各测一次，记下两个数字（先有底数再改）\n- [ ] \"混合检索补上了哪一路信号、为什么重排有用\"能用一句话讲给朋友\n- [ ] 建了一张\"固定 10 问\"的清单（哪怕就写在 `.md` 里），为阶段四的评测集起了个头\n- [ ] 给本步的记录 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 一次改好几个变量，不知道谁有用 | 没做对照 | 一次只改一个，改前先用 `eval_recall` 记底数 |\n| 问题在检索，却去调大模型 | 没诊断就下药 | 先 `print` 检索命中，判明环节再动手 |\n| 一上来就上重排/query 改写 | 追求复杂 | 按\"便宜→贵\"顺序；先试提示词说死 + 分块 |\n| 靠\"好像变好了\" | 没量化 | 用 `eval_recall`（检索侧尺子）+ 固定问题集（生成侧尺子）记数字 |\n| 分块越切越碎 | 以为\"碎=细=准\" | 块太小反而上下文散；用 `eval_recall` 验证，不是想当然 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 记记忆锚下面这句话，能复述\"答不对分两侧、按便宜到贵调\"就算复位。\n2. 跑 `python phase2\\test_search.py` + `test_ragbot.py` → `OK` 则代码没坏。\n3. 看\"验收清单\"，没勾的补上；尤其把\"固定 10 问\"建起来再说下一步。\n> 记忆锚：**本步 = \"先诊断（检索/生成）→ 从便宜到贵逐级试（提示词说死→分块→混合检索→query改写）→ 改一次记一次（为了评测）\"。优化没有银弹，靠尺子和对照。**\n\n---\n\n## 下一步：阶段二收官，进入\"会自己干活\"的 Agent\n\n你现在有了一个\"能翻资料、还知道出处\"的助手。但它是**被动的**——你问一句它答一句，它不会自己决定\"要不要去查、去搜\"。\n\n阶段三要让它**长出手**：从\"问答器\"升级成\"会自己决定怎么干活的智能体\"。\n\n> 进入阶段三 · `04_阶段三_Agent`。\n\n---\n\n> 附：阶段二知识点速览（回来随手复盘用，不是要背）\n> 资料→[分块]→切片→[Embedding]→带指纹的向量→[Chroma]→能秒查\n> 提问→编码成指纹→Chroma 召回最像几块→[拼进 prompt]→大模型\"看着资料\"答"}, {"id": "sec13", "group": "阶段三 · Agent", "title": "前沿范式雷达", "basename": "00_背景_前沿范式雷达.md", "markdown": "# 阶段三 · 背景：前沿范式雷达——为什么你学的是\"不过时\"的东西\n\n> 这一站解决什么：你刚学完 Agent 一整套。有些名词今年是它、明年换它（比如某个框架更新换代），你会担心\"会不会学完就过时\"。这一站给你一把**不会被时间打败的尺子**：分清\"稳定范式\"和\"会换的库名\"，你就再也不怕追不上。\n> 判断基准：2026-09-19。\n\n---\n\n## 一句话定位：范式是\"规矩\"，库名是\"牌子\"；规矩会留下，牌子会换代\n\n- **范式（你在学的）**：Agent 编排、检索增强、工具协议、评测闭环、上下文工程——这些是\"做法/规矩\"，被行业反复验证、有大量生产实践托底。\n- **库名/框架名（会换的）**：LangGraph、CrewAI、某家的 API 版本……它们是\"实现的牌子\"，明年可能有更好的新牌子。\n\n> 🍳 类比：范式 = \"怎么像个常人一样把菜做熟\"（火候、调味这种规矩）；库名 = \"某某牌炒锅\"。**锅会换代，但烹饪规矩不会。你跟着阶段三学的，全是\"规矩\"那一层。**\n\n## 五根你现在已经踩上的\"稳定范式支柱\"\n\n| 支柱 | 你对应学的 | 为什么抗过时 |\n|---|---|---|\n| **Agent 编排**（图：节点/边/状态） | LangGraph 那站 | \"怎么组织多步自主流程\"是标准做法，换工具仍在 |\n| **上下文工程 / 检索增强** | RAG 阶段二 | 让模型基于证据说话，永远是刚需 |\n| **工具协议**（统一接口） | MCP 那站 | \"工具即插即用\"这个方向已在行业铺开 |\n| **评测与可观测** | 阶段四马上学 | 从\"能跑\"到\"生产可靠\"的必经门槛 |\n| **多智能体协作** | (将来进阶方向) | 单 Agent → 多 Agent 是明确走向 |\n\n> 看到没——**阶段三你学的每一环，都落在其中一根支柱上**。这不是巧合，是这条路当初就按\"稳定范式\"给你铺的。\n\n## 那\"新技术\"来了怎么办？用这把尺子判断\n\n以后任何新名词冒出来（新框架、新协议、GraphRAG、某某 Agent 平台……），不慌，套两个问题：\n\n1. **它属于哪根范式支柱？**（编排？检索？协议？评测？）——能归类，说明你已经理解它的位置。\n2. **它是\"新规矩\"还是\"新牌子\"？**——如果是新牌子，等它被验证、文档稳定再接触即可，不必焦虑错过。\n\n> 这一条，就是\"长期不过时\"的方法论本身：**你锚定的是规矩，不是牌子。** 学的时候多花心思在\"为什么这么设计\"，牌子换代只是顺手的事。\n\n## 实操上，怎么配合你的学法\n\n- 让 AI 生成代码时，每次问一句：\"**你用的这些库，是按哪个稳定范式/思路写的？**\"——逼自己提取出\"规矩\"，而不只是抄\"牌子\"的语法。\n- 遇到新库就套上面两个问题想一遍，想明白就放下。\n\n## 验收：能讲懂才算会\n\n1. 用\"锅 vs 烹饪规矩\"比方，区分\"会过时\"和\"不过时\"。\n2. 你学的 Agent 那套，对应五根支柱里的哪几根？\n3. 看到\"某某新 Agent 框架\"你会先问自己什么问题？（两道尺子）\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n本步是\"雷达/尺子\"，不写代码。复位只需两问：**新名词属于哪根范式支柱？它是新规矩还是新牌子？** 能套上=复位成功。\n> 记忆锚：**本步 = \"范式是规矩、库名是牌子；规矩留下、牌换不改。你学的是 Meta 层的'为什么这么设计'，不是某一家的语法。\"**\n\n## 下一步：阶段三到此收官\n\n你已具备\"让 Agent 自主决策、接工具、查资料、安全落地\"的完整能力。下一步阶段四，教你**怎么用数字证明它可靠**——那才是让你从\"做好玩的东西\"跨到\"能被公司信任的东西\"的关键一步。\n\n> 进入阶段四 · `05_阶段四_评测与求职`。"}, {"id": "sec14", "group": "阶段三 · Agent", "title": "从问答到Agent", "basename": "01_从问答到Agent.md", "markdown": "# 阶段三 · 第 1 步：从\"问答器\"到\"会自己干活的 Agent\"\n\n> 这一站解决什么：阶段二的助手很能干，但它是**被动的**——你问一句、它答一句，路径永远是你规定好的。这就像一个服务员，只会\"端你点的那道菜\"。这一站的大升级：让它**自己决定接下来干什么**——要不要查、调哪个工具、做完了没有。这种\"能自主决定流程\"的东西，就叫 **Agent（智能体）**。\n> 判断基准：2026-09-20。\n> 交付物对应：`companion/phase3/agent.py` 里那个**最简 Agent 循环**（`run_agent`）——先用它看懂\"循环\"骨架，并把\"可靠性\"钉成可测的行为。\n\n**前置自测（答不上就先回阶段二）**\n1. 阶段二的 `ask()` 为什么是\"被动的\"？它每次回答的路径是你定的还是它定的？\n2. \"增强\"发生在哪一步，你还在吗？（提醒：拼 prompt 那一行）\n3. 你手里现在有哪几个\"零件\"（RAG / 工具 / 大模型调用）？\n\n**站纲（跨 4 小步）**\n**看懂问答 vs Agent 差在哪 → 想通核心机制(循环) → 亲手写一个\"会调工具\"的最小 Agent → 第一眼认识\"它可能不靠谱\"（为 2-6 站铺可靠性）**\n\n---\n\n## 第 1 步 先对比：普通问答 vs Agent，左边是\"写死的路\"，右边是\"自己走路\"\n\n| | 普通问答（你会的） | Agent（这一站目标） |\n|---|---|---|\n| 能不能调工具 | 不能 | 能（查天气、搜网页、调你那个 RAG） |\n| 下一步由谁决定 | **你写死** | **大模型动态决定** |\n| 一步不够怎么办 | 结束 | 继续调工具，直到做完 |\n| 典型表达 | \"回答这个问题\" | \"你自己想办法搞定这件事\" |\n\n> 🍳 接住老朋友：如果把阶段二比作\"**厨师看着资料给你上菜**\"——那 Agent 就是让它当上\"**领班**\"：收到客人一句\"今晚安排一桌招待\"（一个目标），它**自己分配**\"先订位 → 再点菜 → 确认上菜\"，而不是等你一道菜一道菜命令。\n\n## 第 2 步 想通它的核心机制：一个\"反复自己决定\"的循环\n\nAgent 之所以\"聪明\"，不是有什么黑魔法，而是一个**小小的循环**——它每次只做四件事，然后重复：\n\n```\n① 大模型看着\"目标 + 现在的状态\"，想一想：\n   \"我现在能做什么？（查资料？搜网？算数？）该不该做？\"\n② 如果它决定要调一个工具 → 调用，把\"工具的结果\"放回对话里\n③ 回到 ①，再看\"有了新信息，下一步做什么？\"\n④ 一直重复，直到它判断\"目标达成了\"→ 才把最终答案交给你\n```\n\n> 【本质一行】**Agent = 把\"下一步做啥\"的决定权，从\"你写死\"交还给了\"大模型\"。** 你提供的是\"能用的工具 + 一个目标 + 什么时候停\"，剩下的脑力活它来。这一循环，是整个阶段三的心脏——后面 LangGraph、工具、MCP，全是在把这一循环\"规范化、做大\"。\n\n## 第 3 步 亲手写一个\"会调工具\"的最小 Agent（最原始版）\n\n不用任何框架，先用手动循环把一个玩具 Agent 跑出来——**这样你才真正看到\"循环\"长什么样**：\n\n```python\nimport requests, os, json\nfrom dotenv import load_dotenv\nload_dotenv()\n\ndef chat(messages):\n    resp = requests.post(\"https://api.deepseek.com/chat/completions\",\n        headers={\"Authorization\": f\"Bearer {os.getenv('DEEPSEEK_API_KEY')}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"deepseek-chat\", \"messages\": messages})\n    return resp.json()[\"choices\"][0][\"message\"]\n\n# ① 给两个\"手\"（工具）\ndef get_weather(city):\n    return f\"[工具结果] {city} 今天 22°C，晴\"\ndef calculate(expr):\n    return f\"[工具结果] {expr} = {eval(expr)}\"\n\nTOOLS = {\"get_weather\": get_weather, \"calculate\": calculate}  # 工具录\n\n# ② 最小循环\ndef agent(goal, max_steps=5):\n    messages = [{\"role\": \"system\",\n        \"content\": \"你是会调工具的领班。需要时输出 JSON：{\\\"tool\\\":\\\"工具名\\\",\\\"args\\\":\\\"参数\\\"}；否则直接给最终答案。\"}]\n    messages.append({\"role\": \"user\", \"content\": goal})\n\n    for _ in range(max_steps):\n        msg = chat(messages)               # 大模型想一步\n        messages.append(msg)               # 记录它的这一步\n        text = msg[\"content\"]\n        if text.strip().startswith(\"{\"):   # 它说\"我要调工具\"\n            plan = json.loads(text)        # 解析出工具名参数\n            result = TOOLS[plan[\"tool\"]](plan[\"args\"])   # 真正调用\n            messages.append({\"role\": \"user\", \"content\": result})  # 把结果放回\n        else:                              # 它说\"我做完了\"\n            return text                    # 交最终答案\n    return \"达到最大步数，结束\"\n\nprint(agent(\"上海天气怎么样？再用计算器算 3*7\"))   # 看它怎么自己决定\n```\n\n> 看仔细：你**没有写死**\"先算天气再算数\"。是这个循环让大模型自己看到 goal，自己决定\"先调 get_weather 再调 calculate\"。**你只给了它工具录、目标和停止条件。** ——这就是 Agent 的全部骨架，一点都不神秘。\n\n（这一版很\"玩具\"：工具参数解析粗暴、没错误处理，**调不存在的工具会直接崩**。可靠性那些，正是接下来 2–6 站要补的。）\n\n### 训练营增量：先离线看\"循环 + 可靠性\"长什么样（不用 Key）\n\n上面那段要真 Key 才能跑。但循环**里最该学的东西**——\"失败怎么恢复、怎么防止它调个没完、过程怎么留痕\"——不该等 Key。`companion/phase3/agent.py` 把循环做成一个**引擎**，用脚本化策略替身驱动，离线就能把\"可靠\"测出来：\n\n```shell\npython phase3\\test_agent.py    # 4 项：失败恢复/越权拦截/防死循环/可观测留痕\n```\n\n> 🔬 训练营要求：读一遍 `agent.py` 的 `run_agent`，看它怎么把\"循环\"兜住——**只要它\"只调工具不结束\"，`max_steps` 一到就强制终止**，绝不无限烧钱/卡死。这个\"兜底\"思想，就是 Agent 可靠性的地基。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 跑 `python phase3\\test_agent.py`，输出 `OK`（4 项）\n- [ ] 用\"领班\"比方，说出普通问答和 Agent 的**一个**关键差别（决定权在谁）\n- [ ] 画出那个\"四步循环\"，并标出\"谁做决定、什么时候停\"\n- [ ] 能讲清：循环里怎么知道\"大模型说要调工具\"、怎么知道\"它做完了\"\n- [ ] 能讲一句：`agent.py` 的 `max_steps` 兜底在防什么（死循环=钱与卡死）\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| `TOOLS[plan[\"tool\"]](...)` 直接中了抛异常/KeyError就崩 | 没做\"工具不存在/调用失败\"处理 | 用 `ToolRegistry` 的白名单+异常捕获（见 `agent.py`） |\n| 模型反复调工具不结束，循环停不下来 | 没兜底 | 设 `max_steps`，到点强制终止并说人话 |\n| 把 `calculate` 里的 `eval()` 直接接不可信输入 | 想着省事 | 只在自己的演示里用；对用户输入绝不裸 `eval`（安全红线） |\n| 以为 Agent 很玄 | 被黑话唬住 | 它就是把\"决定权\"交还大模型的一个循环，拆开就那几步 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `companion/phase3/agent.py` 的 `run_agent`，能一眼看懂\"循环+兜底\"=复位成功。\n2. 跑 `python phase3\\test_agent.py` → `OK` 则引擎没坏。\n3. 看\"验收清单\"，没勾的补上；勾满进下一步。\n> 记忆锚：**本步 = \"Agent = 把'下一步去做什么'的决定权交给大模型的循环；你只管给工具+目标+停止条件。可靠性的地基是'兜底'——到点就停、失败就喂回去。\"**\n\n## 下一步：这个循环很棒，但它会越来越乱——需要一个\"规范器\"\n\n手动循环能做玩具，可一旦工具多、分支多、要记录状态、要容错，就会乱成一团。业界把它**规范化**成了框架，最常见的就是 **LangGraph**。下一站认识它。\n\n> 下一篇：阶段三 · `02_LangGraph核心-节点边状态.md`"}, {"id": "sec15", "group": "阶段三 · Agent", "title": "LangGraph核心-节点边状态", "basename": "02_LangGraph核心-节点边状态.md", "markdown": "# 阶段三 · 第 2 步：给\"随机应变的领班\"装上流程规矩——LangGraph 核心\n\n> 这一站解决什么：上一站那个手写循环很亲切，但工具一多、分支一多、还要记住\"做到哪了、结果存哪\"，它就会乱成一团、还难排错。这一站登场 **LangGraph**：它把 Agent 那个\"随心就连\"的循环，**规范成一张\"有节点、有边连接、有一个共享状态\"的流程图**——好读、好改、出错能看到卡在哪一步。\n> 判断基准：2026-09-20。LangGraph 版本迭代快，具体写法以官方文档为准，但\"节点/边/状态\"三概念不变。\n> 交付物对应：`companion/phase3/agent.py` 的状态 `transcript`——\"状态=一路走的记忆\"，在这里被 LangGraph 正式化成图的共享黑板。\n\n**前置自测（答不上就先回上一篇）**\n1. 手动循环里\"它做到哪了、之前调过什么\"存在哪？（提示：那个 `messages`）\n2. 手动循环为什么一旦工具多、分支多就乱？举一个会乱的场景。\n3. `max_steps` 兜底在防什么？\n\n**站纲（跨 4 小步）**\n**看懂大流程图(节点/边/状态) → 用最小代码搭一个图 → 跟上一步循环对比好在哪 → 把\"状态=记忆\"记住（这是可靠性的听诊器）**\n\n---\n\n## 第 1 步 三个词吃透 LangGraph：节点、边、状态\n\n把上一站那个\"循环\"翻译成图，其实就是三个概念：\n\n- **节点 Node** = 一\"步\"活（一个函数）。比如\"AI 想一步\"\"调天气工具\"\"再想一步\"。\n- **边 Edge** = 从这一步**走到**下一步的箭头。走了边，就说明\"前一步干完，接着后一步\"。\n- **状态 State** = 一路**共享的小黑板**（比如 messages 对话记录、当前进度），每个节点都能读写它，节点之间靠它传话。\n\n> 🍳 类比：请想象一条**流水线车间**。\n> - **节点** = 每个工位（拧螺丝工、质检工）；\n> - **边** = 工位间的传送带；\n> - **状态** = 车间里传的\"随件单\"（记录这活儿做到哪、质检结果）。\n> - 工位之间不直接递送，都靠\"随件单\"交流——就像节点之间靠共享的 State 交流。\n\n## 第 2 步 最小可跑的 LangGraph（先看骨架）\n\n```python\nfrom typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\n\n# ① 定义\"状态\"：这张小黑板上一路要带着的数据\nclass MyState(TypedDict):\n    total: int     # 比如一路累计的数\n\n# ② 定义\"节点\"：每个都是一个\"干一截活\"的函数，传入 state，返回\"要更新黑板的部分\"\ndef bump(state: MyState):\n    return {\"total\": state[\"total\"] + 1}     # 把 total +1\n\ndef check(state: MyState):\n    if state[\"total\"] >= 3:\n        return \"done\"         # 满足条件→走 \"done\" 分支\n    return \"again\"\n\n# ③ 搭图：把节点和边连起来\ngraph = StateGraph(MyState)\ngraph.add_node(\"bump\", bump)             # 加一个工位\ngraph.add_edge(START, \"bump\")            # 原料→bump\ngraph.add_conditional_edges(\"bump\",      # \"bump\"做完后，按 check 返回值决定走向\n                            check,\n                            {\"again\": \"bump\", \"done\": END})\napp = graph.compile()                    # 编译成可运行\n\n# ④ 跑：初始小黑板 total=0\nprint(app.invoke({\"total\": 0}))          # 一路 bump 到 3 为止 → {\"total\": 3}\n```\n\n> 【本质一行】**普通边 = \"一定走下去\"；条件边 = \"看完状态再决定怎么走\"。** 你上一站\"要不要调工具\"的那次判断，在这里就变成一个 `add_conditional_edges`。\n> 对比一下就有了：上一次循环的逻辑散在代码里，这里**一目了然地画在图上**——这就是\"规范化\"的意义。\n\n## 第 3 步 回到你的心法：这跟\"领班\"咋对上？ + 把\"状态=记忆\"记住\n\n- 你上一站的\"每次想一步\" → 就是一个叫 `agent_step` 的**节点**；\n- \"要不要调工具\"那判断 → 一条**条件边**；\n- 那本 `messages` 历史 → **状态**里的核心字段。\n\n> 🔬 **把这个记住（阶段三可靠性的听诊器）**：**状态 = 记忆 = 排错的第一手现场。** Agent 答错了，你第一步不是猜，而是**把 state 里记的每一步打出来看**——它当初到底查了什么、调了什么、在哪一步开始跑偏。`agent.py` 里那个 `transcript`（每步决策+工具回执）就是它，`trace` 是\"加了时间戳的复盘日志\"。图再花哨，靠的还是这块小黑板。\n\n**你把图搭出来，就得到一张\"能看懂、能改、能排错\"的 Agent 流程图**——比手写循环靠谱得多。这也正是 LangGraph 存在的意义：把\"聪明但野\"的循环，驯化成\"规矩但稳\"的图。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 用\"流水线车间\"比方，分别说出节点、边、状态像什么\n- [ ] `add_conditional_edges` 和 `add_edge` 差在哪？对应上一站循环里的哪一步\n- [ ] 编译好的 `app.invoke(...)` 传进去的是\"初始状态\"；跑完返回什么\n- [ ] 能讲清\"状态=记忆\"：Agent 答错时，你第一步该看什么、为什么\n- [ ] 能指出 `agent.py` 里哪个东西就是\"状态\"，哪个是\"带时间戳的复盘日志\"\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 状态定义不合规，节点写乱 | 没想清\"黑板上有哪些字段\" | 开跑前先把 State 字段列全（messages/context/进度） |\n| 节点间靠\"直接传参\"而非状态 | 没养成\"走黑板\"习惯 | 一切交流走 State，否则一改就断、难排错 |\n| 条件边返回值没写对齐 | `add_conditional_edges` 里键名拼错 | 先写全映射字典 {分支名: 目标节点/END} |\n| 图没编译就开始 invoke | 忘了 `compile()` | 先 `app = graph.compile()` 再 `invoke` |\n| 答错就重写整个图 | 不看状态就动手 | 先 `print` state/trace，定位你在哪一步跑偏 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 画一遍\"节点/边/状态\"的关系（随手一画），能画出=复位成功。\n2. 打开 `agent.py`，点名哪是 State、哪是 trace。\n3. 看\"验收清单\"，没勾的补上；勾满进下一步。\n> 记忆锚：**本步 = \"LangGraph 把循环画成'节点+边+状态'的流程图；状态=记忆=排错第一现场。图让 Agent 从野变稳。\"**\n\n## 下一步：纸上谈兵够了——真把\"工具\"接进去\n\n有了图，下一步就是把你的**真工具**（查天气、调阶段二的 RAG、算数……）作为\"可被节点调用的手\"接进去，让 Agent 真正\"能让事办成\"。\n\n> 下一篇：阶段三 · `03_工具调用与Agent闭环.md`"}, {"id": "sec16", "group": "阶段三 · Agent", "title": "工具调用与Agent闭环", "basename": "03_工具调用与Agent闭环.md", "markdown": "# 阶段三 · 第 3 步：给领班\"一双能干的手\"——工具调用与 Agent 闭环\n\n> 这一站解决什么：上一站你有一张\"图\"，但图的节点还只是 `total+1` 这种玩具。这一站把**真工具**接进去——`查天气`、`算数`、**以及你阶段二做好的那个 `ask()`(RAG)**。Agent 的\"工具调用\"真正闭环：**大模型决定调 → 程序真调 → 结果放回 → 再决定 → 直到交出答案。**\n> 判断基准：2026-09-20。**工具调用是 Agent 可靠性事故的高发区**——这一站不仅让你\"接得通\"，还要\"失败不崩、可恢复、可复盘\"。\n> 交付物对应：`companion/phase3/agent.py` 的 `ToolRegistry.call`——它把\"越权拦截→异常捕获→留痕\"三条防线都写给你看了。\n\n**前置自测（答不上就先回上一篇）**\n1. LangGraph 的\"节点/边/状态\"分别指什么？\n2. 上一站玩具 `agent()` 里，如果 `TOOLS[plan[\"tool\"]]` 的名字打错了会发生什么？\n3. 工具调用是大模型亲自执行的吗？谁真正干活？\n\n**站纲（跨 4 小步）**\n**搞懂\"工具调用\"其实是啥 → 用标准方式声明工具 → 跑通完整闭环 → 上线前给工具装上\"三条可靠性防线\"**\n\n---\n\n## 第 1 步 \"工具调用(Tool Calling)\"到底怎么回事？别再被黑话唬住\n\n你以为是很深的机制？它其实是**一个\"再规范一点\"的 JSON 约定**：\n\n- 你在代码里**把每个工具\"登记\"成一段 JSON 描述**（名字 + 干嘛 + 参数长啥样），列给大模型；\n- 大模型\"想\"到该用哪个工具时，**不是自己执行**，而是返回一段 JSON：`{\"tool\": \"get_weather\", \"args\": {\"city\": \"shanghai\"}}`——它只是在\"**填单子**\"；\n- **真正动手跑工具的，还是你的 Python 代码**（把这段 JSON 解析后调用对应函数，把 `[工具结果]...` 放回对话）。\n\n> 🍳 一句话：大模型**从不亲自干活**，它只会\"签字批单\"（返回\"我想用哪个工具、参数填什么\"）；**是你在幕后照单执行**，再把结果递回去。认清这个分工，工具调用对你就不再神秘。\n\n> 💡 这也顺便解释了为什么它安全可控：**大模型给的 JSON 只是\"提议\"，跑不跑、怎么跑，全程由你的代码把关**。\n\n## 第 2 步 用\"官方造型\"把工具声明清楚（标准做法）\n\n现代大模型支持一种**结构化工具声明**，我们按它的格式把工具写清楚：\n\n```python\ntools = [\n    {\"type\": \"function\", \"function\": {\n        \"name\": \"get_weather\",\n        \"description\": \"查询某个城市的天气\",\n        \"parameters\": {\"type\": \"object\",\n                       \"properties\": {\"city\": {\"type\": \"string\"}},\n                       \"required\": [\"city\"]}}},\n]\n\n# 真正干活的 Python 函数（对应上面的声明）\ndef get_weather(city):\n    return f\"[工具结果] {city} 今天 22°C\"\n\nTOOL_IMPL = {\"get_weather\": get_weather}   # 名字 → 真函数 的对照表\n```\n\n> 记忆点：**\"声明\"是给大模型看的\"说明书\"(JSON)，\"实现\"是给你自己程序用的\"真函数\"**。两套东西靠\"名字\"对上号。\n\n## 第 3 步 跑通完整闭环（调用 → 取结果 → 再调用 → 结束）\n\n```python\nimport requests, os, json\nfrom dotenv import load_dotenv\nload_dotenv()\n\ndef chat_with_tools(messages):\n    resp = requests.post(\"https://api.deepseek.com/chat/completions\",\n        headers={\"Authorization\": f\"Bearer {os.getenv('DEEPSEEK_API_KEY')}\",\n                 \"Content-Type\": \"application/json\"},\n        json={\"model\": \"deepseek-chat\", \"messages\": messages, \"tools\": tools})\n    return resp.json()[\"choices\"][0][\"message\"]\n\nmessages = [{\"role\": \"user\", \"content\": \"上海和北京今天谁更热？\"}]\nfor _ in range(5):\n    msg = chat_with_tools(messages)\n    messages.append(msg)                       # 记下大模型的这一步\n\n    if tool_calls := msg.get(\"tool_calls\"):    # 它\"批了单\"？\n        for tc in tool_calls:\n            name = tc[\"function\"][\"name\"]\n            args = json.loads(tc[\"function\"][\"arguments\"])\n            result = TOOL_IMPL[name](**args)    # 你照单执行\n            messages.append({\"role\": \"tool\",\n                             \"tool_call_id\": tc[\"id\"],\n                             \"content\": result})   # 结果放回对话\n    else:\n        print(msg[\"content\"])                  # 没有要调的 → 给最终答案\n        break\n```\n\n（各家工具的 JSON 字段名偶有差异——以 `tool_calls`、`function.arguments` 为准，接口报错就去查你那家平台的官方文档。）\n\n> 【本质一行】**\"闭环\" = 循环里反复执行\"大模型提议 → 你执行工具 → 结果回填 → 再提议\"，直到它不分单了为止。** 你阶段二的 `ask()`，现在也可以照样注册成一个工具，让 Agent 自己决定\"要不要去查你的资料\"。\n\n## 第 4 步 上线前给工具装上\"三条可靠性防线\"（本步真正的重点）\n\n上面是\"能跑通\"，但对真实 Agent **远远不够**。工具调用是最容易翻车的地方，翻车最典型的三类，`agent.py` 的 `ToolRegistry.call` 都给了对策：\n\n| 会翻车的现实 | 后果 | 训练营对策（见 `agent.py`） |\n|---|---|---|\n| **调了不存在/未授权的工具**（模型幻觉出个工具名） | 崩 / 越权 | **权限白名单(沙箱)**：工具统统登记进 `ToolRegistry`，不在表里的一律拒绝并留痕 |\n| **工具内部真的抛异常**（查天气接口断了、参数错） | 整个 Agent 崩 | **异常捕获喂回**：`try/except` 兜住，把\"哪错了\"当消息喂回大模型，让它修正/换招/收尾 |\n| **它反复只调工具不结束 / 或参数横竖不对** | 死循环烧钱 / 卡死 | **`max_steps` 兜底** + 每次失败都往回喂，而不是静默重试 |\n\n```python\n# agent.py 里的示范（零依赖可跑）；真接上大模型时这套机制原样生效\nfrom agent import ToolRegistry, ScriptedPolicy, run_agent\n\nreg = ToolRegistry({\"get_weather\": ...})        # 白名单：只有这只能被调\npolicy = ScriptedPolicy([...])                   # 离线用脚本策略模拟大模型\nout = run_agent(\"上海天气\", reg, policy)\nprint(out[\"result\"]); print(out[\"trace\"])       # 结果 + 每一步留痕\n```\n\n> 🔬 训练营要求：读一遍 `agent.py` 的 `ToolRegistry.call`，把\"三防线\"指给自己看。再跑 `python phase3\\test_agent.py`，看测试怎么把\"失败能恢复\"\"越权被拒\"\"死循环被钳制\"钉死的。**接真大模型时，你只是把 `ScriptedPolicy` 换成 `chat_with_tools`，引擎一行不改。**\n\n---\n\n## 这一步的产出：一个\"能决定调什么、调几轮、失败还撑得住\"的闭环\n\n把它跟阶段二接起来：**把 `ask()`(RAG) 注册成一个工具**，Agent 就能自主决定\"这问题要不要查资料\"——且这个闭环\"失败可恢复、可复盘、不会烧到停不下来\"。这一步做完，你拿到了\"会查资料又会用工具、还可靠\"的 Agent。\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 跑 `python phase3\\test_agent.py`，输出 `OK`（失败恢复/越权/兜底/留痕四关）\n- [ ] 能讲清：大模型到底\"执不执行\"工具？它实际返回的是\"单子\"，干活的谁？\n- [ ] 能讲清\"声明\"与\"实现\"两套怎么靠名字对上\n- [ ] 能说清\"工具抛异常\"和\"调了不存在工具\"分别怎么被兜住、且不崩\n- [ ] 为什么\"失败要往回喂\"而不是\"静默重试\"？（提示：上下文要能看到上次为啥错）\n- [ ] 把阶段二 `ask()` 注册成一个工具（至少写进 `ScriptedPolicy` 能测）\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 调不存在工具直接崩 | 用 `TOOL_IMPL[name]` 裸取 | 走 `ToolRegistry` 白名单，未登记一律拒绝 |\n| 工具抛异常弄崩整个 Agent | 没 `try/except` 兜住 | 捕获后转成\"错误回执\"喂回大模型 |\n| JSON 解析失败（模型输出非合法 JSON） | 太死板 | 解析失败也给个\"回执\"让它重说，不要 `json.loads` 直接崩 |\n| 失败重试看不到上次为啥错 | 每次重发不带 history | 把错误信息放回对话，让它\"看着错再改\" |\n| 循环跑不停 | 没兜底 | `max_steps` + 到点强制终止 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 打开 `agent.py` 的 `ToolRegistry.call`，能把\"三防线\"指出来=复位成功。\n2. 跑 `python phase3\\test_agent.py` → `OK` 则引擎没坏。\n3. 看\"验收清单\"，没勾的补上；勾满进下一步。\n> 记忆锚：**本步 = \"工具调用=大模型批单、你执行；可靠工具=白名单(防越权)+异常捕获喂回(防崩)+max_steps(防死循环)+全程留痕(可复盘)。\"**\n\n## 下一步：手里的工具还太少？去\"外部世界\"接真正的工具\n\n你目前的手是自制的（查天气、算数、自己的 RAG）。一个真正的 Agent 往往还要**联网搜索、查文档**。下一站教你接外部真实工具，并理解\"工具越多 Agent 越强、但也越想越复杂\"的权衡。\n\n> 下一篇：阶段三 · `04_接入真实工具-搜索与RAG.md`"}, {"id": "sec17", "group": "阶段三 · Agent", "title": "接入真实工具-搜索与RAG", "basename": "04_接入真实工具-搜索与RAG.md", "markdown": "# 阶段三 · 第 4 步：把手伸到\"外部世界\"——接入搜索与你的 RAG\n\n> 这一站解决什么：你目前 Agent 的手都是\"自制\"的。真正的智能体通常还要**随时联网、当场查资料**。这一站教你：把一个**联网搜索工具**和**你阶段二做好的 `ask()`(RAG)** 分别注册进 Agent——让它既能\"现查网络\"也能\"翻你的资料库\"。同时懂一个**价值在与代价成对**的真相：外部工具强、但贵、且更该设权限。\n> 判断基准：2026-09-20。\n> 交付物对应：`companion/phase3/agent.py` 的白名单机制——外部工具**必须**进白名单，别让 Agent 随手乱调外部收费接口。\n\n**前置自测（答不上就先回上一篇）**\n1. \"声明\"和\"实现\"两套东西怎么对号？\n2. 工具可靠性三条防线是哪三条？\n3. 阶段二的 `ask()` 现在能直接当工具用吗？要动它本身不？\n\n**站纲（跨 4 小步）**\n**看清 Agent 的\"手\"从哪来(自有/外部) → 接入联网搜索 → 把阶段二 RAG 接进来 → 看懂\"更强的代价\"(成本/延迟/权限) 并学会克制**\n\n---\n\n## 第 1 步 先想通：Agent 的\"手\"分成两种来源\n\n- **自带的**：你自己写的函数（查天气、算数）——上一站那种。\n- **外部的**：别人提供的 API / 服务（搜索引擎、天气接口、你的 RAG 服务）。你只需把\"调用它\"这件事包装成\"工具声明 + 一个真函数\"，Agent 就能用。\n\n> 🍳 一句话：**不管手从哪来，对 Agent 来说都一样——都是\"一张能调的服务单\"。** 你能把\"查天气\"变成工具，也就能把\"搜网页\"\"查我资料库\"变成工具，手法完全一致。\n\n## 第 2 步 接入\"联网搜索\"工具\n\n很多大模型平台的 API 本身就带\"联网搜索\"参数，或用独立的搜索 API。核心就一步：**把\"搜网页→给摘要\"包装成 `search()` 函数 + 声明成工具**。\n\n```python\ndef web_search(query: str) -> str:\n    # 这里调一个真实的搜索服务（各家平台/API 名称不同，以官方为准）\n    # 这一步是真实工作里要花钱/要密钥的地方\n    result = call_search_service(query)     # 伪代码，替换为你的搜索 API\n    return f\"[搜索结果] {result}\"\n\n# 注册进 tools 声明（同上一站写法，把 name/description/parameters 填给它）\ntools.append({\"type\": \"function\", \"function\": {\n    \"name\": \"web_search\",\n    \"description\": \"查询实时网络信息\",\n    \"parameters\": {\"type\": \"object\",\n                   \"properties\": {\"query\": {\"type\": \"string\"}},\n                   \"required\": [\"query\"]}}})\n\nTOOL_IMPL[\"web_search\"] = web_search     # 真函数挂上去\n```\n\n## 第 3 步 把阶段二做好的 `ask()` 接进来（最爽的一步）\n\n你之前费力气做的 RAG，现在**原样注册成一个工具**，让 Agent 自己决定\"这问题要不要查我资料\"：\n\n```python\nfrom stage2_rag import ask        # 从阶段二那个文件 import 过来（或复制函数）\n\nTOOL_IMPL[\"ask_my_data\"] = ask    # 把 ask 挂上；再给它在 tools 里补一段 name=\"ask_my_data\" 的声明\n```\n\n> 这一步在面试里很值得讲出口：**\"我用阶段二的知识库做了一个 `ask()`，然后作为工具接入 Agent，让它在需要时可以自主检索我的资料。\"** ——这正踩中\"工具化复用\"的分水岭，也说明你会\"能力组合\"而非\"各学各的\"。\n\n## 第 4 步 一个清醒的权衡：更强 = 更贵、更慢、更该设权限\n\n工具越接越多，Agent 确实越强——但**代价同样真**，你在设计时必须心里有数：\n\n- **成本**：每多一步工具调用，往往伴随一次大模型调用；外部 API（搜索/embedding/模型）按次收费。**一次\"自主拆步\"可能烧掉几次调用。**\n- **延迟**：每多一步，用户等得更久。嵌套太深会让\"秒回\"变\"十秒转圈\"。\n- **权限**：外部工具能触到真实网络/数据——**这也是你在 `03` 学过的白名单最要管住的地方**：只在 `ToolRegistry` 里登记你真希望它用的那几只，别让它随手乱调收费/有风险的服务。\n\n> 💡 一句实用建议：**只接\"真正需要\"的几只手，别贪多。** 判断标准：这个 Agent 的实际任务用得着它吗？用不着就不接。克制，反而是更专业的行为。真要在上线前控成本的，看阶段四的\"成本护栏\"。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 能讲清\"自带工具\"和\"外部工具\"对 Agent 来说本质一样在哪\n- [ ] 能讲清怎么把阶段二 `ask()` 变成一只\"手\"，且**不用改 `ask()` 本身**\n- [ ] `web_search` 这类外部工具，为什么必须进 `ToolRegistry` 白名单（防越权/防乱调收费接口）\n- [ ] 能说出\"接太多工具\"至少两个代价（成本/延迟/选错），以及你的克制标准\n- [ ] 用 `agent.py` 把 `ask_my_data`（或任一外部能力）注册进白名单跑通一次\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 把外部收费接口裸暴露给 Agent | 只想着\"更强\" | 进白名单 + 加节流/配额（阶段四讲成本护栏） |\n| 每步都触发大模型调用，钱秒没 | 没意识到\"步数=钱×次数\" | 设 `max_steps`、只在真需要时接外部工具 |\n| 外部 API 报错（限流/断网）整崩 | 没异常捕获 | 用 `ToolRegistry` 捕获喂回（03 学过） |\n| 以为外部工具越多越牛 | 追求堆量 | 用\"实际任务用不用得着\"来取舍，克制为专业 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 能一句话说清\"自带/外部工具对 Agent 没差别\"=复位成功。\n2. 跑 `python phase3\\test_agent.py` → `OK` 则引擎没坏。\n3. 看\"验收清单\"，没勾的补上；勾满进下一步。\n> 记忆锚：**本步 = \"外部工具=把别人 API 包成一张服务单；更强不等于更好——成本/延迟/权限三笔账要算，进白名单是底线。\"**\n\n## 下一步：工具的\"接口\"太乱？——出一个统一规格叫 MCP\n\n你已接了天气、搜索、RAG……它们每个\"参数格式、调用方式\"都不一样，接得多了就会累死。业界干脆定了**一套统一规格**，让任何工具都用一个标准接口——那叫 **MCP**。下一站看它怎么省事。\n\n> 下一篇：阶段三 · `05_MCP让Agent能力标准化.md`"}, {"id": "sec18", "group": "阶段三 · Agent", "title": "MCP让Agent能力标准化", "basename": "05_MCP让Agent能力标准化.md", "markdown": "# 阶段三 · 第 5 步：给所有工具定一个\"统一接口\"——MCP（为什么它是必懂的名词）\n\n> 这一站解决什么：你接的天气、搜索、RAG……每个都\"参数格式、连接方式\"不一样，接一个磨合一个，心累。**MCP** 做的事，就是给所有工具定一套**统一的\"插座\"标准**——以后不管是别人还是你新做的工具，只要按 MCP 这套规矩接通，Agent 拿来就能用。\n> 判断基准：2026-09-20。MCP 官方迭代很快，具体接入以官方文档为准，但\"统一插座\"与\"权限边界\"这两个思想是你要带走的。\n> 交付物对应：`companion/phase3/agent.py` 的 `ToolRegistry`——它就是\"你本地版的 MCP 白名单\"：每个能力登记成有名字、能查、能拒的接口。\n\n**前置自测（答不上就先回上一篇）**\n1. 外部工具接入，除了\"声明+实现\"还要加什么防线？\n2. \"接太多工具\"的代价还记得哪两个？\n3. 你目前接个新工具，要重复写哪些\"又累又像\"的活？\n\n**站纲（跨 4 小步）**\n**看到\"工具一多就乱\"的痛点 → 认识 MCP=统一插座 → 看懂 MCP 长啥样(理解即可) → 记住\"接口统一+权限可控\"才是它真正给你的**\n\n---\n\n## 第 1 步 先看到痛点：工具一多，对接就乱\n\n没有规范时，每个工具都是\"不一样的电器\"，你得像给每个工具**单独配转接头**：\n\n- 天气工具：参数 `city`, 走 HTTP, JSON\n- 搜索工具：参数 `query`, 走 SDK, 还要处理鉴权\n- 你的 RAG：参数 `question`, 走本地函数调用\n\n每接一个，你就要写一套\"连接代码 + 错误处理 + 鉴权\"，越多越累、越乱。\n\n## 第 2 步 MCP = 给所有工具制定\"统一插座\"（Model Context Protocol）\n\n`MCP`（Model Context Protocol，模型上下文协议）为\"给大模型忌加能力\"定下统一标准：**任何能力（工具/数据/提示词）只要包成\"一个 MCP 服务\"，对外就用统一的方式暴露**。打个比方：\n\n> 🍳 曾经的\"各家电器的插头各有不同\"→ 现在**全用同一个 USB 接口**。不管里面是风扇、音箱还是充电宝，只要支持 USB，拿出来就能插上就用。\n> MCP 就是这次\"统一 USB\"的运动——让 Agent 接工具像插 USB 一样即插即用。\n\n**你不必现在深挖 MCP 的每行代码**，但务必记住它解决什么、结构是什么：\n\n```\n┌─────────────────────────────────────────────┐\n│ MCP 架构概览（理解即可）                          │\n│                                               │\n│  Agent(宿主) ──🔌统一协议──  MCP Server        │\n│   （你的应用）           （把某个能力包成一个服务）  │\n│                             │ 提供 tools/数据   │\n│                             └──比如\"查天气服务\"   │\n└─────────────────────────────────────────────┘\n```\n一句话：**你的主程序按\"统一协议\"去问一个个 MCP Server，每个 Server 内部爱怎么实现都行，但对外接口统一。** 于是\"再接入一个新工具\"变成了\"再包一个新 MCP Server\"，主程序几乎不用改。\n\n## 第 3 步 所以技能上的重点其实是\"自己会包一个 MCP 服务\"\n\n你不需要背 MCP 的一堆代码。你的重点就一件——**\"把某个能力封装成一个对外有标准接口的服务\"**。这和你写\"一个带统一输入输出的 Python 函数\"是同一层功力：**把任意能力包成\"规格清晰、可复用\"的东西**。\n\n- 这个\"规格清晰\"的思维，在你后面做任何项目都会反复用到。\n- 一旦你想给别人提供能力（比如让公司的同事也能让 Agent 用你的数据），包成 MCP 服务就是当前主流姿势。\n\n## 第 4 步 别忘了另一半：接口统一了，权限更要划清\n\nMCP 让\"接新工具\"变容易是喜，但也意味着**暴露给 Agent 的入口变多了**——这正好撞上你在 `03/04` 强调的\"白名单/权限\"。\n\n> 🔬 训练营要点：**\"统一接口\"和\"可控权限\"是一对，缺一不可。** 接口统一=方便接；白名单/鉴权=接上了也乱不来。你在 `agent.py` 的 `ToolRegistry` 里拦住\"未登记工具\"的那一手，在面对一堆 MCP Server 时会放大成一个生态级的权限问题——现在就养成\"每个能力入口都问一句'这能给大模型自己调吗'\"的习惯。\n\n> 💡 现在不必动手做一个完整的 MCP Server——先懂\"它是统一插座、解决接口混乱\"，并把\"权限边界\"当成标配。真要用时拿着官方文档跟着走一遍即可，你已经知道为什么这么设计了。\n\n---\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 工具接多了最烦的是什么（举你自己的天气/搜索/RAG 做例子）\n- [ ] 用\"统一 USB\"类比讲清 MCP 干了件什么事\n- [ ] 画出 MCP 架构概览：Agent(宿主) ↔ 统一协议 ↔ MCP Server\n- [ ] 能讲\"接口统一\"和\"权限可控\"为什么是一对、少了哪半会出事\n- [ ] 关联回自己：`agent.py` 的 `ToolRegistry` 怎么就是\"你本地版的 MCP 白名单\"\n- [ ] 给本步交付物 `git commit` 了一句\n\n## 常见坑（这一步的高发区）\n\n| 坑 | 根本原因 | 解决 |\n|---|---|---|\n| 一上来就想手写完整 MCP Server | 把名词当任务 | 先懂\"统一插座+权限边界\"思想，真用再照官方文档走 |\n| 只看到\"接入方便\"，忽略权限 | 接口统一≠可以乱调 | 每个能力入口都过一遍\"能给大模型自己调吗\" |\n| 拿 MCP 当\"必背代码\" | 记 API 不记思想 | 记得住\"统一接口 + 可控权限\"，比背字段值钱 |\n| 以为学了 MCP 就不用学 LangGraph | 混两类东西 | 一个管流程(图)，一个管工具接入(协议)，是两回事 |\n\n## 断档接续（隔几天回来怎么 5 分钟复位）\n\n1. 能随口用\"USB 统一插座\"讲出 MCP 干嘛=复位成功。\n2. 能说出\"权限边界\"为什么是 MCP 的另一半。\n3. 看\"验收清单\"，没勾的补上；勾满进下一步。\n> 记忆锚：**本步 = \"MCP=给所有工具定统一接口(像 USB)，接入变简单；但统一接口+可控权限是一对，权限缺了会乱。记住思想，代码照文档。\"**\n\n## 下一步：零件齐了，合成真正的成品\n\n你已经集齐：**图(LangGraph) + 工具调用 + 外部搜索 + RAG + MCP 思想**。下一站把它们合成一个**完整的 Agent 项目**——这直接就是阶段三的交付物，也是你将来作品集的主角。\n\n> 下一篇：阶段三 · `06_完整Agent项目.md`"}, {"id": "sec19", "group": "阶段三 · Agent", "title": "完整Agent项目", "basename": "06_完整Agent项目.md", "markdown": "# 阶段三 · 第 6 步：合成成品——完整 Agent 项目（阶段三交付物）\n\n> 这一站解决什么：前面几站你已经拿到全部零件（LangGraph 图、工具调用、搜索、RAG、MCP 思想）。这一站把它们**拼成一个能跑的完整项目**，并且配好**鉴权与安全**——因为你要交出的是一个\"能给别人用的\"东西，不再是一段玩具脚本。**跑通只是及格；可靠（安全、可复盘、卡得住成本）才是作品。**\n> 判断基准：2026-09-20。这是阶段三的收官，也是贯穿作品推进到\"第二个里程碑\"。\n> 交付物对应：`companion/phase3/agent.py`——可靠性的引擎已可离线测；本文告诉你怎样把它接进完整项目。\n\n**前置自测（答不上就先回上一篇）**\n1. 可靠性三防线（白名单/异常捕获防崩/兜底防死循环）分别在哪记着？\n2. \"状态=记忆=排错现场\"，这句话还认得出吗？\n3. 收尾要能\"给人用\"，哪两类东西必须补？（提示：鉴权、防注入）\n\n**站纲（跨 5 小步）**\n**定一个\"能演示\"的项目目标 → 组装图(含工具) → 补安全(鉴权/防注入/沙箱) → 补可观测+成本护栏 → 验收并推 GitHub**\n\n---\n\n## 第 1 步 给 Agent 一个\"真实感\"的目标（别做无意义玩具）\n\n好的交付物要有\"有用\"的味道。建议做**\"公司内部资料问答助手 Agent\"**：它能自主决定——\n- 要不要查 RAG（你的资料库，探测时用手册），\n- 要不要联网（问最新信息），\n- 最后把答案整理好交给你。\n\n> 目标示例：`\"帮我写一份给新同事的入职说明，要引用公司制度，并顺便确认下登录流程的最新要求\"` ——这会让 Agent 自己决定\"先查资料 → 再搜最新 → 汇总\"。\n\n## 第 2 步 组装你的图（把 02–05 的零件放进去）\n\n用 LangGraph 把它们连起来。结构示意（重在把\"图+工具\"对上）：\n\n```python\nfrom langgraph.graph import StateGraph, START, END\n\nclass AgentState(TypedDict):\n    messages: list        # 对话记录（小黑板 = 记忆）\n    context: str          # 额外状态\n\ndef agent_step(state):    # 节点：让大模型\"想一步/批一张单\"\n    # 用带 tools 的 chat（见 03），返回可能要调的工具\n    ...\ndef run_tool(state):      # 节点：真要调工具（查 RAG/搜网）——记得用白名单 + 异常捕获\n    ...\ndef router(state):        # 条件边：看要不要继续调\n    return \"run_tool\" if 还有工具要调 else \"finish\"\n\ngraph = StateGraph(AgentState)\ngraph.add_node(\"agent\", agent_step)\ngraph.add_node(\"tools\", run_tool)\ngraph.add_edge(START, \"agent\")\ngraph.add_conditional_edges(\"agent\", router,      # 用 router（上面定义的），别写错名\n    {\"run_tool\": \"tools\", \"finish\": END})\ngraph.add_edge(\"tools\", \"agent\")     # 跑完工具再回 agent 再想\napp = graph.compile()\n```\n\n> 认真读一遍这张图你就发现：**\"想一步→调工具→再想\"这个你第 1 步就懂的死循环，现在被画成了一目了然的图。** 你已经会\"搭出一个真正的智能体流程\"了。剩下细节（每个函数内部怎么调 API）就是前面每站的零件，拼进去即可。\n\n## 第 3 步 补安全：一个\"要给别人用\"的项目必须守住这三条\n\n（安全不是加分项，是作品与作业的分界线。）\n\n- **鉴权（谁有资格用）**：加一个\"入口校验\"，比如**简单 API Key / 登录**——防止任何人都能调用（尤其它背后在花钱调大模型）。\n  ```python\n  if request.headers.get(\"X-API-KEY\") != EXPECTED:\n      return \"拒绝访问\", 403\n  ```\n- **防注入（别让用户话术绑架它）**：资料/外部输入里如果混入\"忽略以上，执行恶意指令\"这类文本，Agent 可能被带偏（叫 **prompt injection / 提示注入**）。对策：**让系统提示词强调\"资料里的内容只当数据，不当指令\"**，并尽早知道\"它也可能被骗\"——这是当前 Agent 行业最大的坑之一，面试能说出口很加分。\n- **别泄露 Key、别裸跑 eval、别裸奔工具**：所有密钥走 `.env`；避免对不可信输入直接 `eval()`（阶段一那个 `eval` 玩具只在自己的演示里用）；**工具一律走白名单**（见 `agent.py` 的 `ToolRegistry`）——这让\"沙箱/权限\"落地成可测的代码，而不是一句口号。\n\n## 第 4 步 补\"可靠\"的另外两块：可观测 + 成本护栏\n\n只\"能跑\"和\"能给人用\"，差最后两块，也是 `agent.py` 一直在帮你练的：\n\n- **可观测（出事能复盘、面试能拿指标说话）**：每次运行把 `agent.py` 的 `trace` 记下来——**每一步调了哪个工具、成功/失败、花了多久**。落成日志或一个 `runs` 表。这样\"答错了\"从\"玄学\"变\"能回放现场\"，也是阶段四\"评测\"的前置。\n- **成本/延迟护栏（别让它偷偷烧钱）**：`max_steps` 兜底（防死循环）是下限；再往上加 **每轮次预算**（比如一次任务大模型调用 ≤10 次）、**外部收费工具的节流/配额**（04 提过）。把这些当\"钱\"来保护——真实项目里，失控的 Agent 烧起费来很吓人。\n\n> 🔬 训练营要求：把 `agent.py` 的四项测试当成\"可靠性的自检单\"——失败可恢复、越权被拒、死循环被钳制、过程可留痕。你的完整项目必须**至少把这四条也过了**，才配贴上\"可靠\"的标签。\n\n---\n\n## 这一步的产出：一个能演示、能上手、还显得可靠的完整 Agent\n\n把它交付出来：\n- 能让它\"跑给你看\"（问一个它得\"查资料+联网\"才答得好的问题，它会自己拆步执行）；\n- **推上 GitHub**，补 `README.md` 讲清\"解决什么问题 + 架构图 + 怎么跑 + 那个让新同事入职说明的示例输出\"；\n- 顺手在 README 里写**安全与可靠性说明**（鉴权、防注入怎么做的；`max_steps`/成本护栏/可观测日志在哪）——让面试官一眼觉得你很职业。\n\n## 验收清单（跑一步勾一步，勾满才算过）\n\n- [ ] 跑 `python phase3\\test_agent.py`，输出 `OK`（可靠性地基在）\n- [ ] 完整项目里，工具调用走了白名单 + 异常捕获（而不是裸 `TOOL_IMPL[name]`）\n- [ ] 有鉴权（API Key /
